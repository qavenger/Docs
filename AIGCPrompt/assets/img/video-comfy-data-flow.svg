<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="640" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">Comfy 数据流：先认数据类型，再连节点</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">节点名称可以变化，但模型、条件、潜码、像素与音频不能接错通道</text>
<g transform="translate(30 82)"><rect width="700" height="88" rx="12" fill="#171d26" stroke="#35404d"/><text x="18" y="27" font-size="13" font-weight="700" fill="#edf2f7">① 加载资产：一个加载动作，分出不同数据类型</text>
<g transform="translate(18 42)" font-size="10.5" text-anchor="middle"><rect width="130" height="30" rx="7" fill="#3b2a18" stroke="#ffb454"/><text x="65" y="20" fill="#edf2f7">检查点 / 组件</text><line x1="138" y1="15" x2="165" y2="15" stroke="#8793a2" marker-end="url(#arr)"/><rect x="173" width="140" height="30" rx="7" fill="#152433" stroke="#8bc5ff"/><text x="243" y="20" fill="#edf2f7">扩散模型 MODEL</text><rect x="332" width="140" height="30" rx="7" fill="#13271d" stroke="#7bd49a"/><text x="402" y="20" fill="#edf2f7">文本编码器 CLIP</text><rect x="491" width="140" height="30" rx="7" fill="#321f21" stroke="#ff9a94"/><text x="561" y="20" fill="#edf2f7">解码器 VAE</text></g></g>
<path d="M432 174V204M432 204H186V230M432 204H434V230M432 204H625V230" fill="none" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(30 238)"><rect width="310" height="133" rx="12" fill="#13271d" stroke="#7bd49a"/><text x="18" y="28" font-size="13" font-weight="700" fill="#7bd49a">② 文本编码 → 条件 CONDITIONING</text><rect x="18" y="45" width="118" height="42" rx="7" fill="#121a22"/><text x="77" y="64" text-anchor="middle" font-size="10.5" fill="#edf2f7">正向 / 负向文本</text><text x="77" y="79" text-anchor="middle" font-size="9.5" fill="#aeb9c7">自然语言</text><line x1="145" y1="66" x2="173" y2="66" stroke="#7bd49a" stroke-width="2" marker-end="url(#arr)"/><rect x="181" y="45" width="111" height="42" rx="7" fill="#152433"/><text x="236" y="64" text-anchor="middle" font-size="10.5" fill="#edf2f7">条件张量</text><text x="236" y="79" text-anchor="middle" font-size="9.5" fill="#aeb9c7">不是图像</text><text x="18" y="112" font-size="10" fill="#aeb9c7">文本编码器只生产采样条件，不直接出画面</text></g>
<g transform="translate(358 238)"><rect width="180" height="133" rx="12" fill="#152433" stroke="#8bc5ff"/><text x="16" y="28" font-size="13" font-weight="700" fill="#8bc5ff">③ 潜码 LATENT</text><rect x="16" y="45" width="148" height="42" rx="7" fill="#121a22"/><path d="M31 73L48 55 64 74 82 58 100 76 119 53 148 73" fill="none" stroke="#8bc5ff" stroke-width="2"/><text x="16" y="112" font-size="10" fill="#aeb9c7">空潜码或编码后的潜空间表示</text></g>
<g transform="translate(556 238)"><rect width="174" height="133" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="16" y="28" font-size="13" font-weight="700" fill="#ffb454">④ 采样 SAMPLER</text><text x="16" y="55" font-size="10.5" fill="#edf2f7">输入：MODEL</text><text x="16" y="75" font-size="10.5" fill="#edf2f7">条件 + LATENT</text><text x="16" y="95" font-size="10.5" fill="#edf2f7">输出：新 LATENT</text><text x="16" y="115" font-size="10" fill="#aeb9c7">采样仍未进入像素域</text></g>
<path d="M340 304H350M538 304H548" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<path d="M643 377V407M643 407H462V433" fill="none" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(30 440)"><rect width="285" height="116" rx="12" fill="#321f21" stroke="#ff9a94"/><text x="16" y="28" font-size="13" font-weight="700" fill="#ff9a94">⑤ VAE 解码：潜码 → 像素</text><rect x="16" y="46" width="108" height="42" rx="7" fill="#152433"/><text x="70" y="72" text-anchor="middle" font-size="10.5" fill="#edf2f7">LATENT</text><line x1="132" y1="67" x2="156" y2="67" stroke="#8793a2" marker-end="url(#arr)"/><rect x="164" y="46" width="104" height="42" rx="7" fill="#121a22"/><text x="216" y="72" text-anchor="middle" font-size="10.5" fill="#edf2f7">图像 / 帧</text><text x="16" y="105" font-size="10" fill="#aeb9c7">VAE 决定潜空间与像素域的转换</text></g>
<g transform="translate(333 440)"><rect width="182" height="116" rx="12" fill="#13271d" stroke="#7bd49a"/><text x="16" y="28" font-size="13" font-weight="700" fill="#7bd49a">⑥ 音频与输出</text><path d="M18 67H164M22 67L34 56 44 79 56 47 70 82 83 58 95 70 109 50 122 83 137 61 151 71 160 67" fill="none" stroke="#7bd49a" stroke-width="2"/><text x="16" y="104" font-size="10" fill="#aeb9c7">独立处理，按时间戳与画面汇合</text></g>
<line x1="523" y1="498" x2="548" y2="498" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(556 440)"><rect width="174" height="116" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="16" y="28" font-size="13" font-weight="700" fill="#ffb454">封装 OUTPUT</text><text x="16" y="55" font-size="10.5" fill="#edf2f7">帧序列 / 视频</text><text x="16" y="75" font-size="10.5" fill="#edf2f7">音频 / 封装</text><text x="16" y="98" font-size="10" fill="#aeb9c7">保存前检查尺寸与时长</text></g>
<text x="380" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：先沿端口追踪数据类型，再排查模型、条件、潜码、像素与音频的流向。</text>
</svg>