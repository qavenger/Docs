<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="600" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">相机运动系统：类型只是名词，幅度 × 速度才是控制</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">先选运动承担的叙事任务，再约束幅度、速度、起止与主体关系</text>
<g transform="translate(30 82)"><rect width="340" height="310" rx="12" fill="#171d26" stroke="#8bc5ff"/><text x="18" y="28" font-size="13" font-weight="700" fill="#8bc5ff">① 运动词库：相机如何改变关系</text><g transform="translate(18 48)" font-size="11" text-anchor="middle"><g><rect width="142" height="45" rx="8" fill="#152433"/><text x="71" y="20" fill="#edf2f7" font-weight="700">推 / 拉</text><text x="71" y="36" fill="#aeb9c7" font-size="9.5">接近重点 / 释放空间</text></g><g transform="translate(162)"><rect width="142" height="45" rx="8" fill="#152433"/><text x="71" y="20" fill="#edf2f7" font-weight="700">摇</text><text x="71" y="36" fill="#aeb9c7" font-size="9.5">视线转向新信息</text></g><g transform="translate(0 57)"><rect width="142" height="45" rx="8" fill="#13271d"/><text x="71" y="20" fill="#edf2f7" font-weight="700">移</text><text x="71" y="36" fill="#aeb9c7" font-size="9.5">横向跟随 / 显露</text></g><g transform="translate(162 57)"><rect width="142" height="45" rx="8" fill="#13271d"/><text x="71" y="20" fill="#edf2f7" font-weight="700">升 / 降</text><text x="71" y="36" fill="#aeb9c7" font-size="9.5">改变尺度与权力感</text></g><g transform="translate(0 114)"><rect width="142" height="45" rx="8" fill="#3b2a18"/><text x="71" y="20" fill="#edf2f7" font-weight="700">环绕</text><text x="71" y="36" fill="#aeb9c7" font-size="9.5">展示立体关系</text></g><g transform="translate(162 114)"><rect width="142" height="45" rx="8" fill="#3b2a18"/><text x="71" y="20" fill="#edf2f7" font-weight="700">跟随</text><text x="71" y="36" fill="#aeb9c7" font-size="9.5">保持主体相对位置</text></g></g><text x="18" y="242" font-size="11" fill="#aeb9c7">运动方向必须能画出起点与终点</text><path d="M36 271H292" stroke="#35404d" stroke-width="2" marker-end="url(#arr)"/><circle cx="36" cy="271" r="6" fill="#7bd49a"/><circle cx="292" cy="271" r="6" fill="#ffb454"/><text x="18" y="298" font-size="10.5" fill="#aeb9c7">若终点没有新增信息，就不必移动相机</text></g>
<line x1="378" y1="237" x2="402" y2="237" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(410 82)"><rect width="320" height="310" rx="12" fill="#171d26" stroke="#ffb454"/><text x="18" y="28" font-size="13" font-weight="700" fill="#ffb454">② 二维控制：幅度 × 速度</text><text x="71" y="57" font-size="10.5" fill="#aeb9c7">慢</text><text x="155" y="57" font-size="10.5" fill="#aeb9c7">稳</text><text x="239" y="57" font-size="10.5" fill="#aeb9c7">快</text><text x="11" y="101" font-size="10.5" fill="#aeb9c7">小</text><text x="11" y="165" font-size="10.5" fill="#aeb9c7">中</text><text x="11" y="229" font-size="10.5" fill="#aeb9c7">大</text><g transform="translate(37 68)" text-anchor="middle" font-size="10.5"><g fill="#152433" stroke="#315471"><rect width="76" height="52" rx="7"/><rect x="84" width="76" height="52" rx="7"/><rect x="168" width="76" height="52" rx="7"/></g><g fill="#13271d" stroke="#29553b"><rect y="62" width="76" height="52" rx="7"/><rect x="84" y="62" width="76" height="52" rx="7"/><rect x="168" y="62" width="76" height="52" rx="7"/></g><g fill="#3b2a18" stroke="#6f5535"><rect y="124" width="76" height="52" rx="7"/><rect x="84" y="124" width="76" height="52" rx="7"/><rect x="168" y="124" width="76" height="52" rx="7"/></g><g fill="#edf2f7"><text x="38" y="31">凝视</text><text x="122" y="31">微推</text><text x="206" y="31">轻甩</text><text x="38" y="93">揭示</text><text x="122" y="93">跟随</text><text x="206" y="93">追逐</text><text x="38" y="155">仪式感</text><text x="122" y="155">建立空间</text><text x="206" y="155">冲击</text></g></g><text x="18" y="278" font-size="10.5" fill="#ff9a94">强度不是越高越好：与情绪、景别、动作匹配</text><text x="18" y="297" font-size="10.5" fill="#aeb9c7">另写：启动方式 · 停止方式 · 是否跟主体</text></g>
<line x1="380" y1="400" x2="380" y2="426" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(30 434)"><rect width="700" height="105" rx="12" fill="#171d26" stroke="#35404d"/><text x="18" y="27" font-size="13" font-weight="700" fill="#edf2f7">③ 组合语法：一次只设一个主运动</text><g transform="translate(18 43)"><rect width="208" height="42" rx="7" fill="#152433"/><text x="104" y="26" text-anchor="middle" font-size="11" fill="#edf2f7">主运动：推近主体</text><line x1="216" y1="21" x2="239" y2="21" stroke="#8793a2" marker-end="url(#arr)"/><rect x="246" width="208" height="42" rx="7" fill="#13271d"/><text x="350" y="26" text-anchor="middle" font-size="11" fill="#edf2f7">辅助：轻微横移保持构图</text><line x1="462" y1="21" x2="485" y2="21" stroke="#8793a2" marker-end="url(#arr)"/><rect x="492" width="172" height="42" rx="7" fill="#321f21"/><text x="578" y="26" text-anchor="middle" font-size="11" fill="#ff9a94">避免：多方向互相抵消</text></g></g><text x="380" y="575" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：运镜写法 = 类型 + 幅度 + 速度 + 起止 + 主体关系。</text>
</svg>