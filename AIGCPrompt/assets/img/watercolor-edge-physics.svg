<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style><rect width="760" height="400" fill="#111820"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">水彩的媒介证据：水怎样移动，颜料就怎样留下</text><g transform="translate(20 55)"><rect width="170" height="250" rx="7" fill="#161d26" stroke="#303a48"/><text x="85" y="24" text-anchor="middle" font-weight="700">① 湿画法扩散</text><path d="M35 110Q50 55 95 67Q150 70 137 128Q128 172 68 162Q25 155 35 110Z" fill="#668ec4" opacity=".58"/><path d="M30 111Q47 47 99 63Q160 67 143 135" fill="none" stroke="#668ec4" stroke-width="3" opacity=".35"/><text x="85" y="194" text-anchor="middle" font-size="11">边缘沿纸纤维不规则扩散</text><text x="85" y="216" text-anchor="middle" font-size="10.5" fill="#aeb9c7">wet-on-wet blooming</text></g><g transform="translate(205 55)"><rect width="170" height="250" rx="7" fill="#161d26" stroke="#303a48"/><text x="85" y="24" text-anchor="middle" font-weight="700">② 回流 / 花椰菜</text><path d="M28 118Q35 63 82 57Q140 54 146 112Q151 169 88 170Q25 172 28 118Z" fill="#b8799d" opacity=".32"/><path d="M33 120Q40 72 83 65Q133 63 139 112Q143 158 90 162Q38 163 33 120Z" fill="none" stroke="#9e527b" stroke-width="8" opacity=".7"/><text x="85" y="194" text-anchor="middle" font-size="11">清水把半干颜料推向外圈</text><text x="85" y="216" text-anchor="middle" font-size="10.5" fill="#aeb9c7">backrun / cauliflower</text></g><g transform="translate(390 55)"><rect width="170" height="250" rx="7" fill="#161d26" stroke="#303a48"/><text x="85" y="24" text-anchor="middle" font-weight="700">③ 边缘沉淀</text><ellipse cx="85" cy="115" rx="60" ry="54" fill="#d58b44" opacity=".35"/><ellipse cx="85" cy="115" rx="60" ry="54" fill="none" stroke="#a65b22" stroke-width="10" opacity=".8"/><g stroke="#a65b22" marker-end="url(#x)"><line x1="85" y1="115" x2="42" y2="87"/><line x1="85" y1="115" x2="133" y2="135"/></g><text x="85" y="194" text-anchor="middle" font-size="11">蒸发把颜料带到湿区边缘</text><text x="85" y="216" text-anchor="middle" font-size="10.5" fill="#aeb9c7">edge pooling</text></g><g transform="translate(575 55)"><rect width="165" height="250" rx="7" fill="#161d26" stroke="#303a48"/><text x="82" y="24" text-anchor="middle" font-weight="700">④ 颗粒沉降</text><path d="M25 70Q82 55 140 70V170Q82 188 25 170Z" fill="#4b667a" opacity=".3"/><g fill="#334b5b"><circle cx="38" cy="91" r="3"/><circle cx="64" cy="142" r="4"/><circle cx="89" cy="102" r="2"/><circle cx="118" cy="153" r="4"/><circle cx="139" cy="116" r="3"/></g><g stroke="#999" opacity=".5"><path d="M25 80Q80 68 140 80M25 105Q80 92 140 105M25 130Q80 117 140 130M25 155Q80 142 140 155"/></g><text x="82" y="194" text-anchor="middle" font-size="11">重颗粒沉入冷压纸凹槽</text><text x="82" y="216" text-anchor="middle" font-size="10.5" fill="#aeb9c7">granulation</text></g><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#a65b22"/></marker></defs><text x="380" y="345" text-anchor="middle" font-size="13" fill="#edf2f7">完美、均匀、无痕的“水彩”通常只是数字柔光渐变</text><text x="380" y="372" text-anchor="middle" font-size="12" fill="#ffb454">媒介感来自有因果的缺陷：扩散、回流、沉淀、颗粒，而不是一层做旧滤镜</text></svg>