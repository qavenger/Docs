<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style><rect width="760" height="430" fill="#111820"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">真实材质需要三级细节：大形态 → 中纹理 → 微表面</text><g transform="translate(25 55)"><rect width="220" height="285" rx="8" fill="#152433" stroke="#8bc5ff"/><text x="110" y="25" text-anchor="middle" font-size="14" font-weight="700">① 只有大形态</text><path d="M35 210 L52 82 92 58 138 70 184 110 196 210Z" fill="#777"/><path d="M52 82 L72 105 92 58" fill="#aaa"/><text x="110" y="240" text-anchor="middle" font-size="12">米级：轮廓、缺口、断面</text><text x="110" y="262" text-anchor="middle" font-size="11" fill="#aeb9c7">剪影成立，但像灰模</text></g><g transform="translate(270 55)"><rect width="220" height="285" rx="8" fill="#2d1a1d" stroke="#ff9a94"/><text x="110" y="25" text-anchor="middle" font-size="14" font-weight="700">② 只有中等纹理</text><path d="M35 210 L52 82 92 58 138 70 184 110 196 210Z" fill="#999"/><g stroke="#666" stroke-width="3"><path d="M48 120 Q90 100 175 130"/><path d="M42 150 Q100 130 190 165"/><path d="M40 182 Q110 158 194 190"/></g><text x="110" y="240" text-anchor="middle" font-size="12">厘米级：层理、裂纹、色斑</text><text x="110" y="262" text-anchor="middle" font-size="11" fill="#ff9a94">AI 默认输出 = 贴图感 / 塑料感</text></g><g transform="translate(515 55)"><rect width="220" height="285" rx="8" fill="#13271d" stroke="#7bd49a"/><text x="110" y="25" text-anchor="middle" font-size="14" font-weight="700">③ 三级齐备</text><path d="M35 210 L52 82 92 58 138 70 184 110 196 210Z" fill="#777"/><g stroke="#4d4740"><path d="M48 120 Q90 100 175 130"/><path d="M42 150 Q100 130 190 165"/><path d="M40 182 Q110 158 194 190"/></g><g fill="#d9c8a8"><circle cx="75" cy="105" r="2"/><circle cx="104" cy="125" r="1.7"/><circle cx="145" cy="102" r="2"/><circle cx="166" cy="151" r="1.5"/><circle cx="82" cy="176" r="2"/></g><path d="M35 210 Q110 198 196 210" fill="none" stroke="#ffb454" stroke-width="5" opacity=".5"/><text x="110" y="240" text-anchor="middle" font-size="12">毫米级：颗粒、积灰、掠射高光</text><text x="110" y="262" text-anchor="middle" font-size="11" fill="#7bd49a">形态 + 纹理 + 表面响应 = 重量</text></g><text x="380" y="382" text-anchor="middle" font-size="13" fill="#aeb9c7">提示词顺序：先写缺口与层级结构，再写层理与风化，最后写颗粒和掠射光</text><text x="380" y="408" text-anchor="middle" font-size="12" fill="#ffb454">细节不是越多越真，而是必须分尺度、有因果、有磨损位置</text></svg>