<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><linearGradient id="cs" x1="0" x2="1"><stop offset="0" stop-color="#66d8d3"/><stop offset=".48" stop-color="#447fc2"/><stop offset="1" stop-color="#ffb454"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="560" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">60 秒节奏曲线与 Color Script</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">概念模板：节奏控制信息密度，色彩控制情绪方向；两者在转折点对齐</text>
<g transform="translate(38 82)"><rect width="684" height="246" rx="12" fill="#171d26" stroke="#8bc5ff"/><text x="18" y="28" font-size="13" font-weight="700" fill="#8bc5ff">① 节奏曲线：建立 → 加压 → 转折 → 释放</text><g transform="translate(48 52)"><path d="M0 139H584M0 93H584M0 47H584" stroke="#2b3540" stroke-width="1"/><path d="M0 145V12" stroke="#596675"/><path d="M0 145H584" stroke="#596675"/><path d="M0 128C52 119 85 125 136 100S216 59 278 75S362 24 424 34S500 73 584 18" fill="none" stroke="#ffb454" stroke-width="3"/><path d="M0 145L0 128C52 119 85 125 136 100S216 59 278 75S362 24 424 34S500 73 584 18L584 145Z" fill="#ffb454" opacity=".08"/><g fill="#111820" stroke="#ffb454" stroke-width="3"><circle cx="0" cy="128" r="5"/><circle cx="146" cy="95" r="5"/><circle cx="292" cy="67" r="5"/><circle cx="438" cy="38" r="5"/><circle cx="584" cy="18" r="5"/></g><g fill="#aeb9c7" font-size="10" text-anchor="middle"><text x="0" y="164">0秒</text><text x="146" y="164">15秒</text><text x="292" y="164">30秒</text><text x="438" y="164">45秒</text><text x="584" y="164">60秒</text></g><g fill="#edf2f7" font-size="10.5" text-anchor="middle"><text x="68" y="119">建立</text><text x="213" y="70">加压</text><text x="351" y="39">转折</text><text x="510" y="53">释放并落点</text></g></g><text x="18" y="226" font-size="10.5" fill="#aeb9c7">曲线表示相对叙事强度，不代表生成性能、评分或实测数据。</text></g>
<line x1="380" y1="334" x2="380" y2="356" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(38 364)"><rect width="684" height="130" rx="12" fill="#171d26" stroke="#35404d"/><text x="18" y="27" font-size="13" font-weight="700" fill="#edf2f7">② Color Script：青 → 蓝 → 金</text><rect x="18" y="43" width="648" height="38" rx="8" fill="url(#cs)"/><g font-size="10.5" fill="#edf2f7" text-anchor="middle"><text x="99" y="68">青｜探索与空气感</text><text x="342" y="68">蓝｜压力与未知</text><text x="578" y="68">金｜揭示与收束</text></g><g font-size="10" fill="#aeb9c7"><text x="18" y="104">色相负责段落身份</text><text x="236" y="104">明暗负责注意力</text><text x="432" y="104">饱和度留给关键转折</text></g></g><line x1="380" y1="498" x2="380" y2="512" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(120 518)"><rect width="520" height="36" rx="9" fill="#13271d" stroke="#7bd49a"/><text x="260" y="23" text-anchor="middle" font-size="10.5" fill="#edf2f7">③ 对齐门：节奏转折、色彩转场与关键动作在同一叙事节点汇合</text></g>
<text x="380" y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：先画强弱与转折，再分配色彩；不要让调色替代叙事节奏。</text>
</svg>