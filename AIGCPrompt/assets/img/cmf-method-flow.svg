<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="350" fill="#111820"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">CMF 拆解：把抽象趋势翻译成可执行的视觉规范</text><g font-size="12" text-anchor="middle"><rect x="25" y="75" width="120" height="72" rx="8" fill="#152433" stroke="#8bc5ff"/><text x="85" y="103" font-weight="700">趋势语义</text><text x="85" y="125" fill="#aeb9c7">情绪 · 人群 · 场景</text><rect x="175" y="62" width="120" height="98" rx="8" fill="#2d1a1d" stroke="#ff9a94"/><text x="235" y="88" font-weight="700">Color</text><text x="235" y="110">色相 / 明度</text><text x="235" y="129">饱和度 / 面积比</text><rect x="320" y="62" width="120" height="98" rx="8" fill="#13271d" stroke="#7bd49a"/><text x="380" y="88" font-weight="700">Material</text><text x="380" y="110">基材 / 触感</text><text x="380" y="129">透明度 / 粗糙度</text><rect x="465" y="62" width="120" height="98" rx="8" fill="#3b2a18" stroke="#ffb454"/><text x="525" y="88" font-weight="700">Finish</text><text x="525" y="110">表面工艺</text><text x="525" y="129">光泽 / 纹理 / 做旧</text><rect x="615" y="75" width="120" height="72" rx="8" fill="#152433" stroke="#8bc5ff"/><text x="675" y="103" font-weight="700">应用约束</text><text x="675" y="125" fill="#aeb9c7">载体 · 用途 · 成本</text></g><g stroke="#8793a2" stroke-width="2" marker-end="url(#a)"><line x1="145" y1="111" x2="170" y2="111"/><line x1="295" y1="111" x2="315" y2="111"/><line x1="440" y1="111" x2="460" y2="111"/><line x1="585" y1="111" x2="610" y2="111"/></g><path d="M85 180V218H675V180" fill="none" stroke="#ffb454" stroke-width="2"/><text x="380" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb454">美学定义文档：色板 + 材质清单 + 工艺规则 + 用途边界</text><line x1="380" y1="252" x2="380" y2="275" stroke="#8793a2" marker-end="url(#a)"/><rect x="180" y="282" width="400" height="45" rx="8" fill="#2e2a26"/><text x="380" y="310" text-anchor="middle" font-size="12" fill="#f0e9dd">主体 / 光 / 材质 / 风格指称 / 镜头 / 应用约束 → 提示词模板</text><text x="380" y="340" text-anchor="middle" font-size="11" fill="#aeb9c7">趋势名不是答案；能被设计、摄影、生成模型共同执行的 CMF 规范才是答案</text></svg>