<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs>
<rect width="760" height="520" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">从剧情到可生产镜头：逐层收敛</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">先确认叙事因果，再拆时间节拍；最后才把画面写成可验收的生产卡</text>
<g transform="translate(28 86)">
<g><rect width="155" height="126" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="18" y="28" font-size="12" font-weight="700" fill="#ffb454">01 剧情</text><text x="18" y="56" font-size="15" font-weight="700" fill="#edf2f7">发生了什么？</text><text x="18" y="79" font-size="11" fill="#aeb9c7">目标 · 阻力 · 转折</text><text x="18" y="99" font-size="11" fill="#aeb9c7">人物为何改变行动</text><rect x="18" y="108" width="70" height="3" rx="2" fill="#ffb454"/></g>
<line x1="163" y1="63" x2="191" y2="63" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(198)"><rect width="155" height="126" rx="12" fill="#152433" stroke="#8bc5ff"/><text x="18" y="28" font-size="12" font-weight="700" fill="#8bc5ff">02 节拍</text><text x="18" y="56" font-size="15" font-weight="700" fill="#edf2f7">何时变化？</text><text x="18" y="79" font-size="11" fill="#aeb9c7">建立 · 推进 · 反转</text><text x="18" y="99" font-size="11" fill="#aeb9c7">每拍只承担一件事</text><rect x="18" y="108" width="92" height="3" rx="2" fill="#8bc5ff"/></g>
<line x1="361" y1="63" x2="389" y2="63" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(396)"><rect width="155" height="126" rx="12" fill="#13271d" stroke="#7bd49a"/><text x="18" y="28" font-size="12" font-weight="700" fill="#7bd49a">03 镜头</text><text x="18" y="56" font-size="15" font-weight="700" fill="#edf2f7">观众看什么？</text><text x="18" y="79" font-size="11" fill="#aeb9c7">景别 · 视角 · 运镜</text><text x="18" y="99" font-size="11" fill="#aeb9c7">起帧与落帧有差异</text><rect x="18" y="108" width="116" height="3" rx="2" fill="#7bd49a"/></g>
<line x1="559" y1="63" x2="587" y2="63" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(594)"><rect width="110" height="126" rx="12" fill="#321f21" stroke="#ff9a94"/><text x="14" y="28" font-size="12" font-weight="700" fill="#ff9a94">04 生产卡</text><text x="14" y="55" font-size="13" font-weight="700" fill="#edf2f7">可执行</text><text x="14" y="77" font-size="11" fill="#aeb9c7">可复现</text><text x="14" y="97" font-size="11" fill="#aeb9c7">可验收</text><rect x="14" y="108" width="78" height="3" rx="2" fill="#ff9a94"/></g></g>
<line x1="380" y1="220" x2="380" y2="247" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(35 254)"><rect width="690" height="170" rx="12" fill="#171d26" stroke="#35404d"/><text x="22" y="29" font-size="13" font-weight="700" fill="#edf2f7">交付门禁：每一层都能回答一个明确问题</text>
<g transform="translate(22 50)"><rect width="204" height="88" rx="9" fill="#121a22" stroke="#6f5535"/><text x="14" y="24" font-size="11" font-weight="700" fill="#ffb454">叙事检查</text><text x="14" y="47" font-size="11" fill="#aeb9c7">删掉镜头后，因果是否断裂？</text><text x="14" y="68" font-size="10.5" fill="#aeb9c7">若不断裂，可能只是装饰</text></g>
<g transform="translate(243 50)"><rect width="204" height="88" rx="9" fill="#121a22" stroke="#315471"/><text x="14" y="24" font-size="11" font-weight="700" fill="#8bc5ff">视觉检查</text><text x="14" y="47" font-size="11" fill="#aeb9c7">首帧能否读出主体与关系？</text><text x="14" y="68" font-size="10.5" fill="#aeb9c7">视线先后是否符合叙事</text></g>
<g transform="translate(464 50)"><rect width="204" height="88" rx="9" fill="#121a22" stroke="#29553b"/><text x="14" y="24" font-size="11" font-weight="700" fill="#7bd49a">执行检查</text><text x="14" y="47" font-size="11" fill="#aeb9c7">动作、相机、声音是否可判定？</text><text x="14" y="68" font-size="10.5" fill="#aeb9c7">把“有感觉”改成可观察结果</text></g></g>
<path d="M35 458H725" stroke="#35404d"/><text x="380" y="487" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：镜头不是剧情的缩写，而是节拍经过视觉决策后的生产接口。</text>
</svg>