<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="400" fill="#111820"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">人物气质不是天生形容词，而是五个可控变量的合成结果</text><circle cx="380" cy="205" r="78" fill="#3b2a18" stroke="#ffb454" stroke-width="2"/><text x="380" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">人物气质</text><text x="380" y="222" text-anchor="middle" font-size="11.5" fill="#aeb9c7">权力 · 亲近 · 内省 · 活力</text><g font-size="13" text-anchor="middle"><g><rect x="45" y="75" width="155" height="62" rx="8" fill="#152433" stroke="#8bc5ff"/><text x="122" y="101" font-weight="700">① 光位与光质</text><text x="122" y="122" font-size="11">审视 / 守护 / 疏离</text></g><g><rect x="560" y="75" width="155" height="62" rx="8" fill="#13271d" stroke="#7bd49a"/><text x="638" y="101" font-weight="700">② 机位与视角</text><text x="638" y="122" font-size="11">仰拍赋权 / 平视对等</text></g><g><rect x="35" y="275" width="175" height="62" rx="8" fill="#2d1a1d" stroke="#ff9a94"/><text x="122" y="301" font-weight="700">③ 姿态与凝视</text><text x="122" y="322" font-size="11">直视对峙 / 移开内省</text></g><g><rect x="550" y="275" width="175" height="62" rx="8" fill="#3b2a18" stroke="#ffb454"/><text x="638" y="301" font-weight="700">④ 服装与材质</text><text x="638" y="322" font-size="11">结构化力量 / 流动亲和</text></g><g><rect x="292" y="320" width="176" height="62" rx="8" fill="#152433" stroke="#8bc5ff"/><text x="380" y="346" font-weight="700">⑤ 环境与景别</text><text x="380" y="367" font-size="11">处境 / 距离 / 叙事规模</text></g></g><g stroke="#8793a2" stroke-width="1.5" marker-end="url(#a)"><line x1="200" y1="115" x2="314" y2="164"/><line x1="560" y1="115" x2="446" y2="164"/><line x1="210" y1="295" x2="318" y2="243"/><line x1="550" y1="295" x2="442" y2="243"/><line x1="380" y1="320" x2="380" y2="284"/></g><text x="380" y="63" text-anchor="middle" font-size="12" fill="#aeb9c7">适用于任何性别；重点是视觉关系，不是外貌评价</text></svg>