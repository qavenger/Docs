<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#111820"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">一条游戏 CG 视频的六阶段生产线</text>

  <!-- 阶段框：两行三列 -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <!-- 第一行 -->
    <rect x="40" y="60" width="200" height="74" rx="10" fill="#3b2a18" stroke="#ffb454" stroke-width="1.5"/>
    <text x="140" y="88" fill="#ffb454">① 剧本</text>
    <text x="140" y="112" font-size="11.5" font-weight="400" fill="#aeb9c7">一句话故事 → 60 秒脚本</text>

    <rect x="280" y="60" width="200" height="74" rx="10" fill="#3b2a18" stroke="#ffb454" stroke-width="1.5"/>
    <text x="380" y="88" fill="#ffb454">② 分镜</text>
    <text x="380" y="112" font-size="11.5" font-weight="400" fill="#aeb9c7">拆成 8~12 个单镜头</text>

    <rect x="520" y="60" width="200" height="74" rx="10" fill="#3b2a18" stroke="#ffb454" stroke-width="1.5"/>
    <text x="620" y="88" fill="#ffb454">③ 首帧（图像模型）</text>
    <text x="620" y="112" font-size="11.5" font-weight="400" fill="#aeb9c7">每个镜头先出一张定帧图</text>

    <!-- 第二行 -->
    <rect x="40" y="186" width="200" height="74" rx="10" fill="#152433" stroke="#8bc5ff" stroke-width="1.5"/>
    <text x="140" y="214" fill="#8bc5ff">④ 视频音画生成</text>
    <text x="140" y="238" font-size="11.5" font-weight="400" fill="#aeb9c7">首帧 + 时间提示词 → 单镜头</text>

    <rect x="280" y="186" width="200" height="74" rx="10" fill="#152433" stroke="#8bc5ff" stroke-width="1.5"/>
    <text x="380" y="214" fill="#8bc5ff">⑤ 后期增强</text>
    <text x="380" y="238" font-size="11.5" font-weight="400" fill="#aeb9c7">超分 · 插帧 · 音频</text>

    <rect x="520" y="186" width="200" height="74" rx="10" fill="#13271d" stroke="#7bd49a" stroke-width="1.5"/>
    <text x="620" y="214" fill="#7bd49a">⑥ 剪辑合成</text>
    <text x="620" y="238" font-size="11.5" font-weight="400" fill="#aeb9c7">拼接 · 转场 · 配乐 · 字幕</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#ffb454" stroke-width="2" fill="none">
    <line x1="240" y1="97" x2="278" y2="97" marker-end="url(#arr)"/>
    <line x1="480" y1="97" x2="518" y2="97" marker-end="url(#arr)"/>
    <path d="M 620 134 L 620 160 L 140 160 L 140 184" marker-end="url(#arr)"/>
    <line x1="240" y1="223" x2="278" y2="223" marker-end="url(#arr)"/>
    <line x1="480" y1="223" x2="518" y2="223" marker-end="url(#arr)"/>
  </g>

  <text x="380" y="286" text-anchor="middle" font-size="12" fill="#8793a2">AI 辅助贯穿全流程：剧本拆分、分镜撰写、提示词改写可交给受约束的语言模型编译</text>
</svg>
