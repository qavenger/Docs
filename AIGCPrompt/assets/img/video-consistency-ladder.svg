<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Microsoft YaHei, PingFang SC, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="430" fill="#111820"/><text x="380" y="31" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">一致性投资阶梯：先用便宜约束，最后才训练 LoRA</text><text x="380" y="53" text-anchor="middle" font-size="11.5" fill="#aeb9c7">每上一级都增加维护成本；只有下一级无法满足跨镜复用时才升级</text><g transform="translate(48 82)"><rect x="0" y="252" width="130" height="64" rx="8" fill="#152433" stroke="#8bc5ff"/><text x="65" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#8bc5ff">① 锚句</text><text x="65" y="298" text-anchor="middle" font-size="10.5" fill="#aeb9c7">身份特征逐字复用</text><rect x="142" y="189" width="130" height="127" rx="8" fill="#3b2a18" stroke="#ffb454"/><text x="207" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb454">② 批准首帧</text><text x="207" y="240" text-anchor="middle" font-size="10.5" fill="#aeb9c7">构图 / 脸 / 服装</text><text x="207" y="260" text-anchor="middle" font-size="10.5" fill="#aeb9c7">进入 I2V 前验收</text><rect x="284" y="126" width="130" height="190" rx="8" fill="#13271d" stroke="#7bd49a"/><text x="349" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#7bd49a">③ 参考资产</text><text x="349" y="178" text-anchor="middle" font-size="10.5" fill="#aeb9c7">正 / 侧 / 背标准照</text><text x="349" y="198" text-anchor="middle" font-size="10.5" fill="#aeb9c7">身份与结构 token</text><rect x="426" y="63" width="130" height="253" rx="8" fill="#2d1a1d" stroke="#ff9a94"/><text x="491" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#ff9a94">④ 角色 LoRA</text><text x="491" y="116" text-anchor="middle" font-size="10.5" fill="#aeb9c7">高频跨镜复用</text><text x="491" y="136" text-anchor="middle" font-size="10.5" fill="#aeb9c7">需数据 / 训练 / 回归</text><rect x="568" y="0" width="130" height="316" rx="8" fill="#202631" stroke="#8793a2"/><text x="633" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#edf2f7">⑤ 资产流水线</text><text x="633" y="54" text-anchor="middle" font-size="10.5" fill="#aeb9c7">版本化参考与 prompt</text><text x="633" y="74" text-anchor="middle" font-size="10.5" fill="#aeb9c7">API 队列 / QC / 归档</text><g stroke="#8793a2" stroke-width="1.5" marker-end="url(#a)"><line x1="130" y1="284" x2="140" y2="284"/><line x1="272" y1="252" x2="282" y2="252"/><line x1="414" y1="221" x2="424" y2="221"/><line x1="556" y1="189" x2="566" y2="189"/></g></g><text x="380" y="416" text-anchor="middle" font-size="12" fill="#ffb454">升级判据：返工成本 × 预计复用镜头数 ＞ 建设下一层资产的成本</text></svg>