<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs>
<rect width="760" height="560" fill="#111820"/><text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">分镜格如何变成可验收的镜头生产卡</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">草图负责关系，生产卡负责约束；验收标准必须在生成之前写清</text>
<g transform="translate(30 82)"><rect width="220" height="314" rx="12" fill="#171d26" stroke="#ffb454"/><text x="18" y="28" font-size="13" font-weight="700" fill="#ffb454">① 分镜格：先看空间关系</text><g transform="translate(18 47)" fill="#121a22" stroke="#5d4931"><rect width="86" height="96" rx="7"/><rect x="98" width="86" height="96" rx="7"/><rect y="108" width="86" height="96" rx="7"/><rect x="98" y="108" width="86" height="96" rx="7"/></g><g fill="none" stroke="#aeb9c7" stroke-width="2"><circle cx="73" cy="88" r="13"/><path d="M58 126Q73 104 88 126"/><path d="M146 110L208 82"/><circle cx="184" cy="202" r="13"/><path d="M168 241Q184 218 200 241"/><path d="M50 302L101 265"/></g><g fill="#ffb454"><circle cx="199" cy="86" r="4"/><circle cx="73" cy="274" r="4"/></g><text x="18" y="277" font-size="10.5" fill="#aeb9c7">标注：主体位置 · 视线方向 · 前后景</text><text x="18" y="296" font-size="10.5" fill="#aeb9c7">不在草图里假装表达材质细节</text></g>
<line x1="258" y1="239" x2="286" y2="239" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(294 82)"><rect width="172" height="314" rx="12" fill="#152433" stroke="#8bc5ff"/><text x="16" y="28" font-size="13" font-weight="700" fill="#8bc5ff">② 提取镜头事实</text><g transform="translate(16 48)" font-size="11"><rect width="140" height="38" rx="7" fill="#121a22"/><text x="12" y="24" fill="#edf2f7">主体：谁 / 什么</text><rect y="47" width="140" height="38" rx="7" fill="#121a22"/><text x="12" y="71" fill="#edf2f7">场景：何处 / 何时</text><rect y="94" width="140" height="38" rx="7" fill="#121a22"/><text x="12" y="118" fill="#edf2f7">动作：起点 → 终点</text><rect y="141" width="140" height="38" rx="7" fill="#121a22"/><text x="12" y="165" fill="#edf2f7">相机：景别 / 运动</text><rect y="188" width="140" height="38" rx="7" fill="#121a22"/><text x="12" y="212" fill="#edf2f7">连续性：必须保留</text></g><text x="16" y="294" font-size="10.5" fill="#aeb9c7">每项都能被画面直接观察</text></g>
<line x1="474" y1="239" x2="502" y2="239" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(510 82)"><rect width="220" height="314" rx="12" fill="#13271d" stroke="#7bd49a"/><text x="16" y="28" font-size="13" font-weight="700" fill="#7bd49a">③ 镜头生产卡</text><rect x="16" y="46" width="188" height="48" rx="7" fill="#121a22"/><text x="28" y="65" font-size="10" fill="#aeb9c7">画面事实</text><text x="28" y="83" font-size="11" fill="#edf2f7">构图、主体、环境、光色</text><rect x="16" y="103" width="188" height="48" rx="7" fill="#121a22"/><text x="28" y="122" font-size="10" fill="#aeb9c7">时间事实</text><text x="28" y="140" font-size="11" fill="#edf2f7">动作顺序、运镜、落帧</text><rect x="16" y="160" width="188" height="48" rx="7" fill="#121a22"/><text x="28" y="179" font-size="10" fill="#aeb9c7">声音事实</text><text x="28" y="197" font-size="11" fill="#edf2f7">声源、出现时点、远近</text><rect x="16" y="217" width="188" height="48" rx="7" fill="#321f21" stroke="#ff9a94"/><text x="28" y="236" font-size="10" fill="#ff9a94">禁止漂移</text><text x="28" y="254" font-size="11" fill="#edf2f7">身份、文字、关键道具</text><text x="16" y="294" font-size="10.5" fill="#aeb9c7">参数是手段，验收结果才是目标</text></g>
<line x1="380" y1="404" x2="380" y2="431" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(80 438)"><rect width="600" height="67" rx="10" fill="#321f21" stroke="#ff9a94"/><text x="22" y="25" font-size="12" font-weight="700" fill="#ff9a94">④ 验收门：先比对事实，再评价美感</text><text x="22" y="47" font-size="11" fill="#edf2f7">主体是否一致？动作是否到位？镜头是否按意图结束？禁改项是否完好？</text></g><text x="380" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：分镜格给方向，生产卡给边界，验收门给“完成”的共同定义。</text>
</svg>