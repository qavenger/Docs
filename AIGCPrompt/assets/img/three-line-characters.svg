<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style><rect width="760" height="360" fill="#111820"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">线条的三种性格：同一只茶壶，三种叙事语气</text><g transform="translate(25 55)"><rect width="220" height="230" rx="8" fill="#152433" stroke="#8bc5ff"/><g fill="none" stroke="#222" stroke-width="3"><ellipse cx="108" cy="134" rx="58" ry="48"/><path d="M65 105Q108 75 153 105M166 120Q205 115 198 151Q190 170 164 159M88 83Q110 65 132 83M108 86V72"/></g><text x="110" y="198" text-anchor="middle" font-weight="700">等粗清线</text><text x="110" y="218" text-anchor="middle" font-size="11" fill="#aeb9c7">闭合 · 干净 · 信息可读</text></g><g transform="translate(270 55)"><rect width="220" height="230" rx="8" fill="#3b2a18" stroke="#ffb454"/><g fill="none" stroke="#222" stroke-linecap="round"><ellipse cx="108" cy="134" rx="58" ry="48" stroke-width="5"/><path d="M65 105Q108 75 153 105" stroke-width="2"/><path d="M166 120Q205 115 198 151Q190 170 164 159" stroke-width="7"/><path d="M88 83Q110 65 132 83M108 86V72" stroke-width="3"/></g><text x="110" y="198" text-anchor="middle" font-weight="700">提按变化线</text><text x="110" y="218" text-anchor="middle" font-size="11" fill="#aeb9c7">转折加重 · 末端出锋 · 有情绪</text></g><g transform="translate(515 55)"><rect width="220" height="230" rx="8" fill="#13271d" stroke="#7bd49a"/><g fill="none" stroke="#343b34" stroke-linecap="round"><path d="M48 136Q50 91 101 85Q160 82 171 137Q171 179 116 184Q61 184 48 136"/><path d="M52 139Q47 93 105 80Q157 82 175 132"/><path d="M60 104Q110 70 158 109M165 116Q205 109 201 153Q193 174 160 160M86 82Q112 60 137 85M106 89V67"/><path d="M78 174Q112 193 153 172"/></g><text x="110" y="198" text-anchor="middle" font-weight="700">速写松散线</text><text x="110" y="218" text-anchor="middle" font-size="11" fill="#aeb9c7">重复找形 · 不闭合 · 保留过程</text></g><text x="380" y="320" text-anchor="middle" font-size="12.5" fill="#aeb9c7">提示词要写“线的行为”，而非只写 line art：uniform / pressure-sensitive / searching strokes</text><text x="380" y="344" text-anchor="middle" font-size="12" fill="#ffb454">AI 最爱自动加渐变和阴影；清线派必须明确 no gradients, no cross-hatching</text></svg>