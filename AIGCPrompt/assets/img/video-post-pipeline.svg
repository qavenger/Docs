<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8bc5ff"/>
    </marker>
  </defs>
  <rect width="760" height="260" fill="#111820"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">后期增强管线：先诊断问题，再选择空间与时间工具</text>

  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="20" y="70" width="130" height="86" rx="10" fill="#171d26" stroke="#8793a2" stroke-width="1.2"/>
    <text x="85" y="104" fill="#aeb9c7">原始视频</text>
    <text x="85" y="126" font-size="11" font-weight="400" fill="#8793a2">如 768×432</text>
    <text x="85" y="143" font-size="11" font-weight="400" fill="#8793a2">24fps · 带噪</text>

    <rect x="180" y="70" width="130" height="86" rx="10" fill="#2d1a1d" stroke="#ff9a94" stroke-width="1.5"/>
    <text x="245" y="98" fill="#8a2f28">① 源片诊断</text>
    <text x="245" y="120" font-size="11" font-weight="400" fill="#8a5a55">内容锁定后处理</text>
    <text x="245" y="138" font-size="11" font-weight="400" fill="#8a5a55">检查闪烁 / 块噪</text>
    <text x="245" y="152" font-size="11" font-weight="400" fill="#8a5a55">先做短段 A/B</text>

    <rect x="340" y="70" width="130" height="86" rx="10" fill="#152433" stroke="#8bc5ff" stroke-width="1.5"/>
    <text x="405" y="98" fill="#8bc5ff">② 超分修复</text>
    <text x="405" y="120" font-size="11" font-weight="400" fill="#5d6f85">选择时序感知工具</text>
    <text x="405" y="138" font-size="11" font-weight="400" fill="#5d6f85">时序感知防闪烁</text>
    <text x="405" y="152" font-size="11" font-weight="400" fill="#5d6f85">→ 1080p</text>

    <rect x="500" y="70" width="110" height="86" rx="10" fill="#13271d" stroke="#7bd49a" stroke-width="1.5"/>
    <text x="555" y="98" fill="#7bd49a">③ 插帧</text>
    <text x="555" y="120" font-size="11" font-weight="400" fill="#5f7a5a">RIFE ×2</text>
    <text x="555" y="138" font-size="11" font-weight="400" fill="#5f7a5a">24 → 48fps</text>
    <text x="555" y="152" font-size="11" font-weight="400" fill="#5f7a5a">大运动用 FILM</text>

    <rect x="640" y="70" width="100" height="86" rx="10" fill="#3b2a18" stroke="#ffb454" stroke-width="1.5"/>
    <text x="690" y="98" fill="#ffb454">④ 编码</text>
    <text x="690" y="120" font-size="11" font-weight="400" fill="#8a6a4a">VHS 合成</text>
    <text x="690" y="138" font-size="11" font-weight="400" fill="#8a6a4a">h264/h265</text>
    <text x="690" y="152" font-size="11" font-weight="400" fill="#8a6a4a">带回音频</text>
  </g>

  <g stroke="#8bc5ff" stroke-width="2" fill="none">
    <line x1="150" y1="113" x2="178" y2="113" marker-end="url(#arr2)"/>
    <line x1="310" y1="113" x2="338" y2="113" marker-end="url(#arr2)"/>
    <line x1="470" y1="113" x2="498" y2="113" marker-end="url(#arr2)"/>
    <line x1="610" y1="113" x2="638" y2="113" marker-end="url(#arr2)"/>
  </g>

  <rect x="60" y="186" width="640" height="52" rx="8" fill="#2d1a1d" stroke="#ecc5c2"/>
  <text x="380" y="207" text-anchor="middle" font-size="12.5" fill="#ff9a94" font-weight="700">⚠ 顺序不是口号：比较“先超分/先插帧”短段，以闪烁、边缘和总成本决定</text>
  <text x="380" y="227" text-anchor="middle" font-size="12.5" fill="#ff9a94" font-weight="700">⚠ 单帧看起来更锐不等于视频更好；新增细节必须跨帧稳定</text>
</svg>
