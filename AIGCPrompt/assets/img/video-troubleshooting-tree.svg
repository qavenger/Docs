<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="680" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">视频故障树：先分类，再只改一个变量</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">同一个坏结果可能来自不同环节；按症状定位，避免同时重写提示、换模型与改后期</text>
<g transform="translate(205 78)"><rect width="350" height="68" rx="12" fill="#321f21" stroke="#ff9a94"/><text x="175" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ff9a94">根节点｜成片没有达到镜头卡</text><text x="175" y="49" text-anchor="middle" font-size="10.5" fill="#edf2f7">先记录：起帧、问题首次出现时点、落帧、声音状态</text></g>
<path d="M380 150V180M380 180H84V209M380 180H230V209M380 180V209M380 180H530V209M380 180H676V209" fill="none" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(15 216)"><rect width="138" height="336" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="69" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb454">① 内容错</text><text x="14" y="52" font-size="10" fill="#aeb9c7">症状</text><text x="14" y="72" font-size="10.5" fill="#edf2f7">漏主体 / 加戏</text><text x="14" y="90" font-size="10.5" fill="#edf2f7">动作顺序错误</text><path d="M14 108H124" stroke="#6f5535"/><text x="14" y="130" font-size="10" fill="#aeb9c7">先查</text><text x="14" y="150" font-size="10.5" fill="#edf2f7">镜头卡是否含糊</text><text x="14" y="168" font-size="10.5" fill="#edf2f7">优先级是否冲突</text><path d="M14 186H124" stroke="#6f5535"/><text x="14" y="208" font-size="10" fill="#aeb9c7">只改</text><text x="14" y="230" font-size="10.5" fill="#edf2f7">删非必要信息</text><text x="14" y="248" font-size="10.5" fill="#edf2f7">明确起止动作</text><rect x="14" y="276" width="110" height="42" rx="7" fill="#121a22"/><text x="69" y="294" text-anchor="middle" font-size="9.5" fill="#ffb454">复测门</text><text x="69" y="309" text-anchor="middle" font-size="9.5" fill="#edf2f7">事实逐项对齐</text></g>
<g transform="translate(161 216)"><rect width="138" height="336" rx="12" fill="#321f21" stroke="#ff9a94"/><text x="69" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ff9a94">② 身份漂</text><text x="14" y="52" font-size="10" fill="#aeb9c7">症状</text><text x="14" y="72" font-size="10.5" fill="#edf2f7">脸、服饰变化</text><text x="14" y="90" font-size="10.5" fill="#edf2f7">关键道具变形</text><path d="M14 108H124" stroke="#6b4144"/><text x="14" y="130" font-size="10" fill="#aeb9c7">先查</text><text x="14" y="150" font-size="10.5" fill="#edf2f7">参考是否一致</text><text x="14" y="168" font-size="10.5" fill="#edf2f7">遮挡是否过长</text><path d="M14 186H124" stroke="#6b4144"/><text x="14" y="208" font-size="10" fill="#aeb9c7">只改</text><text x="14" y="230" font-size="10.5" fill="#edf2f7">强化身份锚点</text><text x="14" y="248" font-size="10.5" fill="#edf2f7">缩短失联段落</text><rect x="14" y="276" width="110" height="42" rx="7" fill="#121a22"/><text x="69" y="294" text-anchor="middle" font-size="9.5" fill="#ff9a94">复测门</text><text x="69" y="309" text-anchor="middle" font-size="9.5" fill="#edf2f7">逐帧身份连续</text></g>
<g transform="translate(307 216)"><rect width="138" height="336" rx="12" fill="#152433" stroke="#8bc5ff"/><text x="69" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#8bc5ff">③ 运动错</text><text x="14" y="52" font-size="10" fill="#aeb9c7">症状</text><text x="14" y="72" font-size="10.5" fill="#edf2f7">方向反 / 速度跳</text><text x="14" y="90" font-size="10.5" fill="#edf2f7">相机与主体打架</text><path d="M14 108H124" stroke="#315471"/><text x="14" y="130" font-size="10" fill="#aeb9c7">先查</text><text x="14" y="150" font-size="10.5" fill="#edf2f7">起止是否明确</text><text x="14" y="168" font-size="10.5" fill="#edf2f7">主运动是否唯一</text><path d="M14 186H124" stroke="#315471"/><text x="14" y="208" font-size="10" fill="#aeb9c7">只改</text><text x="14" y="230" font-size="10.5" fill="#edf2f7">减小幅度速度</text><text x="14" y="248" font-size="10.5" fill="#edf2f7">拆分复杂动作</text><rect x="14" y="276" width="110" height="42" rx="7" fill="#121a22"/><text x="69" y="294" text-anchor="middle" font-size="9.5" fill="#8bc5ff">复测门</text><text x="69" y="309" text-anchor="middle" font-size="9.5" fill="#edf2f7">轨迹与落帧正确</text></g>
<g transform="translate(453 216)"><rect width="138" height="336" rx="12" fill="#13271d" stroke="#7bd49a"/><text x="69" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#7bd49a">④ 颜色错</text><text x="14" y="52" font-size="10" fill="#aeb9c7">症状</text><text x="14" y="72" font-size="10.5" fill="#edf2f7">色温跳 / 闪烁</text><text x="14" y="90" font-size="10.5" fill="#edf2f7">主体颜色漂移</text><path d="M14 108H124" stroke="#29553b"/><text x="14" y="130" font-size="10" fill="#aeb9c7">先查</text><text x="14" y="150" font-size="10.5" fill="#edf2f7">光源是否连续</text><text x="14" y="168" font-size="10.5" fill="#edf2f7">是否逐帧增强</text><path d="M14 186H124" stroke="#29553b"/><text x="14" y="208" font-size="10" fill="#aeb9c7">只改</text><text x="14" y="230" font-size="10.5" fill="#edf2f7">锁定主光与色相</text><text x="14" y="248" font-size="10.5" fill="#edf2f7">先稳时域再调色</text><rect x="14" y="276" width="110" height="42" rx="7" fill="#121a22"/><text x="69" y="294" text-anchor="middle" font-size="9.5" fill="#7bd49a">复测门</text><text x="69" y="309" text-anchor="middle" font-size="9.5" fill="#edf2f7">播放无色彩跳变</text></g>
<g transform="translate(599 216)"><rect width="138" height="336" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="69" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb454">⑤ 音频错</text><text x="14" y="52" font-size="10" fill="#aeb9c7">症状</text><text x="14" y="72" font-size="10.5" fill="#edf2f7">不同步 / 声源错</text><text x="14" y="90" font-size="10.5" fill="#edf2f7">对白被音乐遮挡</text><path d="M14 108H124" stroke="#6f5535"/><text x="14" y="130" font-size="10" fill="#aeb9c7">先查</text><text x="14" y="150" font-size="10.5" fill="#edf2f7">时间锚点是否对</text><text x="14" y="168" font-size="10.5" fill="#edf2f7">分层是否独立</text><path d="M14 186H124" stroke="#6f5535"/><text x="14" y="208" font-size="10" fill="#aeb9c7">只改</text><text x="14" y="230" font-size="10.5" fill="#edf2f7">对齐可见事件</text><text x="14" y="248" font-size="10.5" fill="#edf2f7">对白优先混音</text><rect x="14" y="276" width="110" height="42" rx="7" fill="#121a22"/><text x="69" y="294" text-anchor="middle" font-size="9.5" fill="#ffb454">复测门</text><text x="69" y="309" text-anchor="middle" font-size="9.5" fill="#edf2f7">静音分层后复听</text></g>
<path d="M84 560V584H676V560" fill="none" stroke="#8793a2" stroke-width="2"/><line x1="380" y1="584" x2="380" y2="606" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(145 612)"><rect width="470" height="38" rx="9" fill="#171d26" stroke="#35404d"/><text x="235" y="24" text-anchor="middle" font-size="11" fill="#edf2f7">复测循环：固定其他条件 → 改一项 → 对照镜头卡 → 记录结果</text></g>
<text x="380" y="671" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：症状先归类，变量一次只改一个；复测通过后再进入下一问题。</text>
</svg>