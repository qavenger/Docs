<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#315471" stroke-width="1"/></pattern></defs><rect width="760" height="570" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">空间超分 vs 时域一致性：清楚与稳定是两道题</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">空间处理观察单帧细节，时域处理观察跨帧关系；正确顺序取决于缺陷来源</text>
<g transform="translate(250 78)"><rect width="260" height="72" rx="12" fill="#171d26" stroke="#35404d"/><text x="130" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#edf2f7">① 输入诊断：问题出现在哪里？</text><text x="130" y="50" text-anchor="middle" font-size="10.5" fill="#aeb9c7">暂停看细节｜连续播放看闪烁与漂移</text></g>
<path d="M380 154V180M380 180H200V207M380 180H560V207" fill="none" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(30 214)"><rect width="330" height="238" rx="12" fill="#152433" stroke="#8bc5ff"/><text x="18" y="29" font-size="14" font-weight="700" fill="#8bc5ff">② 空间超分｜一帧内部</text><g transform="translate(18 48)"><rect width="110" height="94" rx="8" fill="url(#grid)" stroke="#315471"/><circle cx="55" cy="47" r="20" fill="#8bc5ff" opacity=".32"/><path d="M42 60L55 31 70 61" fill="none" stroke="#edf2f7" stroke-width="2"/><line x1="120" y1="47" x2="150" y2="47" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/><rect x="160" width="134" height="94" rx="8" fill="#121a22" stroke="#8bc5ff"/><circle cx="227" cy="47" r="22" fill="#8bc5ff" opacity=".22"/><path d="M210 66L226 24 244 67M215 51H238" fill="none" stroke="#edf2f7" stroke-width="2"/></g><text x="18" y="168" font-size="11" font-weight="700" fill="#edf2f7">擅长</text><text x="18" y="190" font-size="10.5" fill="#aeb9c7">边缘、纹理、可读细节与输出尺寸</text><text x="18" y="214" font-size="10.5" fill="#ff9a94">风险：逐帧各自“猜细节”，可能放大闪烁</text></g>
<g transform="translate(400 214)"><rect width="330" height="238" rx="12" fill="#13271d" stroke="#7bd49a"/><text x="18" y="29" font-size="14" font-weight="700" fill="#7bd49a">③ 时域一致性｜帧与帧之间</text><g transform="translate(18 48)"><g fill="#121a22" stroke="#29553b"><rect width="78" height="94" rx="7"/><rect x="96" width="78" height="94" rx="7"/><rect x="192" width="78" height="94" rx="7"/></g><g fill="#7bd49a" opacity=".7"><circle cx="31" cy="47" r="12"/><circle cx="127" cy="47" r="12"/><circle cx="223" cy="47" r="12"/></g><path d="M44 47H109M140 47H205" stroke="#7bd49a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/></g><text x="18" y="168" font-size="11" font-weight="700" fill="#edf2f7">擅长</text><text x="18" y="190" font-size="10.5" fill="#aeb9c7">身份、纹理、运动轨迹与亮度连续</text><text x="18" y="214" font-size="10.5" fill="#ff9a94">风险：过度平滑会削弱真实变化与细节</text></g>
<path d="M195 458V480H380M565 458V480H380V499" fill="none" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(160 506)"><rect width="440" height="38" rx="9" fill="#3b2a18" stroke="#ffb454"/><text x="220" y="24" text-anchor="middle" font-size="11" fill="#edf2f7">④ 联合验收：暂停够清楚，播放不跳动，运动仍自然</text></g>
<text x="380" y="563" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：空间超分修单帧，时域一致性修跨帧；先诊断，再串联。</text>
</svg>