<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style><defs><linearGradient id="rain" x1="0" x2="1"><stop stop-color="#e95b68"/><stop offset=".2" stop-color="#e8b84b"/><stop offset=".4" stop-color="#6abf69"/><stop offset=".65" stop-color="#45a8c8"/><stop offset="1" stop-color="#7b61b3"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#aeb9c7"/></marker></defs><rect width="760" height="410" fill="#111820"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">虹彩不是色散：两种“彩色高光”的物理来源</text><g transform="translate(28 52)"><rect width="340" height="280" rx="8" fill="#152433" stroke="#8bc5ff"/><text x="170" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#8bc5ff">薄膜干涉 · iridescence</text><line x1="40" y1="82" x2="150" y2="125" stroke="#aeb9c7" stroke-width="3" marker-end="url(#a)"/><rect x="135" y="120" width="160" height="8" fill="url(#rain)" opacity=".8"/><rect x="135" y="146" width="160" height="8" fill="url(#rain)" opacity=".55"/><line x1="150" y1="125" x2="80" y2="62" stroke="#e95b68" stroke-width="2"/><line x1="150" y1="150" x2="92" y2="76" stroke="#45a8c8" stroke-width="2"/><text x="215" y="102" font-size="11">上、下表面各反射一路</text><text x="215" y="174" font-size="11">光程差 ≈ 2nd cosθ</text><path d="M65 215 Q115 180 170 215T285 215" fill="none" stroke="url(#rain)" stroke-width="15"/><text x="170" y="250" text-anchor="middle" font-size="12">同一曲面因朝向不同而换色</text><text x="170" y="270" text-anchor="middle" font-size="11" fill="#aeb9c7">肥皂泡 · 油膜 · 珍珠母贝 · 甲虫壳</text></g><g transform="translate(392 52)"><rect width="340" height="280" rx="8" fill="#3b2a18" stroke="#ffb454"/><text x="170" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">色散 · dispersion</text><line x1="35" y1="130" x2="130" y2="130" stroke="#777" stroke-width="5"/><polygon points="130,72 130,190 235,130" fill="#dce8ff" stroke="#8bc5ff" stroke-width="2"/><g stroke-width="3"><line x1="235" y1="130" x2="310" y2="80" stroke="#7b61b3"/><line x1="235" y1="130" x2="310" y2="103" stroke="#45a8c8"/><line x1="235" y1="130" x2="310" y2="126" stroke="#6abf69"/><line x1="235" y1="130" x2="310" y2="150" stroke="#e8b84b"/><line x1="235" y1="130" x2="310" y2="176" stroke="#e95b68"/></g><text x="170" y="217" text-anchor="middle" font-size="12">不同波长折射率不同：n蓝 ＞ n红</text><text x="170" y="241" text-anchor="middle" font-size="12">颜色按固定光谱顺序被“甩开”</text><text x="170" y="270" text-anchor="middle" font-size="11" fill="#aeb9c7">棱镜 · 钻石火彩 · 水晶焦散</text></g><text x="380" y="370" text-anchor="middle" font-size="13" fill="#edf2f7">判断口诀：<tspan fill="#8bc5ff" font-weight="700">颜色随视角漂移</tspan>是干涉；<tspan fill="#ffb454" font-weight="700">白光被分成有序光谱</tspan>是色散</text><text x="380" y="395" text-anchor="middle" font-size="12" fill="#aeb9c7">提示词：thin-film interference / angle-dependent iridescence　≠　spectral dispersion / prismatic fire</text></svg>