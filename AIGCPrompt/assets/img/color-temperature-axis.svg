<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <rect width="760" height="470" fill="#111820"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">色温轴：从 1800K 到 12000K</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#aeb9c7">物理上色温越高越蓝，心理上却越"冷" —— 这个错位是设计中最常见的混淆点</text>

  <!-- 色温渐变条 -->
  <defs>
    <linearGradient id="ct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff7b28"/>
      <stop offset="12%"  stop-color="#ff9d4a"/>
      <stop offset="26%"  stop-color="#ffc178"/>
      <stop offset="40%"  stop-color="#ffddb0"/>
      <stop offset="52%"  stop-color="#fff4e4"/>
      <stop offset="60%"  stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#eaf1ff"/>
      <stop offset="82%"  stop-color="#cbdcff"/>
      <stop offset="100%" stop-color="#9fbdff"/>
    </linearGradient>
  </defs>
  <rect x="50" y="72" width="660" height="46" rx="6" fill="url(#ct)" stroke="#303a48"/>

  <!-- 刻度 -->
  <g font-size="11" fill="#edf2f7" text-anchor="middle">
    <g stroke="#aeb9c7" stroke-width="1">
      <line x1="62"  y1="118" x2="62"  y2="128"/>
      <line x1="150" y1="118" x2="150" y2="128"/>
      <line x1="238" y1="118" x2="238" y2="128"/>
      <line x1="348" y1="118" x2="348" y2="128"/>
      <line x1="446" y1="118" x2="446" y2="128"/>
      <line x1="534" y1="118" x2="534" y2="128"/>
      <line x1="622" y1="118" x2="622" y2="128"/>
      <line x1="700" y1="118" x2="700" y2="128"/>
    </g>
    <text x="62"  y="142">1800K</text>
    <text x="150" y="142">2800K</text>
    <text x="238" y="142">3200K</text>
    <text x="348" y="142">4300K</text>
    <text x="446" y="142">5600K</text>
    <text x="534" y="142">6500K</text>
    <text x="622" y="142">8000K</text>
    <text x="700" y="142">12000K</text>
  </g>

  <!-- 光源标注 -->
  <g font-size="11.5" text-anchor="middle">
    <g fill="#edf2f7" font-weight="700">
      <text x="62"  y="168">烛光</text>
      <text x="150" y="168">钨丝灯</text>
      <text x="238" y="168">影棚钨丝</text>
      <text x="348" y="168">日出日落</text>
      <text x="446" y="168">正午日光</text>
      <text x="534" y="168">阴天</text>
      <text x="622" y="168">晴天阴影</text>
      <text x="700" y="168">蓝调时刻</text>
    </g>
    <g fill="#8793a2" font-size="10">
      <text x="62"  y="183">candlelight</text>
      <text x="150" y="183">tungsten</text>
      <text x="238" y="183">3200K studio</text>
      <text x="348" y="183">golden hour</text>
      <text x="446" y="183">daylight D55</text>
      <text x="534" y="183">overcast</text>
      <text x="622" y="183">open shade</text>
      <text x="700" y="183">blue hour</text>
    </g>
  </g>

  <!-- 心理感受轴（反向） -->
  <g>
    <rect x="50" y="204" width="660" height="34" rx="6" fill="#161d26" stroke="#303a48"/>
    <text x="70" y="226" font-size="12.5" font-weight="700" fill="#ffb454">心理"暖"</text>
    <text x="660" y="226" font-size="12.5" font-weight="700" fill="#8bc5ff" text-anchor="end">心理"冷"</text>
    <line x1="150" y1="221" x2="600" y2="221" stroke="#8793a2" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="380" y="226" font-size="11.5" fill="#aeb9c7" text-anchor="middle">安全 · 怀旧 · 亲密 ————→ 疏离 · 理性 · 危险</text>
  </g>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#ff9a94">↑ 注意方向相反：低色温 = 物理上"冷"的黑体，却是心理上最"暖"的光</text>

  <!-- 白平衡说明 -->
  <g>
    <rect x="50" y="278" width="320" height="112" rx="8" fill="#152433" stroke="#8bc5ff" stroke-width="1.3"/>
    <text x="70" y="302" font-size="14" font-weight="700" fill="#8bc5ff">白平衡：同一场景的两副面孔</text>
    <text x="70" y="324" font-size="11.5" fill="#aeb9c7">相机把哪个色温判为"白"，决定整幅画的偏色</text>
    <g font-size="11">
      <rect x="70" y="334" width="130" height="42" rx="5" fill="#ffe8cc" stroke="#634b2c"/>
      <text x="135" y="351" text-anchor="middle" font-weight="700" fill="#edf2f7">白平衡设低</text>
      <text x="135" y="367" text-anchor="middle" fill="#aeb9c7">画面整体偏暖</text>

      <rect x="212" y="334" width="130" height="42" rx="5" fill="#dce8ff" stroke="#315471"/>
      <text x="277" y="351" text-anchor="middle" font-weight="700" fill="#edf2f7">白平衡设高</text>
      <text x="277" y="367" text-anchor="middle" fill="#aeb9c7">画面整体偏冷</text>
    </g>
  </g>

  <!-- 冷暖对冲 -->
  <g>
    <rect x="390" y="278" width="320" height="112" rx="8" fill="#3b2a18" stroke="#ffb454" stroke-width="1.3"/>
    <text x="410" y="302" font-size="14" font-weight="700" fill="#ffb454">冷暖对冲：最有效也最被滥用</text>
    <text x="410" y="324" font-size="11.5" fill="#aeb9c7">主体用暖光，环境/轮廓用冷光，拉开层次</text>
    <g>
      <rect x="410" y="334" width="280" height="42" rx="5" fill="#111820" stroke="#634b2c"/>
      <circle cx="452" cy="355" r="15" fill="#ffb066"/>
      <text x="452" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#7a3d00">暖主体</text>
      <rect x="480" y="342" width="196" height="26" rx="4" fill="#5b7fb8"/>
      <text x="578" y="359" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">冷环境 / 冷轮廓光</text>
    </g>
  </g>

  <!-- 提示词建议 -->
  <g>
    <rect x="50" y="404" width="660" height="48" rx="8" fill="#13271d" stroke="#7bd49a" stroke-width="1.3"/>
    <text x="70" y="426" font-size="12.5" font-weight="700" fill="#7bd49a">提示词实测建议</text>
    <text x="70" y="444" font-size="11.5" fill="#edf2f7">直接写开尔文值 + 光源名比写形容词稳：<tspan font-family="Consolas, monospace" fill="#ffb454">3200K tungsten key light</tspan> ＞ <tspan font-family="Consolas, monospace" fill="#8793a2">warm light</tspan>　（摄影语料里前者高频出现）</text>
  </g>
</svg>
