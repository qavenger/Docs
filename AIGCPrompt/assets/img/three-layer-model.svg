<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <rect width="760" height="470" fill="#111820"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">三层要素模型：从"想要好看"到可执行的提示词</text>

  <!-- 第三层 应用方向 -->
  <g>
    <rect x="60" y="52" width="640" height="106" rx="8" fill="#152433" stroke="#8bc5ff" stroke-width="1.5"/>
    <rect x="60" y="52" width="7" height="106" rx="3" fill="#8bc5ff"/>
    <text x="86" y="78" font-size="15" font-weight="700" fill="#8bc5ff">第 3 层 · 应用方向要素（用途层）</text>
    <text x="86" y="99" font-size="12.5" fill="#aeb9c7">问："这张图要拿去干什么？" —— 决定构图、画幅、留白、光照中性度</text>
    <g font-size="11.5" fill="#edf2f7">
      <rect x="86" y="110" width="132" height="34" rx="5" fill="#111820" stroke="#315471"/>
      <text x="152" y="126" text-anchor="middle" font-weight="700">角色原画</text>
      <text x="152" y="139" text-anchor="middle" font-size="10.5" fill="#aeb9c7">全身 / 中性光</text>

      <rect x="230" y="110" width="132" height="34" rx="5" fill="#111820" stroke="#315471"/>
      <text x="296" y="126" text-anchor="middle" font-weight="700">宣传 KV</text>
      <text x="296" y="139" text-anchor="middle" font-size="10.5" fill="#aeb9c7">戏剧性 / 留文案位</text>

      <rect x="374" y="110" width="132" height="34" rx="5" fill="#111820" stroke="#315471"/>
      <text x="440" y="126" text-anchor="middle" font-weight="700">书籍封面</text>
      <text x="440" y="139" text-anchor="middle" font-size="10.5" fill="#aeb9c7">竖构图 / 视觉锤</text>

      <rect x="518" y="110" width="150" height="34" rx="5" fill="#111820" stroke="#315471"/>
      <text x="593" y="126" text-anchor="middle" font-weight="700">纹理素材</text>
      <text x="593" y="139" text-anchor="middle" font-size="10.5" fill="#aeb9c7">无缝 / 正交 / 平光</text>
    </g>
  </g>

  <!-- 第二层 风格 -->
  <g>
    <rect x="60" y="172" width="640" height="106" rx="8" fill="#3b2a18" stroke="#ffb454" stroke-width="1.5"/>
    <rect x="60" y="172" width="7" height="106" rx="3" fill="#ffb454"/>
    <text x="86" y="198" font-size="15" font-weight="700" fill="#ffb454">第 2 层 · 风格要素（文化层）</text>
    <text x="86" y="219" font-size="12.5" fill="#aeb9c7">问："属于哪个视觉传统？" —— 靠<tspan font-weight="700" fill="#ffb454">指称</tspan>，不能靠描述</text>
    <g font-size="11.5" fill="#edf2f7">
      <rect x="86" y="230" width="132" height="34" rx="5" fill="#111820" stroke="#634b2c"/>
      <text x="152" y="246" text-anchor="middle" font-weight="700">艺术流派</text>
      <text x="152" y="259" text-anchor="middle" font-size="10.5" fill="#aeb9c7">宋画 / 巴洛克 / 印象派</text>

      <rect x="230" y="230" width="132" height="34" rx="5" fill="#111820" stroke="#634b2c"/>
      <text x="296" y="246" text-anchor="middle" font-weight="700">插画语汇</text>
      <text x="296" y="259" text-anchor="middle" font-size="10.5" fill="#aeb9c7">穆夏 / 莫比厄斯</text>

      <rect x="374" y="230" width="132" height="34" rx="5" fill="#111820" stroke="#634b2c"/>
      <text x="440" y="246" text-anchor="middle" font-weight="700">媒介工艺</text>
      <text x="440" y="259" text-anchor="middle" font-size="10.5" fill="#aeb9c7">水彩 / 水墨 / 剪纸</text>

      <rect x="518" y="230" width="150" height="34" rx="5" fill="#111820" stroke="#634b2c"/>
      <text x="593" y="246" text-anchor="middle" font-weight="700">时代与地域</text>
      <text x="593" y="259" text-anchor="middle" font-size="10.5" fill="#aeb9c7">复古美式 / 东方</text>
    </g>
  </g>

  <!-- 第一层 审美/物理 -->
  <g>
    <rect x="60" y="292" width="640" height="106" rx="8" fill="#13271d" stroke="#7bd49a" stroke-width="1.5"/>
    <rect x="60" y="292" width="7" height="106" rx="3" fill="#7bd49a"/>
    <text x="86" y="318" font-size="15" font-weight="700" fill="#7bd49a">第 1 层 · 审美要素（物理层）</text>
    <text x="86" y="339" font-size="12.5" fill="#aeb9c7">问："光和物质如何相互作用？" —— 客观、可测量、<tspan font-weight="700" fill="#7bd49a">跨风格通用</tspan></text>
    <g font-size="11.5" fill="#edf2f7">
      <rect x="86" y="350" width="180" height="34" rx="5" fill="#111820" stroke="#29553b"/>
      <text x="176" y="366" text-anchor="middle" font-weight="700">光　第 3–5 章</text>
      <text x="176" y="379" text-anchor="middle" font-size="10.5" fill="#aeb9c7">方向 / 软硬 / 色温 / 反差</text>

      <rect x="278" y="350" width="180" height="34" rx="5" fill="#111820" stroke="#29553b"/>
      <text x="368" y="366" text-anchor="middle" font-weight="700">材质　第 6–9 章</text>
      <text x="368" y="379" text-anchor="middle" font-size="10.5" fill="#aeb9c7">粗糙度 / 金属度 / 透射</text>

      <rect x="470" y="350" width="198" height="34" rx="5" fill="#111820" stroke="#29553b"/>
      <text x="569" y="366" text-anchor="middle" font-weight="700">空间与镜头</text>
      <text x="569" y="379" text-anchor="middle" font-size="10.5" fill="#aeb9c7">焦距 / 景深 / 机位 / 透视</text>
    </g>
  </g>

  <!-- 底部箭头与说明 -->
  <g>
    <line x1="34" y1="60" x2="34" y2="390" stroke="#ffb454" stroke-width="2" marker-end="url(#ar)"/>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb454"/>
      </marker>
    </defs>
    <text x="20" y="230" font-size="11.5" fill="#ffb454" font-weight="700" transform="rotate(-90 20 230)" text-anchor="middle">写提示词时的组装顺序</text>
  </g>

  <text x="380" y="428" text-anchor="middle" font-size="12.5" fill="#aeb9c7">物理层用<tspan font-weight="700" fill="#7bd49a">描述</tspan>（可调试）　·　文化层用<tspan font-weight="700" fill="#ffb454">指称</tspan>（指向已有集群）　·　用途层做<tspan font-weight="700" fill="#8bc5ff">约束</tspan>（决定能否交付）</text>
  <text x="380" y="452" text-anchor="middle" font-size="12" fill="#8793a2">三层缺一层，图就"看着还行但用不了"</text>
</svg>
