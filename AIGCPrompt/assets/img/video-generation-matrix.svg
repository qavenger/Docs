<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8793a2"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#111820"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">生成范式矩阵：输入的确定性越多，输出的一致性越强</text>

  <!-- 表头 -->
  <g font-size="13" font-weight="700" fill="#8793a2" text-anchor="middle">
    <text x="150" y="62">输入（条件）</text>
    <text x="330" y="62">范式</text>
    <text x="500" y="62">一致性贡献</text>
    <text x="645" y="62">防脸崩能力</text>
  </g>

  <!-- 行模板：y = 80 + i*54 -->
  <g font-size="12.5" text-anchor="middle">
    <!-- 文生图 -->
    <rect x="30" y="76" width="700" height="46" rx="9" fill="#161d26" stroke="#303a48"/>
    <text x="150" y="104" fill="#aeb9c7">纯文本</text>
    <text x="330" y="104" font-weight="700" fill="#edf2f7">文生图 T2I</text>
    <text x="500" y="104" fill="#aeb9c7">零（每张都随机）</text>
    <text x="645" y="104" fill="#aeb9c7">★☆☆☆</text>

    <!-- 图生图 -->
    <rect x="30" y="130" width="700" height="46" rx="9" fill="#161d26" stroke="#303a48"/>
    <text x="150" y="158" fill="#aeb9c7">文本 + 参考图</text>
    <text x="330" y="158" font-weight="700" fill="#edf2f7">图生图 img2img / 局部重绘</text>
    <text x="500" y="158" fill="#aeb9c7">构图与角色可继承</text>
    <text x="645" y="158" fill="#aeb9c7">★★☆☆</text>

    <!-- 文生视频 -->
    <rect x="30" y="184" width="700" height="46" rx="9" fill="#152433" stroke="#315471"/>
    <text x="150" y="212" fill="#aeb9c7">纯文本</text>
    <text x="330" y="212" font-weight="700" fill="#edf2f7">文生视频 T2V</text>
    <text x="500" y="212" fill="#aeb9c7">帧间一致 ✓ / 跨镜一致 ✗</text>
    <text x="645" y="212" fill="#aeb9c7">★☆☆☆</text>

    <!-- 图生视频 -->
    <rect x="30" y="238" width="700" height="46" rx="9" fill="#dce7f2" stroke="#8bc5ff"/>
    <text x="150" y="266" fill="#aeb9c7">文本 + 首帧（±尾帧）</text>
    <text x="330" y="266" font-weight="700" fill="#edf2f7">图生视频 I2V / FL2VA</text>
    <text x="500" y="266" fill="#aeb9c7">+ 构图锁定 / 角色长相锁定</text>
    <text x="645" y="266" font-weight="700" fill="#8bc5ff">★★★☆</text>

    <!-- 参考生视频 -->
    <rect x="30" y="292" width="700" height="46" rx="9" fill="#13271d" stroke="#7bd49a"/>
    <text x="150" y="320" fill="#aeb9c7">文本 + 参考图/视频 ×N</text>
    <text x="330" y="320" font-weight="700" fill="#edf2f7">参考生视频 Ref2VA</text>
    <text x="500" y="320" fill="#aeb9c7">+ 跨镜头身份一致</text>
    <text x="645" y="320" font-weight="700" fill="#7bd49a">★★★★</text>

    <!-- 视频生视频 -->
    <rect x="30" y="346" width="700" height="46" rx="9" fill="#3b2a18" stroke="#ffb454"/>
    <text x="150" y="374" fill="#aeb9c7">文本 + 原视频</text>
    <text x="330" y="374" font-weight="700" fill="#edf2f7">视频生视频 V2V</text>
    <text x="500" y="374" fill="#aeb9c7">+ 运动与节奏完全继承</text>
    <text x="645" y="374" fill="#aeb9c7">★★★☆</text>
  </g>

  <text x="380" y="410" text-anchor="middle" font-size="12" fill="#8793a2">可控性自下而上递减——正式生产的镜头越重要，越该用靠下的范式</text>
</svg>
