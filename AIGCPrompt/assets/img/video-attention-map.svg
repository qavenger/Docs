<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker><radialGradient id="hot"><stop offset="0" stop-color="#ffb454" stop-opacity=".85"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient></defs>
<rect width="760" height="560" fill="#111820"/><text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">注意力地图：让观众按叙事顺序看见</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">视觉扫描由构图与运动引导；显著性决定先看哪里；视角决定“谁在看”</text>
<g transform="translate(32 84)"><rect width="320" height="220" rx="12" fill="#171d26" stroke="#8bc5ff"/><text x="18" y="28" font-size="13" font-weight="700" fill="#8bc5ff">① 视觉扫描：入口 → 主体 → 线索</text><rect x="18" y="46" width="284" height="145" rx="8" fill="#10161d" stroke="#35404d"/><path d="M42 162C82 95 116 83 162 105S238 144 276 70" fill="none" stroke="#8bc5ff" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arr)"/><circle cx="50" cy="157" r="9" fill="#7bd49a"/><circle cx="158" cy="104" r="20" fill="url(#hot)"/><circle cx="158" cy="104" r="7" fill="#ffb454"/><rect x="254" y="55" width="28" height="36" rx="4" fill="#321f21" stroke="#ff9a94"/><text x="18" y="210" font-size="10.5" fill="#aeb9c7">路径可弯，但不应在同一时刻争夺多个焦点</text></g>
<line x1="360" y1="194" x2="388" y2="194" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(396 84)"><rect width="332" height="220" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="18" y="28" font-size="13" font-weight="700" fill="#ffb454">② 显著性：建立清晰层级</text><g transform="translate(18 48)"><circle cx="44" cy="50" r="34" fill="#ffb454" opacity=".22"/><circle cx="44" cy="50" r="13" fill="#ffb454"/><text x="92" y="44" font-size="12" font-weight="700" fill="#edf2f7">第一眼：主叙事主体</text><text x="92" y="63" font-size="10.5" fill="#aeb9c7">对比、清晰度、运动共同服务</text><circle cx="44" cy="112" r="20" fill="#8bc5ff" opacity=".8"/><text x="92" y="107" font-size="12" font-weight="700" fill="#edf2f7">第二眼：行动线索</text><text x="92" y="126" font-size="10.5" fill="#aeb9c7">用方向与遮挡组织阅读顺序</text></g><text x="18" y="202" font-size="10.5" fill="#ff9a94">避免：高亮背景、强文字与主体同时抢眼</text></g>
<g transform="translate(32 330)"><rect width="696" height="151" rx="12" fill="#171d26" stroke="#35404d"/><text x="18" y="28" font-size="13" font-weight="700" fill="#edf2f7">③ 视角选择：同一事件，不同注意力合同</text><g transform="translate(18 45)"><rect width="316" height="78" rx="9" fill="#152433" stroke="#8bc5ff"/><text x="16" y="24" font-size="12" font-weight="700" fill="#8bc5ff">客观镜头｜观察者在场外</text><text x="16" y="46" font-size="11" fill="#edf2f7">看清人物关系、空间与动作后果</text><text x="16" y="64" font-size="10.5" fill="#aeb9c7">适合建立场景与交代因果</text></g><line x1="342" y1="84" x2="366" y2="84" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(362 45)"><rect width="316" height="78" rx="9" fill="#321f21" stroke="#ff9a94"/><text x="16" y="24" font-size="12" font-weight="700" fill="#ff9a94">主观镜头｜观察者进入角色</text><text x="16" y="46" font-size="11" fill="#edf2f7">注意受角色视线、认知与情绪限制</text><text x="16" y="64" font-size="10.5" fill="#aeb9c7">适合代入、悬念与信息遮蔽</text></g></g>
<line x1="380" y1="488" x2="380" y2="507" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/><text x="380" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：先决定谁在看，再用显著性安排先后，最后检查扫描路径是否服务叙事。</text>
</svg>