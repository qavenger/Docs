<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <rect width="760" height="520" fill="#111820"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">光的软硬只由一个量决定：光源在被摄物眼中的张角</text>

  <!-- ============ 左：硬光 ============ -->
  <g>
    <rect x="30" y="52" width="340" height="290" rx="8" fill="#161d26" stroke="#ff9a94" stroke-width="1.5"/>
    <text x="200" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#ff9a94">硬光 · 小张角</text>

    <!-- 小光源 -->
    <circle cx="80" cy="140" r="10" fill="#e8b84b" stroke="#ffb454" stroke-width="1.5"/>
    <text x="80" y="119" text-anchor="middle" font-size="11" fill="#aeb9c7">小光源</text>

    <!-- 光线：几乎平行 -->
    <g stroke="#e8b84b" stroke-width="1.2" opacity="0.9">
      <line x1="88" y1="134" x2="196" y2="150"/>
      <line x1="88" y1="140" x2="196" y2="168"/>
      <line x1="88" y1="146" x2="196" y2="186"/>
    </g>

    <!-- 张角标注 -->
    <path d="M 108 137 A 30 30 0 0 1 108 149" fill="none" stroke="#ff9a94" stroke-width="1.5"/>
    <text x="128" y="147" font-size="11" font-weight="700" fill="#ff9a94">θ 小</text>

    <!-- 物体 -->
    <rect x="196" y="150" width="26" height="52" fill="#aeb9c7"/>
    <text x="209" y="143" text-anchor="middle" font-size="10.5" fill="#aeb9c7">物体</text>

    <!-- 地面 -->
    <line x1="60" y1="202" x2="350" y2="202" stroke="#edf2f7" stroke-width="1.5"/>

    <!-- 影子：本影大、半影极窄 -->
    <rect x="222" y="202" width="86" height="15" fill="#edf2f7"/>
    <rect x="308" y="202" width="6" height="15" fill="#edf2f7" opacity="0.45"/>
    <text x="265" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#edf2f7">本影 umbra（大）</text>
    <line x1="311" y1="217" x2="330" y2="250" stroke="#ff9a94" stroke-width="1"/>
    <text x="332" y="256" font-size="10.5" fill="#ff9a94">半影极窄</text>

    <!-- 边缘放大示意 -->
    <text x="200" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#edf2f7">阴影边缘：锐利</text>
    <defs>
      <linearGradient id="hardEdge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#edf2f7"/><stop offset="47%" stop-color="#edf2f7"/>
        <stop offset="53%" stop-color="#161d26"/><stop offset="100%" stop-color="#161d26"/>
      </linearGradient>
    </defs>
    <rect x="100" y="296" width="200" height="26" fill="url(#hardEdge)" stroke="#303a48"/>
    <text x="200" y="337" text-anchor="middle" font-size="11.5" fill="#aeb9c7">太阳：直径 140 万 km，但距离 1.5 亿 km → θ≈0.53°</text>
  </g>

  <!-- ============ 右：柔光 ============ -->
  <g>
    <rect x="390" y="52" width="340" height="290" rx="8" fill="#15231c" stroke="#7bd49a" stroke-width="1.5"/>
    <text x="560" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#7bd49a">柔光 · 大张角</text>

    <!-- 大光源 -->
    <rect x="418" y="104" width="16" height="82" rx="5" fill="#e8b84b" stroke="#ffb454" stroke-width="1.5"/>
    <text x="426" y="97" text-anchor="middle" font-size="11" fill="#aeb9c7">大光源</text>

    <!-- 光线：从各角度包围 -->
    <g stroke="#e8b84b" stroke-width="1.2" opacity="0.9">
      <line x1="436" y1="110" x2="556" y2="152"/>
      <line x1="436" y1="128" x2="556" y2="158"/>
      <line x1="436" y1="145" x2="556" y2="170"/>
      <line x1="436" y1="163" x2="556" y2="182"/>
      <line x1="436" y1="180" x2="556" y2="194"/>
    </g>

    <path d="M 452 112 A 46 46 0 0 1 452 178" fill="none" stroke="#7bd49a" stroke-width="1.5"/>
    <text x="472" y="149" font-size="11" font-weight="700" fill="#7bd49a">θ 大</text>

    <rect x="556" y="150" width="26" height="52" fill="#aeb9c7"/>
    <text x="569" y="143" text-anchor="middle" font-size="10.5" fill="#aeb9c7">物体</text>

    <line x1="420" y1="202" x2="710" y2="202" stroke="#edf2f7" stroke-width="1.5"/>

    <!-- 影子：本影小、半影宽 -->
    <rect x="582" y="202" width="34" height="15" fill="#edf2f7"/>
    <rect x="616" y="202" width="60" height="15" fill="#edf2f7" opacity="0.3"/>
    <text x="599" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#edf2f7">本影小</text>
    <line x1="646" y1="217" x2="664" y2="250" stroke="#7bd49a" stroke-width="1"/>
    <text x="620" y="262" font-size="10.5" fill="#7bd49a">半影 penumbra 很宽</text>

    <text x="560" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#edf2f7">阴影边缘：糊</text>
    <defs>
      <linearGradient id="softEdge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#edf2f7"/><stop offset="20%" stop-color="#edf2f7"/>
        <stop offset="80%" stop-color="#15231c"/><stop offset="100%" stop-color="#15231c"/>
      </linearGradient>
    </defs>
    <rect x="460" y="296" width="200" height="26" fill="url(#softEdge)" stroke="#303a48"/>
    <text x="560" y="337" text-anchor="middle" font-size="11.5" fill="#aeb9c7">阴天：整个天空都是光源 → θ 接近 180°</text>
  </g>

  <!-- ============ 底部：三种变柔手段 ============ -->
  <g>
    <text x="380" y="378" text-anchor="middle" font-size="14.5" font-weight="700" fill="#edf2f7">推论：想让光变柔，只有三条路 —— 全都是在加大张角 θ</text>

    <rect x="46" y="394" width="212" height="64" rx="7" fill="#13271d" stroke="#29553b"/>
    <text x="152" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#7bd49a">① 换更大的光源</text>
    <text x="152" y="435" text-anchor="middle" font-size="11" fill="#aeb9c7">柔光箱、柔光伞、大反光板</text>
    <text x="152" y="450" text-anchor="middle" font-size="10.5" fill="#8793a2">large softbox / bounced light</text>

    <rect x="274" y="394" width="212" height="64" rx="7" fill="#13271d" stroke="#29553b"/>
    <text x="380" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#7bd49a">② 让光源离得更近</text>
    <text x="380" y="435" text-anchor="middle" font-size="11" fill="#aeb9c7">同一盏灯，贴近就变柔</text>
    <text x="380" y="450" text-anchor="middle" font-size="10.5" fill="#8793a2">light source close to subject</text>

    <rect x="502" y="394" width="212" height="64" rx="7" fill="#13271d" stroke="#29553b"/>
    <text x="608" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#7bd49a">③ 加散射介质</text>
    <text x="608" y="435" text-anchor="middle" font-size="11" fill="#aeb9c7">云层、柔光布、纱帘、雾</text>
    <text x="608" y="450" text-anchor="middle" font-size="10.5" fill="#8793a2">overcast / diffused through curtain</text>
  </g>

  <text x="380" y="488" text-anchor="middle" font-size="12" fill="#aeb9c7">提示词里写这三类<tspan font-weight="700" fill="#7bd49a">具体成因</tspan>，比直接写 soft light 稳定得多 —— 因为摄影语料里它们高频出现</text>
  <text x="380" y="508" text-anchor="middle" font-size="11.5" fill="#8793a2">注意：光源"大小"指的是相对被摄物的视张角，不是灯本身的物理尺寸</text>
</svg>
