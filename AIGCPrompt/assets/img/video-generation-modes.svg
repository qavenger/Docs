<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#111820"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">三种视频生成入口：进料不同，确定性来源不同</text>

  <!-- T2V -->
  <g>
    <rect x="30" y="56" width="220" height="250" rx="12" fill="#161d26" stroke="#303a48"/>
    <text x="140" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">T2V 文生视频</text>
    <rect x="55" y="100" width="170" height="46" rx="8" fill="#3b2a18" stroke="#ffb454"/>
    <text x="140" y="121" text-anchor="middle" font-size="12" fill="#aeb9c7">输入：只有提示词</text>
    <text x="140" y="138" text-anchor="middle" font-size="11" fill="#8a6a4a">prompt →</text>
    <line x1="140" y1="146" x2="140" y2="168" stroke="#ffb454" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="55" y="172" width="170" height="40" rx="8" fill="#171d26" stroke="#303a48"/>
    <text x="140" y="196" text-anchor="middle" font-size="12.5" fill="#edf2f7">视频模型</text>
    <text x="140" y="236" text-anchor="middle" font-size="12" fill="#aeb9c7">可控性：★☆☆</text>
    <text x="140" y="258" text-anchor="middle" font-size="11.5" fill="#8793a2">画面全靠抽卡</text>
    <text x="140" y="278" text-anchor="middle" font-size="11.5" fill="#8793a2">适合：探索创意阶段</text>
  </g>

  <!-- FL2VA -->
  <g>
    <rect x="270" y="56" width="220" height="250" rx="12" fill="#152433" stroke="#315471"/>
    <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#8bc5ff">I2V / Keyframe 帧驱动</text>
    <rect x="295" y="100" width="170" height="46" rx="8" fill="#dce7f2" stroke="#8bc5ff"/>
    <text x="380" y="121" text-anchor="middle" font-size="12" fill="#3c5064">输入：首帧图 + 提示词</text>
    <text x="380" y="138" text-anchor="middle" font-size="11" fill="#5d6f85">（尾帧可选）</text>
    <line x1="380" y1="146" x2="380" y2="168" stroke="#ffb454" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="295" y="172" width="170" height="40" rx="8" fill="#171d26" stroke="#315471"/>
    <text x="380" y="196" text-anchor="middle" font-size="12.5" fill="#edf2f7">视频模型</text>
    <text x="380" y="236" text-anchor="middle" font-size="12" fill="#aeb9c7">可控性：★★★</text>
    <text x="380" y="258" text-anchor="middle" font-size="11.5" fill="#8793a2">画面内容由首帧锁死</text>
    <text x="380" y="278" text-anchor="middle" font-size="11.5" fill="#7bd49a" font-weight="700">★ 游戏 CG 的主力模式</text>
  </g>

  <!-- Ref2VA -->
  <g>
    <rect x="510" y="56" width="220" height="250" rx="12" fill="#13271d" stroke="#29553b"/>
    <text x="620" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#7bd49a">Reference 参考驱动</text>
    <rect x="535" y="100" width="170" height="46" rx="8" fill="#dcead6" stroke="#7bd49a"/>
    <text x="620" y="121" text-anchor="middle" font-size="12" fill="#3f5639">输入：参考资产 + 提示词</text>
    <text x="620" y="138" text-anchor="middle" font-size="10.5" fill="#5f7a5a">数量与类型以协议为准</text>
    <line x1="620" y1="146" x2="620" y2="168" stroke="#ffb454" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="535" y="172" width="170" height="40" rx="8" fill="#171d26" stroke="#29553b"/>
    <text x="620" y="196" text-anchor="middle" font-size="12.5" fill="#edf2f7">视频模型</text>
    <text x="620" y="236" text-anchor="middle" font-size="12" fill="#aeb9c7">可控性：★★☆</text>
    <text x="620" y="258" text-anchor="middle" font-size="11.5" fill="#8793a2">锁角色/物体身份</text>
    <text x="620" y="278" text-anchor="middle" font-size="11.5" fill="#8793a2">适合：角色一致性镜头</text>
  </g>
</svg>
