<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style><rect width="760" height="430" fill="#111820"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">宋代山水的两种空间制度：满构图与边角留白</text><g transform="translate(65 55)"><rect width="270" height="310" rx="5" fill="#1c2228" stroke="#aeb9c7"/><path d="M20 270 Q65 215 76 150 Q115 80 140 42 Q165 85 190 118 Q235 190 250 270Z" fill="#7f827b"/><path d="M76 150 Q110 135 140 42 Q160 130 190 118" fill="#565a55"/><path d="M28 277 Q112 252 245 275" fill="none" stroke="#474b47" stroke-width="5"/><path d="M52 266 Q78 240 110 256" fill="none" stroke="#333" stroke-width="2"/><circle cx="91" cy="256" r="2" fill="#ffb454"/><text x="270" y="292" font-size="10" text-anchor="end">人物</text><text x="135" y="335" text-anchor="middle" font-size="14" font-weight="700">北宋：全景巨嶂 · 高远</text><text x="135" y="357" text-anchor="middle" font-size="11.5" fill="#aeb9c7">主峰占上方约 2/3，路径与人物极小</text></g><g transform="translate(425 55)"><rect width="270" height="310" rx="5" fill="#161d26" stroke="#aeb9c7"/><path d="M0 310 L0 198 Q42 167 86 195 Q118 220 133 310Z" fill="#666b65"/><path d="M14 196 Q35 120 45 74" fill="none" stroke="#333" stroke-width="5"/><path d="M42 90 Q70 82 88 104 M38 118 Q73 109 97 132" fill="none" stroke="#4d554d" stroke-width="4"/><path d="M175 95 Q222 70 270 95" fill="none" stroke="#a7aaa1" stroke-width="11" opacity=".45"/><path d="M160 121 Q222 102 270 120" fill="none" stroke="#c5c4bc" stroke-width="9" opacity=".5"/><path d="M120 280 Q185 258 270 272" fill="none" stroke="#b8bab4" stroke-width="3" opacity=".7"/><text x="135" y="335" text-anchor="middle" font-size="14" font-weight="700">南宋：边角构图 · 留白</text><text x="135" y="357" text-anchor="middle" font-size="11.5" fill="#aeb9c7">实景压在一角，空白承担云、雾与水</text></g><text x="380" y="400" text-anchor="middle" font-size="12.5" fill="#ffb454">留白不是“没画”，而是有语义的空间；提示词必须说明空白是什么</text></svg>