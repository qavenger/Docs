<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Microsoft YaHei, PingFang SC, sans-serif"><style data-dark-diagram="true">text:not([fill]){fill:#edf2f7}</style>
  <rect width="760" height="560" fill="#111820"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#edf2f7">材质的两个主旋钮：粗糙度 × 金属度</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#aeb9c7">一切材质形容词都能还原到这张图上的某个坐标——找到坐标，措辞就有了</text>

  <!-- 坐标系 -->
  <g>
    <!-- 轴 -->
    <line x1="120" y1="330" x2="660" y2="330" stroke="#edf2f7" stroke-width="1.8"/>
    <line x1="120" y1="330" x2="120" y2="80" stroke="#edf2f7" stroke-width="1.8"/>
    <text x="390" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#edf2f7">粗糙度 roughness　0.0 ————————————————→ 1.0</text>
    <text x="96" y="205" font-size="13" font-weight="700" fill="#edf2f7" transform="rotate(-90 96 205)" text-anchor="middle">金属度 metallic　0 → 1</text>

    <!-- 金属行 -->
    <text x="112" y="106" text-anchor="end" font-size="11.5" font-weight="700" fill="#ffb454">金属</text>
    <g>
      <rect x="130" y="86" width="118" height="46" rx="5" fill="#e8e9ec" stroke="#9aa0a8"/>
      <text x="189" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">镜面抛光</text>
      <text x="189" y="122" text-anchor="middle" font-size="10" fill="#aeb9c7">镜子 / 镀铬</text>

      <rect x="258" y="86" width="118" height="46" rx="5" fill="#d8dade" stroke="#9aa0a8"/>
      <text x="317" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">拉丝金属</text>
      <text x="317" y="122" text-anchor="middle" font-size="10" fill="#aeb9c7">各向异性高光</text>

      <rect x="386" y="86" width="118" height="46" rx="5" fill="#c2c5ca" stroke="#9aa0a8"/>
      <text x="445" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">喷砂 / 磨砂</text>
      <text x="445" y="122" text-anchor="middle" font-size="10" fill="#aeb9c7">铝合金外壳</text>

      <rect x="514" y="86" width="132" height="46" rx="5" fill="#8d7a68" stroke="#6b5b4c"/>
      <text x="580" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">氧化 / 锈蚀</text>
      <text x="580" y="122" text-anchor="middle" font-size="10" fill="#f0e9dd">铁锈 / 铜绿</text>
    </g>

    <!-- 中间行 -->
    <text x="112" y="196" text-anchor="end" font-size="11.5" font-weight="700" fill="#aeb9c7">半金属</text>
    <g>
      <rect x="130" y="176" width="118" height="46" rx="5" fill="#f0dcb0" stroke="#c9a86a"/>
      <text x="189" y="196" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">鎏金 / 金箔</text>
      <text x="189" y="212" text-anchor="middle" font-size="10" fill="#aeb9c7">高光带金色</text>

      <rect x="258" y="176" width="118" height="46" rx="5" fill="#e6d3c8" stroke="#c9a86a"/>
      <text x="317" y="196" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">珠光 / 车漆</text>
      <text x="317" y="212" text-anchor="middle" font-size="10" fill="#aeb9c7">清漆层 + 金属片</text>

      <rect x="386" y="176" width="260" height="46" rx="5" fill="#161d26" stroke="#303a48" stroke-dasharray="4 3"/>
      <text x="516" y="196" text-anchor="middle" font-size="11.5" fill="#8793a2">此区间现实材质较少</text>
      <text x="516" y="212" text-anchor="middle" font-size="10" fill="#8793a2">多为分层材质（底层金属 + 表层涂覆）</text>
    </g>

    <!-- 非金属行 -->
    <text x="112" y="286" text-anchor="end" font-size="11.5" font-weight="700" fill="#7bd49a">非金属</text>
    <g>
      <rect x="130" y="266" width="118" height="46" rx="5" fill="#cfe4f5" stroke="#8fb4d4"/>
      <text x="189" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">玻璃 / 水面</text>
      <text x="189" y="302" text-anchor="middle" font-size="10" fill="#aeb9c7">透射 + 白高光</text>

      <rect x="258" y="266" width="118" height="46" rx="5" fill="#e3d7ea" stroke="#b9a5c4"/>
      <text x="317" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">丝绸 / 缎面</text>
      <text x="317" y="302" text-anchor="middle" font-size="10" fill="#aeb9c7">条状各向异性</text>

      <rect x="386" y="266" width="118" height="46" rx="5" fill="#f0e2d2" stroke="#d9bfa0"/>
      <text x="445" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">皮肤 / 玉石</text>
      <text x="445" y="302" text-anchor="middle" font-size="10" fill="#aeb9c7">次表面散射</text>

      <rect x="514" y="266" width="132" height="46" rx="5" fill="#ddd3c4" stroke="#b8a992"/>
      <text x="580" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#edf2f7">石 / 陶 / 绒</text>
      <text x="580" y="302" text-anchor="middle" font-size="10" fill="#aeb9c7">全漫反射，无镜面</text>
    </g>

    <!-- 高光斑示意（顶部随粗糙度变化） -->
    <g>
      <text x="380" y="72" text-anchor="middle" font-size="11" fill="#8793a2">↓ 高光斑随粗糙度增大而变大、变暗、变糊</text>
    </g>
  </g>

  <!-- 关键区别说明 -->
  <g>
    <rect x="40" y="380" width="340" height="76" rx="8" fill="#3b2a18" stroke="#ffb454" stroke-width="1.3"/>
    <text x="60" y="404" font-size="13.5" font-weight="700" fill="#ffb454">金属 vs 非金属的本质差别</text>
    <text x="60" y="424" font-size="11.5" fill="#edf2f7">金属：<tspan font-weight="700">几乎无漫反射</tspan>，高光<tspan font-weight="700">带自身颜色</tspan></text>
    <text x="60" y="443" font-size="11.5" fill="#edf2f7">非金属：有漫反射底色，高光<tspan font-weight="700">是白的</tspan></text>
  </g>
  <g>
    <rect x="400" y="380" width="320" height="76" rx="8" fill="#13271d" stroke="#7bd49a" stroke-width="1.3"/>
    <text x="420" y="404" font-size="13.5" font-weight="700" fill="#7bd49a">所以"金色"该怎么写</text>
    <text x="420" y="424" font-size="11" fill="#8793a2" font-family="Consolas, monospace">✗ gold color, golden</text>
    <text x="420" y="443" font-size="11" fill="#ffb454" font-family="Consolas, monospace">✓ polished gold, warm-tinted specular</text>
  </g>

  <!-- 菲涅尔 -->
  <g>
    <rect x="40" y="472" width="680" height="66" rx="8" fill="#152433" stroke="#8bc5ff" stroke-width="1.3"/>
    <text x="60" y="496" font-size="13.5" font-weight="700" fill="#8bc5ff">菲涅尔效应：为什么所有材质的边缘都会发亮</text>
    <text x="60" y="516" font-size="11.5" fill="#edf2f7">掠射角（视线接近平行于表面）下反射率急剧上升 —— 这是<tspan font-weight="700">轮廓光有效的物理来源</tspan>，对任何材质都成立</text>
    <text x="60" y="532" font-size="11" fill="#ffb454" font-family="Consolas, monospace">✓ fresnel rim highlight along the contour, edge light wrapping the silhouette</text>
  </g>
</svg>
