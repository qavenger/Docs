<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="560" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">质量 × 成本分层：把预算留给最重要的镜头</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">不是所有镜头都按最高规格生产；先按失败代价分层，再决定投入</text>
<g transform="translate(50 82)"><path d="M28 360V18" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/><text x="5" y="16" font-size="10.5" fill="#aeb9c7">质量与投入</text>
<g transform="translate(58 244)"><rect width="592" height="116" rx="12" fill="#152433" stroke="#8bc5ff"/><rect width="130" height="116" rx="12" fill="#20364b"/><text x="65" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#8bc5ff">草稿层</text><text x="65" y="61" text-anchor="middle" font-size="10.5" fill="#edf2f7">快速验证</text><text x="65" y="81" text-anchor="middle" font-size="10" fill="#aeb9c7">允许替换</text><text x="154" y="28" font-size="11" font-weight="700" fill="#edf2f7">解决什么</text><text x="154" y="51" font-size="10.5" fill="#aeb9c7">节拍、构图、动作方向、镜头顺序</text><text x="154" y="77" font-size="11" font-weight="700" fill="#edf2f7">验收重点</text><text x="154" y="99" font-size="10.5" fill="#aeb9c7">读得懂、接得上；不追材质精修</text><rect x="470" y="24" width="98" height="66" rx="8" fill="#121a22"/><text x="519" y="49" text-anchor="middle" font-size="10.5" fill="#8bc5ff">低成本试错</text><text x="519" y="69" text-anchor="middle" font-size="10" fill="#aeb9c7">多方案并行</text></g>
<line x1="354" y1="235" x2="354" y2="217" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(58 119)"><rect width="592" height="106" rx="12" fill="#13271d" stroke="#7bd49a"/><rect width="130" height="106" rx="12" fill="#193624"/><text x="65" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#7bd49a">标准层</text><text x="65" y="59" text-anchor="middle" font-size="10.5" fill="#edf2f7">主体交付</text><text x="65" y="79" text-anchor="middle" font-size="10" fill="#aeb9c7">稳定复用</text><text x="154" y="28" font-size="11" font-weight="700" fill="#edf2f7">解决什么</text><text x="154" y="50" font-size="10.5" fill="#aeb9c7">身份一致、运动可信、色彩连续、音画同步</text><text x="154" y="75" font-size="11" font-weight="700" fill="#edf2f7">验收重点</text><text x="154" y="96" font-size="10.5" fill="#aeb9c7">达到项目统一基线，可进入成片</text><rect x="470" y="20" width="98" height="66" rx="8" fill="#121a22"/><text x="519" y="46" text-anchor="middle" font-size="10.5" fill="#7bd49a">常规投入</text><text x="519" y="66" text-anchor="middle" font-size="10" fill="#aeb9c7">批量与复用</text></g>
<line x1="354" y1="110" x2="354" y2="92" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(58)"><rect width="592" height="100" rx="12" fill="#3b2a18" stroke="#ffb454"/><rect width="130" height="100" rx="12" fill="#4a341c"/><text x="65" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">英雄镜头</text><text x="65" y="58" text-anchor="middle" font-size="10.5" fill="#edf2f7">关键记忆点</text><text x="65" y="78" text-anchor="middle" font-size="10" fill="#aeb9c7">失败代价高</text><text x="154" y="28" font-size="11" font-weight="700" fill="#edf2f7">解决什么</text><text x="154" y="50" font-size="10.5" fill="#aeb9c7">品牌形象、关键表演、复杂运动、核心揭示</text><text x="154" y="75" font-size="11" font-weight="700" fill="#edf2f7">验收重点</text><text x="154" y="94" font-size="10.5" fill="#aeb9c7">单独打磨，逐项复核不可替代细节</text><rect x="470" y="17" width="98" height="66" rx="8" fill="#121a22"/><text x="519" y="43" text-anchor="middle" font-size="10.5" fill="#ffb454">集中投入</text><text x="519" y="63" text-anchor="middle" font-size="10" fill="#aeb9c7">更严门禁</text></g></g>
<g transform="translate(80 467)"><rect width="600" height="48" rx="9" fill="#321f21" stroke="#ff9a94"/><text x="300" y="20" text-anchor="middle" font-size="11" fill="#edf2f7">分层依据：叙事重要性 × 替代难度 × 连续性影响</text><text x="300" y="37" text-anchor="middle" font-size="10" fill="#aeb9c7">避免按镜头长度或个人偏好平均分配资源</text></g>
<text x="380" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：先用草稿买答案，再用标准层买稳定，最后用英雄层买记忆点。</text>
</svg>