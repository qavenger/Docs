<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="640" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">提示词方言：同一镜头卡，编译成三种表达</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">保持镜头事实不变，只改变信息的组织方式；不要把“翻译”变成“重写”</text>
<g transform="translate(95 78)"><rect width="570" height="100" rx="12" fill="#171d26" stroke="#ffb454"/><text x="18" y="28" font-size="13" font-weight="700" fill="#ffb454">源镜头卡｜唯一事实源</text><text x="18" y="53" font-size="11" fill="#edf2f7">雨夜站台；红伞人物转身；相机缓慢推近；远处列车灯出现；保留人物身份与伞色。</text><text x="18" y="77" font-size="10.5" fill="#aeb9c7">事实分层：主体 / 场景 / 动作 / 相机 / 时间顺序 / 声音 / 禁改项</text></g>
<path d="M380 182V210M380 210H132V233M380 210H380V233M380 210H628V233" fill="none" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(25 240)"><rect width="220" height="292" rx="12" fill="#152433" stroke="#8bc5ff"/><text x="16" y="28" font-size="13" font-weight="700" fill="#8bc5ff">① H3｜字段化</text><text x="16" y="49" font-size="10.5" fill="#aeb9c7">把约束放进稳定字段</text><g transform="translate(16 66)" font-size="10.5"><rect width="188" height="34" rx="6" fill="#121a22"/><text x="10" y="22" fill="#edf2f7"><tspan fill="#8bc5ff">主体</tspan>：红伞人物，身份锁定</text><rect y="42" width="188" height="34" rx="6" fill="#121a22"/><text x="10" y="64" fill="#edf2f7"><tspan fill="#8bc5ff">场景</tspan>：雨夜站台</text><rect y="84" width="188" height="34" rx="6" fill="#121a22"/><text x="10" y="106" fill="#edf2f7"><tspan fill="#8bc5ff">动作</tspan>：转身，灯出现</text><rect y="126" width="188" height="34" rx="6" fill="#121a22"/><text x="10" y="148" fill="#edf2f7"><tspan fill="#8bc5ff">相机</tspan>：缓慢推近</text><rect y="168" width="188" height="34" rx="6" fill="#121a22"/><text x="10" y="190" fill="#edf2f7"><tspan fill="#8bc5ff">声音</tspan>：雨声，列车渐近</text></g><text x="16" y="280" font-size="10" fill="#aeb9c7">适合：字段检查与约束比对</text></g>
<g transform="translate(270 240)"><rect width="220" height="292" rx="12" fill="#13271d" stroke="#7bd49a"/><text x="16" y="28" font-size="13" font-weight="700" fill="#7bd49a">② LTX-2.5｜时间自然段</text><text x="16" y="49" font-size="10.5" fill="#aeb9c7">让动作与镜头按时间展开</text><rect x="16" y="66" width="188" height="202" rx="8" fill="#121a22"/><text x="29" y="91" font-size="10.5" fill="#edf2f7"><tspan x="29">雨夜站台保持冷暗。</tspan><tspan x="29" dy="24">开始时，红伞人物背对镜头，</tspan><tspan x="29" dy="24">相机缓慢推近。随后人物转身，</tspan><tspan x="29" dy="24">身份与伞色不变；远处列车灯</tspan><tspan x="29" dy="24">逐渐出现，雨声持续，列车声</tspan><tspan x="29" dy="24">由远至近。镜头停在人物反应。</tspan></text><text x="16" y="280" font-size="10" fill="#aeb9c7">适合：连续动作与时间关系</text></g>
<g transform="translate(515 240)"><rect width="220" height="292" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="16" y="28" font-size="13" font-weight="700" fill="#ffb454">③ Wan｜短时间轴</text><text x="16" y="49" font-size="10.5" fill="#aeb9c7">把短镜头拆成可读节拍</text><line x1="34" y1="84" x2="34" y2="241" stroke="#ffb454" stroke-width="2"/><g fill="#ffb454"><circle cx="34" cy="91" r="5"/><circle cx="34" cy="145" r="5"/><circle cx="34" cy="199" r="5"/><circle cx="34" cy="241" r="5"/></g><g font-size="10.5"><text x="52" y="88" fill="#aeb9c7">起始</text><text x="52" y="105" fill="#edf2f7">背影，雨声，缓推</text><text x="52" y="142" fill="#aeb9c7">中段</text><text x="52" y="159" fill="#edf2f7">人物转身，身份不变</text><text x="52" y="196" fill="#aeb9c7">后段</text><text x="52" y="213" fill="#edf2f7">列车灯与声音渐近</text><text x="52" y="244" fill="#aeb9c7">落帧：停在反应</text></g><text x="16" y="280" font-size="10" fill="#aeb9c7">适合：短镜头节拍对齐</text></g>
<line x1="380" y1="538" x2="380" y2="560" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(95 568)"><rect width="570" height="42" rx="9" fill="#321f21" stroke="#ff9a94"/><text x="285" y="26" text-anchor="middle" font-size="11" fill="#edf2f7">编译检查：主体、动作顺序、相机、声音与禁改项必须逐项等价</text></g><text x="380" y="630" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：镜头事实是语义，模型方言只是语法。</text>
</svg>