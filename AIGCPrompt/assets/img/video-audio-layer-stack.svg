<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8793a2"/></marker></defs><rect width="760" height="610" fill="#111820"/>
<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#edf2f7">音频四层栈：分层设计，按画面事件同步</text><text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#aeb9c7">每层先回答“声源是什么、何时出现、离镜头多远”，再进入混音</text>
<g transform="translate(30 82)"><rect width="700" height="346" rx="12" fill="#171d26" stroke="#35404d"/><text x="18" y="27" font-size="13" font-weight="700" fill="#edf2f7">①—④ 分层声轨：功能不同，时间轴相同</text>
<g transform="translate(18 47)"><g><rect width="664" height="57" rx="9" fill="#152433" stroke="#8bc5ff"/><rect width="116" height="57" rx="9" fill="#20364b"/><text x="58" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#8bc5ff">环境层</text><text x="58" y="42" text-anchor="middle" font-size="9.5" fill="#aeb9c7">空间与时间</text><path d="M140 33H624M148 33L162 29 176 37 190 31 207 35 226 28 243 36 262 32 282 35 301 29 322 36 343 31 365 34 386 30 409 36 430 31 452 35 476 29 501 37 523 31 548 34 570 29 596 36 618 33" fill="none" stroke="#8bc5ff" stroke-width="1.7"/><text x="142" y="19" font-size="9.5" fill="#edf2f7">风、雨、房间底噪、远处交通</text></g>
<g transform="translate(0 68)"><rect width="664" height="57" rx="9" fill="#13271d" stroke="#7bd49a"/><rect width="116" height="57" rx="9" fill="#193624"/><text x="58" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#7bd49a">动作层</text><text x="58" y="42" text-anchor="middle" font-size="9.5" fill="#aeb9c7">看得见的因果</text><path d="M140 34H624M196 34L196 15M318 34L318 12M442 34L442 18M550 34L550 11" stroke="#7bd49a" stroke-width="3"/><g fill="#7bd49a"><circle cx="196" cy="15" r="4"/><circle cx="318" cy="12" r="4"/><circle cx="442" cy="18" r="4"/><circle cx="550" cy="11" r="4"/></g><text x="142" y="19" font-size="9.5" fill="#edf2f7">脚步、触碰、撞击、机械动作</text></g>
<g transform="translate(0 136)"><rect width="664" height="57" rx="9" fill="#321f21" stroke="#ff9a94"/><rect width="116" height="57" rx="9" fill="#44272a"/><text x="58" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#ff9a94">对白层</text><text x="58" y="42" text-anchor="middle" font-size="9.5" fill="#aeb9c7">信息与表演</text><path d="M140 34H624M166 34Q176 14 186 34T206 34T226 34M280 34Q291 10 302 34T324 34T346 34M430 34Q441 16 452 34T474 34" fill="none" stroke="#ff9a94" stroke-width="2"/><text x="142" y="19" font-size="9.5" fill="#edf2f7">口型、重音、停顿与画外音位置</text></g>
<g transform="translate(0 204)"><rect width="664" height="57" rx="9" fill="#3b2a18" stroke="#ffb454"/><rect width="116" height="57" rx="9" fill="#4a341c"/><text x="58" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">音乐层</text><text x="58" y="42" text-anchor="middle" font-size="9.5" fill="#aeb9c7">情绪与段落</text><path d="M140 37C190 37 205 33 244 33S292 17 330 17 380 42 428 42 478 21 525 21 574 32 624 30" fill="none" stroke="#ffb454" stroke-width="2.2"/><text x="142" y="19" font-size="9.5" fill="#edf2f7">进入、发展、留白、收束</text></g></g>
<g transform="translate(158 320)" font-size="9.5" fill="#aeb9c7"><text x="0">镜头开始</text><text x="152">动作点</text><text x="286">对白重音</text><text x="470">镜头结束</text></g></g>
<g stroke="#8793a2" stroke-width="1" stroke-dasharray="4 4"><path d="M204 140V436"/><path d="M356 208V436"/><path d="M490 276V436"/><path d="M674 140V436"/></g>
<line x1="380" y1="436" x2="380" y2="458" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(30 466)"><rect width="450" height="86" rx="12" fill="#171d26" stroke="#7bd49a"/><text x="18" y="27" font-size="13" font-weight="700" fill="#7bd49a">⑤ 同步门：用可见事件做锚点</text><text x="18" y="50" font-size="10.5" fill="#edf2f7">动作声贴动作接触点｜对白贴口型与重音｜音乐贴段落转折</text><text x="18" y="70" font-size="10" fill="#aeb9c7">环境声保持空间连续，切镜时检查声场是否突变</text></g>
<line x1="488" y1="509" x2="514" y2="509" stroke="#8793a2" stroke-width="2" marker-end="url(#arr)"/>
<g transform="translate(522 466)"><rect width="208" height="86" rx="12" fill="#3b2a18" stroke="#ffb454"/><text x="16" y="27" font-size="13" font-weight="700" fill="#ffb454">⑥ 混音与输出</text><text x="16" y="49" font-size="10.5" fill="#edf2f7">对白可懂 · 动作可信</text><text x="16" y="68" font-size="10" fill="#aeb9c7">音乐让位，整体无突兀跳变</text></g>
<text x="380" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">结论：分层负责可控，同步负责可信，混音负责让重点被听见。</text>
</svg>