<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="560" fill="#fffdf8"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2620">构图六法速览：每个小框都是一种"视线引导术"</text>

  <!-- 通用小画框 220×140，三列两行 -->
  <!-- 1 三分法 -->
  <g>
    <rect x="40" y="55" width="220" height="140" rx="6" fill="#e8edf5" stroke="#3a5f8a" stroke-width="1.5"/>
    <g stroke="#3a5f8a" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.7">
      <line x1="113" y1="55" x2="113" y2="195"/><line x1="187" y1="55" x2="187" y2="195"/>
      <line x1="40" y1="102" x2="260" y2="102"/><line x1="40" y1="149" x2="260" y2="149"/>
    </g>
    <circle cx="187" cy="102" r="10" fill="#b35900"/>
    <text x="150" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2620">三分法 rule of thirds</text>
    <text x="150" y="232" text-anchor="middle" font-size="11" fill="#5d564a">主体放交叉点，自然不呆板</text>
  </g>

  <!-- 2 中心对称 -->
  <g>
    <rect x="270" y="55" width="220" height="140" rx="6" fill="#e8edf5" stroke="#3a5f8a" stroke-width="1.5"/>
    <line x1="380" y1="55" x2="380" y2="195" stroke="#3a5f8a" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.7"/>
    <rect x="368" y="95" width="24" height="60" fill="#b35900"/>
    <text x="380" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2620">中心对称 symmetrical</text>
    <text x="380" y="232" text-anchor="middle" font-size="11" fill="#5d564a">庄重、仪式感、压迫感（韦斯·安德森）</text>
  </g>

  <!-- 3 引导线 -->
  <g>
    <rect x="500" y="55" width="220" height="140" rx="6" fill="#e8edf5" stroke="#3a5f8a" stroke-width="1.5"/>
    <g stroke="#b35900" stroke-width="2.5">
      <line x1="510" y1="185" x2="640" y2="105"/>
      <line x1="710" y1="185" x2="640" y2="105"/>
    </g>
    <circle cx="640" cy="105" r="8" fill="#2b2620"/>
    <text x="610" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2620">引导线 leading lines</text>
    <text x="610" y="232" text-anchor="middle" font-size="11" fill="#5d564a">走廊/道路/光线把视线拽向主体</text>
  </g>

  <!-- 4 框架式 -->
  <g>
    <rect x="40" y="255" width="220" height="140" rx="6" fill="#eaf3e6" stroke="#4a7c43" stroke-width="1.5"/>
    <rect x="70" y="280" width="160" height="95" rx="4" fill="none" stroke="#3a6534" stroke-width="3"/>
    <circle cx="150" cy="327" r="11" fill="#b35900"/>
    <text x="150" y="415" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2620">框架式 framed within frame</text>
    <text x="150" y="432" text-anchor="middle" font-size="11" fill="#5d564a">门窗/舷窗当前景框，聚焦+层次感</text>
  </g>

  <!-- 5 负空间 -->
  <g>
    <rect x="270" y="255" width="220" height="140" rx="6" fill="#eaf3e6" stroke="#4a7c43" stroke-width="1.5"/>
    <circle cx="330" cy="355" r="10" fill="#b35900"/>
    <text x="380" y="415" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2620">负空间 negative space</text>
    <text x="380" y="432" text-anchor="middle" font-size="11" fill="#5d564a">大面积留白/留黑，孤独与史诗感</text>
  </g>

  <!-- 6 对角线 -->
  <g>
    <rect x="500" y="255" width="220" height="140" rx="6" fill="#eaf3e6" stroke="#4a7c43" stroke-width="1.5"/>
    <line x1="515" y1="380" x2="705" y2="270" stroke="#b35900" stroke-width="3"/>
    <circle cx="620" cy="318" r="9" fill="#2b2620"/>
    <text x="610" y="415" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2620">对角线 diagonal</text>
    <text x="610" y="432" text-anchor="middle" font-size="11" fill="#5d564a">动感、紧张、失衡的预告</text>
  </g>

  <text x="380" y="480" text-anchor="middle" font-size="12.5" fill="#8a8172">构图在首帧（图像模型）阶段决定——提示词里直接写构图法则的英文名，Flux 听得懂</text>
  <text x="380" y="505" text-anchor="middle" font-size="12.5" fill="#8a8172">例：extreme wide shot, rule of thirds composition, starship on the left third line, vast negative space</text>

  <rect x="60" y="522" width="640" height="1" fill="#e4dccb"/>
  <text x="380" y="546" text-anchor="middle" font-size="12" fill="#b35900">铁律：一个镜头只用一种主导构图。贪心混用 = 画面失去视觉重心</text>
</svg>
