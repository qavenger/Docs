<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b35900"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fffdf8"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2620">MiniMax H3 的三种生成模式：进料不同，可控性天差地别</text>

  <!-- T2V -->
  <g>
    <rect x="30" y="56" width="220" height="250" rx="12" fill="#fbf8f1" stroke="#e4dccb"/>
    <text x="140" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3d00">T2V 文生视频</text>
    <rect x="55" y="100" width="170" height="46" rx="8" fill="#f3e3cd" stroke="#b35900"/>
    <text x="140" y="121" text-anchor="middle" font-size="12" fill="#5d564a">输入：只有提示词</text>
    <text x="140" y="138" text-anchor="middle" font-size="11" fill="#8a6a4a">prompt →</text>
    <line x1="140" y1="146" x2="140" y2="168" stroke="#b35900" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="55" y="172" width="170" height="40" rx="8" fill="#fff" stroke="#e4dccb"/>
    <text x="140" y="196" text-anchor="middle" font-size="12.5" fill="#2b2620">视频模型</text>
    <text x="140" y="236" text-anchor="middle" font-size="12" fill="#5d564a">可控性：★☆☆</text>
    <text x="140" y="258" text-anchor="middle" font-size="11.5" fill="#8a8172">画面全靠抽卡</text>
    <text x="140" y="278" text-anchor="middle" font-size="11.5" fill="#8a8172">适合：探索创意阶段</text>
  </g>

  <!-- FL2VA -->
  <g>
    <rect x="270" y="56" width="220" height="250" rx="12" fill="#eef2f7" stroke="#c5d4e5"/>
    <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2c4a6e">FL2VA 首（尾）帧驱动</text>
    <rect x="295" y="100" width="170" height="46" rx="8" fill="#dce7f2" stroke="#3a5f8a"/>
    <text x="380" y="121" text-anchor="middle" font-size="12" fill="#3c5064">输入：首帧图 + 提示词</text>
    <text x="380" y="138" text-anchor="middle" font-size="11" fill="#5d6f85">（尾帧可选）</text>
    <line x1="380" y1="146" x2="380" y2="168" stroke="#b35900" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="295" y="172" width="170" height="40" rx="8" fill="#fff" stroke="#c5d4e5"/>
    <text x="380" y="196" text-anchor="middle" font-size="12.5" fill="#2b2620">视频模型</text>
    <text x="380" y="236" text-anchor="middle" font-size="12" fill="#5d564a">可控性：★★★</text>
    <text x="380" y="258" text-anchor="middle" font-size="11.5" fill="#8a8172">画面内容由首帧锁死</text>
    <text x="380" y="278" text-anchor="middle" font-size="11.5" fill="#3a6534" font-weight="700">★ 游戏 CG 的主力模式</text>
  </g>

  <!-- Ref2VA -->
  <g>
    <rect x="510" y="56" width="220" height="250" rx="12" fill="#eaf3e6" stroke="#c3d9bc"/>
    <text x="620" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6534">Ref2VA 参考驱动</text>
    <rect x="535" y="100" width="170" height="46" rx="8" fill="#dcead6" stroke="#4a7c43"/>
    <text x="620" y="121" text-anchor="middle" font-size="12" fill="#3f5639">输入：参考图×9 / 参考视频</text>
    <text x="620" y="138" text-anchor="middle" font-size="11" fill="#5f7a5a">+ 提示词</text>
    <line x1="620" y1="146" x2="620" y2="168" stroke="#b35900" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="535" y="172" width="170" height="40" rx="8" fill="#fff" stroke="#c3d9bc"/>
    <text x="620" y="196" text-anchor="middle" font-size="12.5" fill="#2b2620">视频模型</text>
    <text x="620" y="236" text-anchor="middle" font-size="12" fill="#5d564a">可控性：★★☆</text>
    <text x="620" y="258" text-anchor="middle" font-size="11.5" fill="#8a8172">锁角色/物体身份</text>
    <text x="620" y="278" text-anchor="middle" font-size="11.5" fill="#8a8172">适合：角色一致性镜头</text>
  </g>
</svg>
