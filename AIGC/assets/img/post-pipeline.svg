<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a5f8a"/>
    </marker>
  </defs>
  <rect width="760" height="260" fill="#fffdf8"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2620">后期增强管线：顺序是铁律，不能颠倒</text>

  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="20" y="70" width="130" height="86" rx="10" fill="#ece5d5" stroke="#8a8172" stroke-width="1.2"/>
    <text x="85" y="104" fill="#5d564a">原始视频</text>
    <text x="85" y="126" font-size="11" font-weight="400" fill="#8a8172">如 768×432</text>
    <text x="85" y="143" font-size="11" font-weight="400" fill="#8a8172">24fps · 带噪</text>

    <rect x="180" y="70" width="130" height="86" rx="10" fill="#fbeaea" stroke="#b3423a" stroke-width="1.5"/>
    <text x="245" y="98" fill="#8a2f28">① 降采样</text>
    <text x="245" y="120" font-size="11" font-weight="400" fill="#8a5a55">（可选但推荐）</text>
    <text x="245" y="138" font-size="11" font-weight="400" fill="#8a5a55">缩到 ~0.5 倍</text>
    <text x="245" y="152" font-size="11" font-weight="400" fill="#8a5a55">让 AI 重造细节</text>

    <rect x="340" y="70" width="130" height="86" rx="10" fill="#e8edf5" stroke="#3a5f8a" stroke-width="1.5"/>
    <text x="405" y="98" fill="#2c4a6e">② 超分修复</text>
    <text x="405" y="120" font-size="11" font-weight="400" fill="#5d6f85">SeedVR2 / FlashVSR</text>
    <text x="405" y="138" font-size="11" font-weight="400" fill="#5d6f85">时序感知防闪烁</text>
    <text x="405" y="152" font-size="11" font-weight="400" fill="#5d6f85">→ 1080p</text>

    <rect x="500" y="70" width="110" height="86" rx="10" fill="#eaf3e6" stroke="#4a7c43" stroke-width="1.5"/>
    <text x="555" y="98" fill="#3a6534">③ 插帧</text>
    <text x="555" y="120" font-size="11" font-weight="400" fill="#5f7a5a">RIFE ×2</text>
    <text x="555" y="138" font-size="11" font-weight="400" fill="#5f7a5a">24 → 48fps</text>
    <text x="555" y="152" font-size="11" font-weight="400" fill="#5f7a5a">大运动用 FILM</text>

    <rect x="640" y="70" width="100" height="86" rx="10" fill="#f3e3cd" stroke="#b35900" stroke-width="1.5"/>
    <text x="690" y="98" fill="#7a3d00">④ 编码</text>
    <text x="690" y="120" font-size="11" font-weight="400" fill="#8a6a4a">VHS 合成</text>
    <text x="690" y="138" font-size="11" font-weight="400" fill="#8a6a4a">h264/h265</text>
    <text x="690" y="152" font-size="11" font-weight="400" fill="#8a6a4a">带回音频</text>
  </g>

  <g stroke="#3a5f8a" stroke-width="2" fill="none">
    <line x1="150" y1="113" x2="178" y2="113" marker-end="url(#arr2)"/>
    <line x1="310" y1="113" x2="338" y2="113" marker-end="url(#arr2)"/>
    <line x1="470" y1="113" x2="498" y2="113" marker-end="url(#arr2)"/>
    <line x1="610" y1="113" x2="638" y2="113" marker-end="url(#arr2)"/>
  </g>

  <rect x="60" y="186" width="640" height="52" rx="8" fill="#fff" stroke="#ecc5c2"/>
  <text x="380" y="207" text-anchor="middle" font-size="12.5" fill="#b3423a" font-weight="700">⚠ 先插帧再超分 = 把涂抹瑕疵一起放大，还多算一倍帧数</text>
  <text x="380" y="227" text-anchor="middle" font-size="12.5" fill="#b3423a" font-weight="700">⚠ 逐帧 ESRGAN 超分视频 = 帧间细节不一致 → 画面闪烁</text>
</svg>
