<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工信部新车申报公示清单追踪</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #eef3f8;
      --text: #17202a;
      --muted: #667085;
      --line: #d8e0ea;
      --accent: #0f6abf;
      --accent-2: #093f78;
      --good: #12715b;
      --warn: #9a5b00;
      --shadow: 0 10px 30px rgba(18, 38, 63, 0.08);
      --radius: 8px;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(120px, 160px) auto auto;
      gap: 12px;
      align-items: end;
      padding: 14px;
      margin-bottom: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
    }

    input,
    select,
    button {
      height: 38px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font: inherit;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 0 10px;
      color: var(--text);
      background: #fff;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }

    button.secondary {
      color: var(--accent-2);
      background: #fff;
      border-color: #b9cbe1;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      min-height: 42px;
      padding: 10px 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status strong {
      color: var(--text);
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 520px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .list,
    .preview {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
    }

    .cards {
      display: grid;
      gap: 10px;
      padding: 12px;
      max-height: calc(100vh - 232px);
      overflow: auto;
    }

    .card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }

    .card:hover,
    .card.active {
      border-color: #72a7d9;
      box-shadow: 0 8px 18px rgba(15, 106, 191, 0.12);
      transform: translateY(-1px);
    }

    .card.active {
      background: #f6fbff;
    }

    .card-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #ecf5ff;
      color: var(--accent-2);
      border: 1px solid #cfe5fb;
      font-size: 12px;
    }

    .pill.good {
      color: var(--good);
      background: #eefaf6;
      border-color: #cceade;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .actions a,
    .small-link {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 9px;
      border: 1px solid #bdd4eb;
      border-radius: 6px;
      background: #fff;
      color: var(--accent-2);
      font-size: 12px;
      text-decoration: none;
    }

    .actions a:hover,
    .small-link:hover {
      border-color: var(--accent);
      text-decoration: none;
    }

    .preview-frame {
      width: 100%;
      height: calc(100vh - 188px);
      min-height: 520px;
      border: 0;
      background: #fff;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .error {
      color: #9b1c1c;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 980px) {
      .shell {
        padding: 16px;
      }

      header {
        display: block;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .cards {
        max-height: none;
      }

      .preview-frame {
        height: 70vh;
      }
    }

    @media (max-width: 620px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 22px;
      }

      .status {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>工信部新车申报公示清单追踪</h1>
        <p class="subtitle">
          每次打开自动从工信部官方搜索接口拉取最新公示文章，并只显示“车辆新产品公示清单”页面链接。
          数据源：中华人民共和国工业和信息化部。
        </p>
      </div>
    </header>

    <form class="toolbar" id="controls">
      <label>
        最新新产品清单数量 N
        <input id="limit" type="number" min="1" max="50" step="1" value="6">
      </label>
      <button id="refresh" type="submit">
        <span id="refreshIcon">刷新</span>
      </button>
      <button class="secondary" id="copyLinks" type="button">复制链接</button>
    </form>

    <div class="status" id="status">
      <span>准备拉取官方数据。</span>
      <span>接口方式：JSONP，可直接从本地 HTML 打开。</span>
    </div>

    <section class="layout">
      <div class="list">
        <div class="section-head">
          <h2>新产品公示清单</h2>
          <span class="count" id="resultCount">0 条</span>
        </div>
        <div class="cards" id="cards">
          <div class="empty">正在加载...</div>
        </div>
      </div>

      <div class="preview">
        <div class="section-head">
          <h2>页面预览</h2>
          <a class="small-link" id="openCurrent" href="https://www.miit.gov.cn/datainfo/cpgg/" target="_blank" rel="noopener">新窗口打开</a>
        </div>
        <iframe class="preview-frame" id="preview" title="工信部公示清单页面预览" src="https://www.miit.gov.cn/datainfo/cpgg/"></iframe>
      </div>
    </section>
  </main>

  <script>
    const MIIT_HOST = "https://www.miit.gov.cn";
    const SEARCH_ENDPOINT = `${MIIT_HOST}/search-front-server/api/search/info`;
    const SEARCH_QUERY = "道路机动车辆生产企业及产品公告 拟发布内容的公示";
    const MAX_SEARCH_PAGES = 8;
    const SEARCH_PAGE_SIZE = 20;
    const SEEDED_ITEMS = [
      newProductSeed("409", "2026-07-10", "https://www.miit.gov.cn/datainfo/cpgg/art/2026/art_55c31979bd934c1dac88e3976bc7570a.html"),
      newProductSeed("408", "2026-06-10", "https://www.miit.gov.cn/datainfo/cpgg/art/2026/art_2b16a3a2b8a347929b8535de66d8158a.html", "https://www.miit-eidc.org.cn/art/2026/6/10/art_1691_12455.html"),
      newProductSeed("407", "2026-05-14", "https://www.miit.gov.cn/datainfo/cpgg/art/2026/art_1c3689d478f24d59ae0d197a5114da79.html"),
      newProductSeed("406", "2026-04-09", "https://www.miit.gov.cn/datainfo/cpgg/art/2026/art_090c38afa6d6494491047615fbf591a8.html", "https://www.miit.gov.cn/jgsj/zbys/qcgy/art/2026/art_295d7c44deb4400aa98e835fa05d7444.html"),
      newProductSeed("405", "2026-03-17", "https://www.miit.gov.cn/datainfo/cpgg/art/2026/art_c838ade851a045f6838601d1a0d621e0.html"),
      newProductSeed("404", "2026-02-06", "https://www.miit.gov.cn/datainfo/cpgg/art/2026/art_227a8b47b3604f5a9850581dbf7605de.html"),
      newProductSeed("403", "2026-01-09", "https://www.miit.gov.cn/datainfo/cpgg/art/2026/art_6baa320b942c4255a50b73b7a03033e0.html"),
      newProductSeed("402", "2025-12-05", "https://www.miit.gov.cn/datainfo/cpgg/art/2025/art_62721744b2f14a8ab776bf03d477b7ab.html"),
      newProductSeed("401", "2025-11-10", "https://www.miit.gov.cn/datainfo/cpgg/art/2025/art_253244feb93c4c69812e26aa2f0f0ee3.html"),
      newProductSeed("400", "2025-10-09", "https://www.miit.gov.cn/datainfo/cpgg/art/2025/art_37bc9e1cb2614d6fbb594b810c5a9a4d.html"),
      newProductSeed("398", "2025-08-08", "https://www.miit.gov.cn/datainfo/cpgg/art/2025/art_9ec09a306d9444aa9e14f811f8c63a49.html")
    ];

    const state = {
      loading: false,
      items: [],
      activeUrl: ""
    };

    const controls = document.getElementById("controls");
    const limitInput = document.getElementById("limit");
    const refreshButton = document.getElementById("refresh");
    const refreshIcon = document.getElementById("refreshIcon");
    const copyButton = document.getElementById("copyLinks");
    const statusBox = document.getElementById("status");
    const cardsBox = document.getElementById("cards");
    const resultCount = document.getElementById("resultCount");
    const preview = document.getElementById("preview");
    const openCurrent = document.getElementById("openCurrent");

    function cleanHtml(text) {
      const div = document.createElement("div");
      div.innerHTML = text || "";
      return div.textContent.replace(/\s+/g, " ").trim();
    }

    function formatDate(ms) {
      const num = Number(ms);
      if (!Number.isFinite(num)) return "";
      const date = new Date(num);
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function normalizeUrl(url) {
      if (!url) return "";
      if (/^https?:\/\//i.test(url)) return url.replace(/^http:\/\//i, "https://");
      if (url.startsWith("/")) return `${MIIT_HOST}${url}`;
      return `${MIIT_HOST}/${url}`;
    }

    function getBatch(title) {
      const match = cleanHtml(title).match(/第\s*(\d+)\s*批/);
      return match ? `第${match[1]}批` : "批次未知";
    }

    function classifyList(text) {
      const label = cleanHtml(text);
      if (label.includes("车辆新产品")) return { key: "new", label: "新产品" };
      return { key: "other", label: "其他" };
    }

    function cleanListTitle(text) {
      return cleanHtml(text).replace(/^\d+\s*[.．、]\s*/, "");
    }

    function newProductSeed(batch, publishDate, url, articleUrl = "") {
      return {
        title: `申报《道路机动车辆生产企业及产品公告》（第${batch}批）的车辆新产品公示清单`,
        url,
        kind: "new",
        kindLabel: "新产品",
        batch: `第${batch}批`,
        publishDate,
        articleTitle: "",
        articleUrl,
        source: "官方清单补齐"
      };
    }

    function setStatus(message, tone = "") {
      statusBox.innerHTML = `<span class="${tone}">${message}</span><span>更新时间：${new Date().toLocaleString()}</span>`;
    }

    function setLoading(loading) {
      state.loading = loading;
      refreshButton.disabled = loading;
      refreshIcon.innerHTML = loading ? `<span class="spinner"></span> 拉取中` : "刷新";
    }

    function jsonp(url, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const callbackName = `miitJsonp_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const script = document.createElement("script");
        const joiner = url.includes("?") ? "&" : "?";
        const timer = window.setTimeout(() => {
          cleanup();
          reject(new Error("请求超时"));
        }, timeoutMs);

        function cleanup() {
          window.clearTimeout(timer);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("脚本加载失败"));
        };

        script.src = `${url}${joiner}callback=${encodeURIComponent(callbackName)}`;
        document.head.appendChild(script);
      });
    }

    function buildSearchUrl(page) {
      const params = new URLSearchParams({
        websiteid: "110000000000000",
        scope: "basic",
        q: SEARCH_QUERY,
        pg: String(SEARCH_PAGE_SIZE),
        cateid: "47",
        pos: "title_text,titlepy,infocontent,filenumbername,keyword,contentdescribe",
        pq: "",
        oq: "",
        eq: "",
        begin: "",
        end: "",
        dateField: "deploytime",
        selectFields: "title,content,deploytime,url,columnname,infoextends,infocontent,contentdescribe",
        group: "distinct",
        highlightConfigs: "[]",
        highlightFields: "title_text,infocontent,webid",
        level: "6",
        sortFields: "[{\"name\":\"deploytime\",\"type\":\"desc\"}]",
        hidCol: "fbafd13557fa453d9c59432567d2b150",
        p: String(page)
      });
      return `${SEARCH_ENDPOINT}?${params.toString()}`;
    }

    function readInfoContent(infoextends) {
      if (!infoextends) return "";
      try {
        const ext = JSON.parse(infoextends);
        const fields = JSON.parse(ext.infoContent || "[]");
        return fields
          .filter((field) => field.fieldName === "content" || field.fieldTitle === "正文")
          .map((field) => field.fieldValue || "")
          .join("\n");
      } catch (error) {
        return infoextends;
      }
    }

    function extractListLinks(article) {
      const data = article?.groupData?.[0]?.data;
      if (!data) return [];

      const title = cleanHtml(data.title_text || data.title || "");
      if (!title.includes("道路机动车辆生产企业及产品公告") || !title.includes("拟发布内容")) {
        return [];
      }

      const html = readInfoContent(data.infoextends);
      const doc = new DOMParser().parseFromString(html, "text/html");
      const anchors = Array.from(doc.querySelectorAll("a"));
      const batch = getBatch(title);
      const articleUrl = normalizeUrl(data.url);
      const publishDate = formatDate(data.deploytime);

      return anchors
        .map((anchor) => {
          const text = cleanHtml(anchor.textContent);
          const href = normalizeUrl(anchor.getAttribute("href"));
          const kind = classifyList(text);
          return {
            title: cleanListTitle(text),
            url: href,
            kind: kind.key,
            kindLabel: kind.label,
            batch,
            publishDate,
            articleTitle: title,
            articleUrl,
            source: "主站实时"
          };
        })
        .filter((item) => {
          const isOfficialDataPage = item.url.includes("/datainfo/");
          const isList = item.title.includes("清单");
          const isDoc = /\.(doc|docx|xls|xlsx|pdf)(\?|$)/i.test(item.url);
          return isOfficialDataPage && isList && !isDoc && item.kind === "new";
        });
    }

    function filterItems(items) {
      const limit = Math.max(1, Math.min(50, Number(limitInput.value) || 8));
      return items.filter((item) => item.kind === "new").slice(0, limit);
    }

    async function loadLatest() {
      setLoading(true);
      setStatus("正在拉取工信部官方搜索结果...");
      cardsBox.innerHTML = `<div class="empty">正在加载...</div>`;

      try {
        const collected = [];
        const seen = new Set();
        const desired = Math.max(1, Math.min(50, Number(limitInput.value) || 8));

        for (let page = 1; page <= MAX_SEARCH_PAGES; page += 1) {
          const json = await jsonp(buildSearchUrl(page));
          const rows = json?.data?.searchResult?.dataResults || [];
          rows.flatMap(extractListLinks).forEach((item) => {
            if (!seen.has(item.url)) {
              seen.add(item.url);
              collected.push(item);
            }
          });

          if (filterItems(collected).length >= desired) break;
          if (rows.length === 0) break;
        }

        SEEDED_ITEMS.forEach((item) => {
          if (!seen.has(item.url)) {
            seen.add(item.url);
            collected.push(item);
          }
        });

        collected.sort((a, b) => {
          const batchA = Number((a.batch || "").match(/\d+/)?.[0] || 0);
          const batchB = Number((b.batch || "").match(/\d+/)?.[0] || 0);
          if (batchA !== batchB) return batchB - batchA;
          return (b.publishDate || "").localeCompare(a.publishDate || "");
        });

        state.items = collected;
        render();
        const visible = filterItems(state.items).length;
        setStatus(`已从工信部官方接口及历史官方清单补齐到 <strong>${state.items.length}</strong> 个新产品清单链接，按批次/时间倒序显示 <strong>${visible}</strong> 个。`);
      } catch (error) {
        state.items = [];
        cardsBox.innerHTML = `<div class="empty error">拉取失败：${cleanHtml(error.message)}。请稍后重试，或直接打开工信部通用入口。</div>`;
        resultCount.textContent = "0 条";
        setStatus(`拉取失败：${cleanHtml(error.message)}`, "error");
      } finally {
        setLoading(false);
      }
    }

    function selectItem(url) {
      state.activeUrl = url;
      preview.src = url;
      openCurrent.href = url;
      Array.from(cardsBox.querySelectorAll(".card")).forEach((card) => {
        card.classList.toggle("active", card.dataset.url === url);
      });
    }

    function render() {
      const items = filterItems(state.items);
      resultCount.textContent = `${items.length} 条`;

      if (items.length === 0) {
        cardsBox.innerHTML = `<div class="empty">没有找到车辆新产品公示清单。可以稍后刷新，或增大 N 后再试。</div>`;
        return;
      }

      cardsBox.innerHTML = items.map((item, index) => `
        <article class="card" data-url="${item.url}" tabindex="0">
          <h3 class="card-title">${index + 1}. ${item.title}</h3>
          <div class="meta">
            <span class="pill good">${item.batch}</span>
            <span class="pill">${item.kindLabel}</span>
          </div>
          <div class="actions">
            <a href="${item.url}" target="_blank" rel="noopener">打开清单</a>
            ${item.articleUrl && item.articleUrl !== item.url ? `<a href="${item.articleUrl}" target="_blank" rel="noopener">公示原文</a>` : ""}
          </div>
        </article>
      `).join("");

      Array.from(cardsBox.querySelectorAll(".card")).forEach((card) => {
        card.addEventListener("click", (event) => {
          if (event.target.closest("a")) return;
          selectItem(card.dataset.url);
        });
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectItem(card.dataset.url);
          }
        });
      });

      selectItem(items[0].url);
    }

    async function copyLinks() {
      const items = filterItems(state.items);
      const text = items.map((item) => `${item.title}\n${item.url}`).join("\n\n");
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        setStatus(`已复制 ${items.length} 个清单链接。`);
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        setStatus(`已复制 ${items.length} 个清单链接。`);
      }
    }

    controls.addEventListener("submit", (event) => {
      event.preventDefault();
      loadLatest();
    });

    copyButton.addEventListener("click", copyLinks);

    loadLatest();
  </script>
</body>
</html>
