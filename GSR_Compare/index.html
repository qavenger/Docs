<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSR 实测对比 · 高中低</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141b23; --panel2:#0f151c;
    --line:#243040; --line-soft:#1b242f;
    --txt:#e8eef6; --dim:#8b9aab; --dim2:#5f6d7c;
    --left:#4f9bfd; --right:#f0a24a; --on:#ffb545; --off:#7f8c9a;
    --acc:#5ec7bd;
    --radius:12px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 520px at 12% -12%, #17222e 0%, transparent 62%),
      radial-gradient(900px 480px at 92% -18%, #241d15 0%, transparent 58%),
      var(--bg);
    color:var(--txt);
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* 档位切换 */
  .tabbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 0}
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;font-size:13px;font-family:inherit;
    color:var(--dim);background:var(--panel2);
    border:1px solid var(--line);border-bottom-color:transparent;
    border-radius:10px 10px 0 0;cursor:pointer;transition:.14s;
    position:relative;top:1px;
  }
  .tab:hover{color:var(--txt);background:#18212c}
  .tab .dev{font-size:11.5px;color:var(--dim2)}
  .tab.on{color:#fff;background:var(--panel);border-color:var(--line);box-shadow:0 -2px 0 var(--acc) inset}
  .tab.on .dev{color:var(--dim)}
  .tab.bad{color:#ff9d9d;border-color:#4a2a2a}
  .tab.bad:hover{background:#2a1a1a}

  .top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:14px 18px 12px;border-top:1px solid var(--line)}
  .top h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.4px}
  .top h1 em{font-style:normal;color:var(--acc)}
  .top p{margin:6px 0 0;font-size:12px;color:var(--dim);letter-spacing:.2px}
  .top .src{margin-left:auto;font-size:12px;color:var(--dim2);text-align:right;line-height:1.7}
  .top .src b{color:var(--dim);font-weight:500}

  .bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 18px;margin:0 0 12px;
    background:linear-gradient(180deg,rgba(20,27,35,.9),rgba(16,22,29,.9));
    border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  }
  .pick{display:flex;align-items:center;gap:8px;min-width:0}
  .pick .tag{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:6px;border:1px solid transparent}
  .tag-l{color:#bcd8ff;background:rgba(79,155,253,.14);border-color:rgba(79,155,253,.45)}
  .tag-r{color:#ffdcb3;background:rgba(240,162,74,.14);border-color:rgba(240,162,74,.45)}

  select{
    appearance:none;-webkit-appearance:none;
    padding:7px 30px 7px 10px;min-width:0;max-width:min(30vw,320px);
    background-color:var(--panel2);
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    color:var(--txt);font-size:12.5px;font-family:inherit;
    border:1px solid var(--line);border-radius:8px;cursor:pointer;outline:none;text-overflow:ellipsis;
  }
  select:hover{border-color:#37485c}
  select:focus{border-color:var(--left);box-shadow:0 0 0 2px rgba(79,155,253,.18)}
  select option{background:#101720;color:var(--txt)}

  .btn{padding:7px 11px;font-size:12.5px;font-family:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:.14s;white-space:nowrap}
  .btn:hover{background:#1a2531;border-color:#39495d}
  .btn:active{transform:translateY(1px)}
  .btn.icon{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:15px;line-height:1}

  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
  .seg button{padding:5px 12px;font-size:12.5px;font-family:inherit;color:var(--dim);background:transparent;border:0;border-radius:7px;cursor:pointer;transition:.14s}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:#22303f;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}

  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--left);width:14px;height:14px;cursor:pointer}

  .zoom{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px 6px 2px 2px}
  #zoomTxt{font-size:12px;color:var(--dim);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
  .spacer{flex:1 1 auto}

  .stage{flex:1 1 auto;min-height:0;padding:0 18px 8px;display:flex}
  .side{flex:1 1 auto;display:flex;gap:12px;min-height:0;min-width:0}
  .pane{display:flex;flex-direction:column;flex:1 1 0;min-width:0;min-height:0;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .pane[data-side="L"]{box-shadow:0 0 0 1px rgba(79,155,253,.10) inset}
  .pane[data-side="R"]{box-shadow:0 0 0 1px rgba(240,162,74,.10) inset}

  .pane-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;border-bottom:1px solid var(--line-soft);background:rgba(255,255,255,.015);font-size:11.5px;color:var(--dim)}
  .who{font-weight:700;letter-spacing:1px;font-size:11px}
  .who.l{color:var(--left)}
  .who.r{color:var(--right)}

  .vp{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;cursor:grab;touch-action:none;background:#080b0f}
  .vp.drag{cursor:grabbing}
  .vp img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;max-width:none;max-height:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--dim2);pointer-events:none;letter-spacing:.5px;text-align:center;padding:20px;line-height:1.8}

  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{padding:2px 7px;border-radius:6px;font-size:11px;letter-spacing:.2px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:#c4d1de}
  .chip.on{color:#1b1206;background:var(--on);border-color:var(--on);font-weight:700}
  .chip.off{color:var(--off)}
  .chip.note{color:#9fb0c2;background:rgba(255,255,255,.03);border-style:dashed}

  .wipe-wrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel2)}
  .wipe-wrap .pane-head{justify-content:space-between}
  .wipe-wrap .pane-head .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wipe{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#080b0f;touch-action:none;cursor:crosshair}
  .wipe .layer{position:absolute;inset:0;overflow:hidden;will-change:clip-path}
  .wipe .layer img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;max-width:none;max-height:none}
  .wipe .guide{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(255,255,255,.38);z-index:4;pointer-events:none;opacity:0;transition:opacity .1s}
  .wipe .divider{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.92);box-shadow:0 0 12px rgba(0,0,0,.75);z-index:6;pointer-events:none}
  .wipe .knob{
    position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;
    border-radius:50%;background:rgba(12,17,23,.92);border:2px solid rgba(255,255,255,.92);
    display:grid;place-items:center;color:#fff;font-size:11px;letter-spacing:-1px;
    box-shadow:0 2px 10px rgba(0,0,0,.6);
  }

  footer{padding:6px 18px 12px;font-size:11.5px;color:var(--dim2);letter-spacing:.2px;display:flex;gap:14px;flex-wrap:wrap}
  footer b{color:var(--dim);font-weight:500}

  .empty{flex:1 1 auto;display:grid;place-items:center;border:1px dashed var(--line);border-radius:var(--radius);color:var(--dim);text-align:center;line-height:2;font-size:13px;padding:24px}
  .empty code{color:var(--acc);font-family:Consolas,monospace}

  @media (max-width:760px){
    .side{flex-direction:column}
    .top .src{margin-left:0;text-align:left}
    select{max-width:calc(100vw - 130px)}
  }
</style>
</head>
<body>

<nav class="tabbar" id="tabbar"></nav>

<header class="top">
  <div>
    <h1 id="h1">GSR 实测对比</h1>
    <p id="sub"></p>
  </div>
  <div class="src" id="srcLine"></div>
</header>

<div class="bar" id="toolbar">
  <div class="pick"><span class="tag tag-l">左</span><select id="selL" aria-label="左侧图片"></select></div>
  <button class="btn" id="swap" title="交换左右两侧的图">⇄ 交换</button>
  <div class="pick"><span class="tag tag-r">右</span><select id="selR" aria-label="右侧图片"></select></div>

  <div class="spacer"></div>

  <div class="seg" id="modeSeg">
    <button data-mode="side">并排</button>
    <button data-mode="wipe">擦除</button>
  </div>
  <label class="chk"><input type="checkbox" id="sync" checked><span>联动缩放</span></label>
  <div class="zoom">
    <button class="btn icon" id="zOut" title="缩小">−</button>
    <span id="zoomTxt">—</span>
    <button class="btn icon" id="zIn" title="放大">+</button>
  </div>
  <button class="btn" id="fit">适应窗口</button>
  <button class="btn" id="actual" title="按最大截图的原始像素 1:1 显示">1:1</button>
</div>

<main class="stage">
  <div class="side" id="sideView">
    <section class="pane" data-side="L">
      <div class="pane-head"><span class="who l">左</span><span class="chips" id="chipsL"></span></div>
      <div class="vp" id="vpL">
        <div class="loading">载入中…</div>
        <img id="imgL" alt="左侧截图">
      </div>
    </section>
    <section class="pane" data-side="R">
      <div class="pane-head"><span class="who r">右</span><span class="chips" id="chipsR"></span></div>
      <div class="vp" id="vpR">
        <div class="loading">载入中…</div>
        <img id="imgR" alt="右侧截图">
      </div>
    </section>
  </div>

  <div class="wipe-wrap" id="wipeWrap" hidden>
    <div class="pane-head">
      <div class="grp"><span class="who l">左</span><span class="chips" id="wipeChipsL"></span></div>
      <div class="grp"><span class="chips" id="wipeChipsR"></span><span class="who r">右</span></div>
    </div>
    <div class="wipe" id="wipeView">
      <div class="layer" id="layerL"><img id="wipeImgL" alt="左侧截图"></div>
      <div class="layer" id="layerR"><img id="wipeImgR" alt="右侧截图"></div>
      <div class="guide" id="guide"></div>
      <div class="divider" id="divider"><div class="knob">◀▶</div></div>
      <div class="loading" id="wipeLoading">载入图片…</div>
    </div>
  </div>

  <div class="empty" id="empty" hidden></div>
</main>

<footer>
  <span><b>滚轮</b> 缩放</span>
  <span><b>拖拽</b> 平移</span>
  <span><b>双击</b> 复位</span>
  <span><b>擦除模式</b> 单击画面任意位置 → 滑杆跳到该横坐标；拖动分隔条(或 ← →)微调；在画面上拖动则平移</span>
</footer>

<!-- 档位列表由 扫描图片.bat 生成 tiers.js；下面在启动时带时间戳加载，避免浏览器缓存旧列表 -->
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  // ── 可变状态（切档位时重置） ────────────────────────
  let CFG = {};
  let ITEMS = [];
  let BASE = '';
  let Wmax = 0;
  let mode = 'side';
  let wipeF = 0, wipeTx = 0, wipeTy = 0, wipePos = 0, wipeTouched = false;

  const MIN_F = 0.02, MAX_F = 8;
  const BAR_HIT = 14;

  const selL = $('selL'), selR = $('selR');
  const sideView = $('sideView'), wipeWrap = $('wipeWrap'), wipeView = $('wipeView');
  const layerL = $('layerL'), layerR = $('layerR');
  const wipeImgL = $('wipeImgL'), wipeImgR = $('wipeImgR');
  const wipeChipsL = $('wipeChipsL'), wipeChipsR = $('wipeChipsR');
  const divider = $('divider'), guide = $('guide');
  const syncBox = $('sync'), zoomTxt = $('zoomTxt');
  const wipeLoading = $('wipeLoading');

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  // ── 文件名 → 配置项 ────────────────────────────────
  function baseName(f){
    return String(f || '').replace(/^.*[\\/]/, '').replace(/\.[a-z0-9]+$/i, '');
  }
  function parseShot(entry){
    const raw = (typeof entry === 'string') ? { file: entry } : (entry || {});
    const base = baseName(raw.file);
    let name = base;
    // 结尾的 +GSR / -GSR / 空格GSR 都算开启（兼容 1080p+GSR、540-1080-GSR、540p GSR）
    const gsrOn = /[+＋\-_ ]*\s*gsr\s*$/i.test(name);
    if (gsrOn) name = name.replace(/[+＋\-_ ]*\s*gsr\s*$/i, '').trim();
    const isDefault = /^(默认|默认值|default|system)/i.test(name);

    let out = null, rend = null;
    const pair = name.match(/^(\d+)\s*p?\s*[-_x×/]\s*(\d+)\s*p?$/i);   // 540-1080 / 540x1080 / 540p-1080p
    const single = name.match(/^(\d+)\s*p$/i);                            // 540p
    const plain = name.match(/^(\d+)$/);                                  // 540
    if (pair) { rend = pair[1]; out = pair[2]; }
    else if (single) { out = rend = single[1]; }
    else if (plain) { out = rend = plain[1]; }
    else if (isDefault && /(\d+)/.test(name)) { out = rend = name.match(/(\d+)/)[1]; }

    let label = raw.label;
    if (!label) {
      if (isDefault) label = '真机默认' + (out ? ' ' + out + 'p' : '');
      else if (pair) label = '渲染' + rend + ' / 输出' + out;
      else if (single || plain) label = '真机 ' + out + 'p';
      else label = base;
      if (gsrOn) label += ' + GSR';
    }

    return {
      file: raw.file,
      src: BASE + '/src/' + raw.file,
      label, out: raw.out != null ? String(raw.out) : out,
      rend: raw.rend != null ? String(raw.rend) : rend,
      gsrOn: raw.gsr != null ? !!raw.gsr : gsrOn,
      note: raw.note || '', params: raw.params || '',
      w: raw.w || 0, h: raw.h || 0
    };
  }

  // ── 面板 ────────────────────────────────────────────
  function makePane(side, idx){
    const root = document.querySelector('.pane[data-side="' + side + '"]');
    return {
      side, root, idx,
      vp: root.querySelector('.vp'),
      img: root.querySelector('img'),
      chips: root.querySelector('.chips'),
      loadEl: root.querySelector('.loading'),
      w: 0, h: 0, a: 0.3, tx: 0, ty: 0,
      ready: false, touched: false
    };
  }
  const panes = { L: makePane('L', 0), R: makePane('R', 1) };

  function applyPanel(p){
    p.img.style.transform = 'translate3d(' + p.tx + 'px,' + p.ty + 'px,0) scale(' + p.a + ')';
  }
  function fitPanel(p){
    if (!p.w) return;
    const vw = p.vp.clientWidth || 1, vh = p.vp.clientHeight || 1;
    p.a = Math.min(vw / p.w, vh / p.h);
    p.tx = (vw - p.w * p.a) / 2;
    p.ty = (vh - p.h * p.a) / 2;
    p.touched = false;
    applyPanel(p);
  }
  function normCenter(p){
    const vw = p.vp.clientWidth || 1, vh = p.vp.clientHeight || 1;
    return { u: (vw / 2 - p.tx) / (p.w * p.a), v: (vh / 2 - p.ty) / (p.h * p.a) };
  }
  function setPanelFraction(p, f, u, v){
    const vw = p.vp.clientWidth || 1, vh = p.vp.clientHeight || 1;
    p.a = f * vw / p.w;
    p.tx = vw / 2 - u * p.w * p.a;
    p.ty = vh / 2 - v * p.h * p.a;
    applyPanel(p);
  }
  function panelFraction(p){ return p.a * p.w / (p.vp.clientWidth || 1); }

  function chipHTML(it){
    const tip = [it.params, (it.w ? it.w + '×' + it.h : ''), it.file].filter(Boolean).join(' · ');
    const cs = [];
    if (it.out)  cs.push('<span class="chip" title="' + esc(tip) + '">输出 ' + esc(it.out) + 'p</span>');
    if (it.rend) cs.push('<span class="chip">渲染 ' + esc(it.rend) + 'p</span>');
    cs.push('<span class="chip ' + (it.gsrOn ? 'on' : 'off') + '">GSR ' + (it.gsrOn ? 'On' : 'Off') + '</span>');
    if (it.note) cs.push('<span class="chip note">' + esc(it.note) + '</span>');
    return cs.join('');
  }

  function setImage(p, idx, keepView){
    const it = ITEMS[idx];
    if (!it) return;
    const vw = p.vp.clientWidth || 1, vh = p.vp.clientHeight || 1;
    const hasView = !!(p.w && p.h && p.a);
    const f = hasView ? (p.a * p.w) / vw : 0;
    const c = hasView ? { u: (vw / 2 - p.tx) / (p.w * p.a), v: (vh / 2 - p.ty) / (p.h * p.a) } : null;

    p.idx = idx;
    p.ready = false;
    if (it.w && it.h) { p.w = it.w; p.h = it.h; }
    p.img.alt = it.label;
    p.img.src = it.src;
    p.chips.innerHTML = chipHTML(it);
    if (keepView && c && f) setPanelFraction(p, f, c.u, c.v);
  }

  function syncFrom(p){
    if (mode !== 'side' || !syncBox.checked) return;
    const q = p === panes.L ? panes.R : panes.L;
    if (!q.ready) return;
    const c = normCenter(p);
    setPanelFraction(q, panelFraction(p), c.u, c.v);
    q.touched = true;
  }

  function zoomRatio(){
    if (mode === 'side') {
      const p = panes.L;
      return p.w ? (p.a * p.w) / (Wmax || p.w) : 0;
    }
    return Wmax ? (wipeF * (wipeView.clientWidth || 1)) / Wmax : 0;
  }
  function updateZoomLabel(){
    const r = zoomRatio();
    zoomTxt.textContent = r ? Math.round(r * 100) + '%' : '—';
  }

  // ── 擦除视图 ────────────────────────────────────────
  function wipeGeom(){
    const vw = wipeView.clientWidth || 1, vh = wipeView.clientHeight || 1;
    const wl = wipeImgL.naturalWidth || panes.L.w || 16;
    const hl = wipeImgL.naturalHeight || panes.L.h || 9;
    const wr = wipeImgR.naturalWidth || panes.R.w || wl;
    const hr = wipeImgR.naturalHeight || panes.R.h || hl;
    const Wd = wipeF * vw;
    return { vw, vh, wl, hl, wr, hr, Wd, al: Wd / wl, ar: Wd / wr, Hl: (Wd / wl) * hl, Hr: (Wd / wr) * hr };
  }
  function paintWipe(){
    const g = wipeGeom();
    wipeImgL.style.transform = 'translate3d(' + wipeTx + 'px,' + wipeTy + 'px,0) scale(' + g.al + ')';
    wipeImgR.style.transform = 'translate3d(' + wipeTx + 'px,' + wipeTy + 'px,0) scale(' + g.ar + ')';
    wipePos = clamp(wipePos, 0, g.vw);
    layerL.style.clipPath = 'inset(0 ' + (g.vw - wipePos) + 'px 0 0)';
    layerR.style.clipPath = 'inset(0 0 0 ' + wipePos + 'px)';
    divider.style.left = wipePos + 'px';
    updateZoomLabel();
  }
  function fitWipe(){
    const vw = wipeView.clientWidth || 1, vh = wipeView.clientHeight || 1;
    const iw = wipeImgL.naturalWidth || panes.L.w || 16;
    const ih = wipeImgL.naturalHeight || panes.L.h || 9;
    const Wd = Math.min(vw, (vh / ih) * iw);
    wipeF = Wd / vw;
    wipeTx = (vw - Wd) / 2;
    wipeTy = (vh - (Wd / iw) * ih) / 2;
    wipeTouched = false;
    paintWipe();
  }
  function zoomWipe(px, py, factor){
    const nf = clamp(wipeF * factor, MIN_F, MAX_F);
    if (!isFinite(nf) || Math.abs(nf - wipeF) < 1e-9) return;
    const k = nf / wipeF;
    wipeTx = px - (px - wipeTx) * k;
    wipeTy = py - (py - wipeTy) * k;
    wipeF = nf;
    wipeTouched = true;
    paintWipe();
  }
  function xAt(e){ const r = wipeView.getBoundingClientRect(); return e.clientX - r.left; }
  function nearBar(e){ return Math.abs(xAt(e) - wipePos) <= BAR_HIT; }

  function bindWipe(){
    let drag = null, downX = 0, downY = 0, startTx = 0, startTy = 0, moved = false;

    wipeView.addEventListener('wheel', e => {
      e.preventDefault();
      const r = wipeView.getBoundingClientRect();
      const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015));
      zoomWipe(e.clientX - r.left, e.clientY - r.top, f);
    }, { passive:false });

    wipeView.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      downX = e.clientX; downY = e.clientY; moved = false;
      startTx = wipeTx; startTy = wipeTy;
      drag = nearBar(e) ? 'bar' : 'pan';
      guide.style.opacity = '0';
      wipeView.setPointerCapture(e.pointerId);
      wipeView.style.cursor = drag === 'bar' ? 'ew-resize' : 'grabbing';
      if (drag === 'bar') { wipePos = clamp(xAt(e), 0, wipeView.clientWidth); paintWipe(); }
    });

    wipeView.addEventListener('pointermove', e => {
      const px = xAt(e);
      if (!drag) {
        wipeView.style.cursor = Math.abs(px - wipePos) <= BAR_HIT ? 'ew-resize' : 'crosshair';
        if (e.pointerType === 'mouse') { guide.style.left = px + 'px'; guide.style.opacity = '1'; }
        return;
      }
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 3) moved = true;
      if (drag === 'bar') { wipePos = clamp(px, 0, wipeView.clientWidth); paintWipe(); }
      else if (moved) {
        wipeTx = startTx + (e.clientX - downX);
        wipeTy = startTy + (e.clientY - downY);
        wipeTouched = true;
        paintWipe();
      }
    });

    const finish = e => {
      if (!drag) return;
      if (!moved && drag === 'pan') { wipePos = clamp(xAt(e), 0, wipeView.clientWidth); paintWipe(); }
      drag = null;
      wipeView.style.cursor = 'crosshair';
      try { wipeView.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    wipeView.addEventListener('pointerup', finish);
    wipeView.addEventListener('pointercancel', e => {
      drag = null; wipeView.style.cursor = 'crosshair';
      try { wipeView.releasePointerCapture(e.pointerId); } catch (_) {}
    });
    wipeView.addEventListener('pointerleave', () => { guide.style.opacity = '0'; });
    wipeView.addEventListener('dblclick', e => {
      e.preventDefault();
      fitWipe();
      wipePos = (wipeView.clientWidth || 1) / 2;
      paintWipe();
    });

    const onWipeImg = () => {
      if (mode !== 'wipe') return;
      if (wipeLoading) wipeLoading.style.display = 'none';
      if (!wipeTouched) fitWipe(); else paintWipe();
    };
    wipeImgL.addEventListener('load', onWipeImg);
    wipeImgR.addEventListener('load', onWipeImg);
    wipeImgL.addEventListener('error', () => {
      if (wipeLoading) wipeLoading.textContent = '缺少 ' + BASE + '/src/' + ITEMS[panes.L.idx].file;
    });
  }

  // ── 并排交互 ────────────────────────────────────────
  function zoomPanel(p, px, py, factor){
    const f = panelFraction(p);
    const nf = clamp(f * factor, MIN_F, MAX_F);
    if (!isFinite(nf) || Math.abs(nf - f) < 1e-9) return;
    const k = nf / f;
    p.tx = px - (px - p.tx) * k;
    p.ty = py - (py - p.ty) * k;
    p.a = nf * (p.vp.clientWidth || 1) / p.w;
    p.touched = true;
    applyPanel(p);
    updateZoomLabel();
    syncFrom(p);
  }

  function bindPane(p){
    const el = p.vp;
    let dragging = false, lastX = 0, lastY = 0;

    el.addEventListener('wheel', e => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015));
      zoomPanel(p, e.clientX - r.left, e.clientY - r.top, f);
    }, { passive:false });

    el.addEventListener('pointerdown', e => {
      if (e.button !== 0 || !p.w) return;
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      el.classList.add('drag');
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      p.tx += e.clientX - lastX;
      p.ty += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      p.touched = true;
      applyPanel(p);
      syncFrom(p);
    });
    const end = e => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('drag');
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('dblclick', () => { fitPanel(p); syncFrom(p); updateZoomLabel(); });

    p.img.addEventListener('load', () => {
      const prevW = p.w;
      p.w = p.img.naturalWidth;
      p.h = p.img.naturalHeight;
      if (ITEMS[p.idx]) { ITEMS[p.idx].w = p.w; ITEMS[p.idx].h = p.h; }
      Wmax = Math.max(Wmax, p.w);
      p.ready = true;
      if (p.loadEl) p.loadEl.style.display = 'none';
      if (!p.touched || !p.a) fitPanel(p);
      else if (prevW && prevW !== p.w) p.a = p.a * prevW / p.w;
      applyPanel(p);
      updateZoomLabel();
    });
    p.img.addEventListener('error', () => {
      if (p.loadEl) {
        p.loadEl.style.display = '';
        p.loadEl.textContent = '缺少 ' + ITEMS[p.idx].src;
      }
    });
  }

  // ── 模式 ────────────────────────────────────────────
  function setMode(next){
    mode = next;
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === next));
    const isSide = next === 'side';
    sideView.hidden = !isSide;
    wipeWrap.hidden = isSide;
    syncBox.disabled = !isSide;
    syncBox.parentElement.style.opacity = isSide ? '1' : '.45';

    if (isSide) {
      requestAnimationFrame(() => {
        if (panes.L.ready) fitPanel(panes.L);
        if (panes.R.ready) fitPanel(panes.R);
        updateZoomLabel();
      });
    } else {
      refreshWipeImages();
      requestAnimationFrame(() => {
        fitWipe();
        wipePos = (wipeView.clientWidth || 1) / 2;
        paintWipe();
      });
    }
  }
  function refreshWipeImages(){
    const li = panes.L.idx, ri = panes.R.idx;
    wipeImgL.src = ITEMS[li].src;
    wipeImgR.src = ITEMS[ri].src;
    wipeChipsL.innerHTML = chipHTML(ITEMS[li]);
    wipeChipsR.innerHTML = chipHTML(ITEMS[ri]);
    if (wipeLoading) { wipeLoading.style.display = ''; wipeLoading.textContent = '载入图片…'; }
  }

  // ── 档位切换 ────────────────────────────────────────
  function applyHeader(cfg){
    document.title = ['GSR 实测对比', cfg.tier, cfg.device].filter(Boolean).join(' · ');
    $('h1').innerHTML = 'GSR 实测对比'
      + (cfg.tier ? ' · <em>' + esc(cfg.tier) + '</em>' : '')
      + (cfg.device ? '（' + esc(cfg.device) + '）' : '');
    $('sub').textContent = cfg.subtitle || [
      cfg.hardware || '', ITEMS.length + ' 组截图', '左、右两侧可各自选择要对比的版本'
    ].filter(Boolean).join('　|　');
    $('srcLine').innerHTML = '<b>来源</b>：' + esc(cfg.source || (BASE + '/src/'))
      + '<br><b>命名</b>：渲染-输出，+GSR 表示开启 GSR；纯 xxxp 为真机设置，「默认」为该机型默认';
    document.documentElement.style.setProperty('--acc', cfg.accent || '#5ec7bd');
  }

  function resetViewer(){
    Wmax = 0;
    wipeF = 0; wipeTx = 0; wipeTy = 0; wipePos = 0; wipeTouched = false;
    [panes.L, panes.R].forEach(p => {
      p.w = 0; p.h = 0; p.a = 0.3; p.tx = 0; p.ty = 0;
      p.ready = false; p.touched = false;
      p.img.removeAttribute('src');
      p.img.style.transform = '';
      p.chips.innerHTML = '';
      if (p.loadEl) { p.loadEl.style.display = ''; p.loadEl.textContent = '载入中…'; }
    });
    wipeImgL.removeAttribute('src');
    wipeImgR.removeAttribute('src');
    wipeChipsL.innerHTML = '';
    wipeChipsR.innerHTML = '';
    if (wipeLoading) { wipeLoading.style.display = ''; wipeLoading.textContent = '载入图片…'; }
    layerL.style.clipPath = 'inset(0 100% 0 0)';
    layerR.style.clipPath = 'inset(0 0 0 100%)';
    divider.style.left = '0px';
    zoomTxt.textContent = '—';
  }

  const findIdx = key => {
    if (!key) return -1;
    const k = String(key).toLowerCase();
    return ITEMS.findIndex(it =>
      it.file.toLowerCase() === k || baseName(it.file).toLowerCase() === k || it.label.toLowerCase() === k);
  };

  function activate(i){
    const tab = TABS[i];
    if (!tab) return;
    CUR = i;
    document.querySelectorAll('.tab').forEach((el, k) => el.classList.toggle('on', k === i));

    resetViewer();

    if (!tab.cfg) {
      document.title = 'GSR 实测对比 · ' + tab.dir;
      $('h1').innerHTML = 'GSR 实测对比 · <em>' + esc(tab.dir) + '</em>';
      $('sub').textContent = '配置读取失败';
      $('srcLine').innerHTML = '';
      $('toolbar').hidden = true;
      sideView.hidden = true; wipeWrap.hidden = true;
      const e = $('empty');
      e.hidden = false;
      e.innerHTML = '<div>' + esc(tab.dir) + ' 的配置读取失败<br><br>' + esc(tab.error || '')
        + '<br><br>改好 <code>' + esc(tab.dir) + '/config.js</code> 后刷新页面</div>';
      return;
    }

    CFG = tab.cfg;
    BASE = tab.dir;
  function shotOrder(it){
    const isDef = /^(默认|默认值|default|system)/i.test(baseName(it.file)) ? 0 : 1;
    return [isDef, it.out ? +it.out : 9999, it.rend ? +it.rend : 9999, it.gsrOn ? 1 : 0];
  }
  function byOrder(a, b){
    const ka = shotOrder(a), kb = shotOrder(b);
    for (let i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
    return a.file.localeCompare(b.file);
  }

    ITEMS = ((tab.files && tab.files.length) ? tab.files : (Array.isArray(CFG.shots) ? CFG.shots : []))
      .map(parseShot).sort(byOrder);
    applyHeader(CFG);

    selL.innerHTML = ''; selR.innerHTML = '';
    ITEMS.forEach((it, k) => {
      selL.add(new Option(it.label, String(k)));
      selR.add(new Option(it.label, String(k)));
    });

    if (!ITEMS.length) {
      sideView.hidden = true; wipeWrap.hidden = true;
      $('toolbar').hidden = true;
      const e = $('empty');
      e.hidden = false;
      e.innerHTML = '<div>' + esc(tab.dir) + ' 这一档还没有图片<br><br>把 PNG 放进 <code>' + esc(tab.dir)
        + '/src/</code>，然后运行根目录的 <code>扫描图片.bat</code>（生成 <code>src/files.js</code>），刷新页面</div>';
      return;
    }
    $('empty').hidden = true;
    $('toolbar').hidden = false;

    const li = Math.max(0, findIdx(CFG.left));
    const riRaw = findIdx(CFG.right);
    const ri = riRaw >= 0 ? riRaw : (ITEMS.length > 1 ? 1 : 0);
    panes.L.idx = li;
    panes.R.idx = ri;
    selL.value = String(li);
    selR.value = String(ri);

    setImage(panes.L, li);
    setImage(panes.R, ri);

    setMode(CFG.mode === 'wipe' ? 'wipe' : 'side');
    updateZoomLabel();

    // 预取本档图片（延后，避免抢首屏）
    setTimeout(() => {
      if (BASE !== tab.dir) return;
      ITEMS.forEach(it => { const im = new Image(); im.onload = () => { Wmax = Math.max(Wmax, im.naturalWidth); }; im.src = it.src; });
    }, 300);
  }

  // ── 档位加载 ────────────────────────────────────────
  let CUR = -1;
  const TABS = [];

  // 每次打开都带着时间戳，避免浏览器缓存旧的 tiers.js（否则新加的文件夹不会出现在 Tab 里）
  function loadTiers(){
    return new Promise((resolve) => {
      const fallback = ['高', '中', '低'];
      window.GSR_TIERS = undefined;
      const s = document.createElement('script');
      s.src = 'tiers.js?t=' + Date.now();
      s.onload = () => resolve(
        (Array.isArray(window.GSR_TIERS) && window.GSR_TIERS.length)
          ? window.GSR_TIERS.slice() : fallback);
      s.onerror = () => resolve(fallback);   // 还没扫描过时退回老三档
      document.head.appendChild(s);
    });
  }

  function loadConfig(dir){
    return new Promise((resolve, reject) => {
      window.GSR_CONFIG = undefined;   // 先清掉上一档，语法错误时不会误用旧配置
      const s = document.createElement('script');
      s.src = encodeURI(dir) + '/config.js?t=' + Date.now();
      s.onload = () => {
        const cfg = window.GSR_CONFIG;
        if (!cfg) return reject(new Error('config.js 没有生效：常见是中文逗号「，」、少写逗号或引号没闭合'));
        resolve(cfg);
      };
      s.onerror = () => reject(new Error('找不到 ' + dir + '/config.js'));
      document.head.appendChild(s);
    });
  }

  function loadFiles(dir){
    return new Promise((resolve) => {
      window.GSR_FILES = undefined;
      const s = document.createElement('script');
      s.src = encodeURI(dir) + '/src/files.js?t=' + Date.now();
      s.onload = () => resolve(Array.isArray(window.GSR_FILES) ? window.GSR_FILES.slice() : []);
      s.onerror = () => resolve([]);
      document.head.appendChild(s);
    });
  }

  function renderTabs(){
    const bar = $('tabbar');
    bar.innerHTML = '';
    TABS.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (t.cfg ? '' : ' bad');
      b.innerHTML = esc(t.dir)          // Tab 名 = 文件夹名（不再读 config.js 的 tier）
        + '<span class="dev">' + esc(t.cfg ? (t.cfg.device || '') : '配置读取失败') + '</span>';
      b.addEventListener('click', () => { if (i !== CUR) activate(i); });
      bar.appendChild(b);
    });
  }

  function fatal(msg){
    $('tabbar').hidden = true;
    $('toolbar').hidden = true;
    sideView.hidden = true; wipeWrap.hidden = true;
    const e = $('empty');
    e.hidden = false;
    e.innerHTML = '<div>' + msg + '</div>';
  }

  // ── 事件绑定（只绑一次） ────────────────────────────
  selL.addEventListener('change', () => {
    setImage(panes.L, +selL.value, true);
    if (mode === 'wipe') refreshWipeImages();
  });
  selR.addEventListener('change', () => {
    setImage(panes.R, +selR.value, true);
    if (mode === 'wipe') refreshWipeImages();
  });
  $('swap').addEventListener('click', () => {
    const a = panes.L.idx, b = panes.R.idx;
    selL.value = String(b); selR.value = String(a);
    setImage(panes.L, b, true);
    setImage(panes.R, a, true);
    if (mode === 'wipe') refreshWipeImages();
  });
  $('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (b && b.dataset.mode !== mode) setMode(b.dataset.mode);
  });
  syncBox.addEventListener('change', () => { if (syncBox.checked) syncFrom(panes.L); });
  $('zIn').addEventListener('click', () => {
    if (mode === 'side') { const r = panes.L.vp.getBoundingClientRect(); zoomPanel(panes.L, r.width / 2, r.height / 2, 1.3); }
    else { const r = wipeView.getBoundingClientRect(); zoomWipe(r.width / 2, r.height / 2, 1.3); }
  });
  $('zOut').addEventListener('click', () => {
    if (mode === 'side') { const r = panes.L.vp.getBoundingClientRect(); zoomPanel(panes.L, r.width / 2, r.height / 2, 1 / 1.3); }
    else { const r = wipeView.getBoundingClientRect(); zoomWipe(r.width / 2, r.height / 2, 1 / 1.3); }
  });
  $('fit').addEventListener('click', () => {
    if (mode === 'side') { fitPanel(panes.L); fitPanel(panes.R); syncFrom(panes.L); }
    else { fitWipe(); wipePos = (wipeView.clientWidth || 1) / 2; paintWipe(); }
    updateZoomLabel();
  });
  $('actual').addEventListener('click', () => {
    if (mode === 'side') {
      const p = panes.L, vw = p.vp.clientWidth || 1;
      if (!p.w) return;
      setPanelFraction(p, (Wmax || p.w) / vw, 0.5, 0.5);
      p.touched = true;
      const q = panes.R;
      if (q.ready) { setPanelFraction(q, (Wmax || q.w) / (q.vp.clientWidth || 1), 0.5, 0.5); q.touched = true; }
      updateZoomLabel();
    } else {
      const vw = wipeView.clientWidth || 1;
      const w = wipeImgL.naturalWidth || panes.L.w || 16;
      wipeF = (Wmax || w) / vw;
      const a = (wipeF * vw) / w;
      wipeTx = vw / 2 - 0.5 * w * a;
      wipeTy = (wipeView.clientHeight || 1) / 2 - 0.5 * (wipeImgL.naturalHeight || panes.L.h || 9) * a;
      wipeTouched = true;
      paintWipe();
    }
  });
  window.addEventListener('keydown', e => {
    if (mode === 'wipe' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      wipePos = clamp(wipePos + (e.key === 'ArrowLeft' ? -16 : 16), 0, wipeView.clientWidth);
      paintWipe();
      e.preventDefault();
    }
    if (e.key === 'f' || e.key === 'F') $('fit').click();
  });

  function relayout(){
    if (mode === 'side') {
      ['L', 'R'].forEach(k => {
        const p = panes[k];
        if (!p.ready) return;
        const c = normCenter(p);
        if (!p.touched) fitPanel(p);
        else { const f = panelFraction(p); setPanelFraction(p, f, c.u, c.v); }
      });
    } else if (wipeF) {
      paintWipe();
    }
    updateZoomLabel();
  }
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => relayout());
    ro.observe(panes.L.vp); ro.observe(panes.R.vp); ro.observe(wipeView);
  }
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(relayout, 120); });

  bindPane(panes.L);
  bindPane(panes.R);
  bindWipe();

  // ── 启动 ────────────────────────────────────────────
  (async () => {
    const TIER_LIST = await loadTiers();
    for (const dir of TIER_LIST) {
      try {
        const cfg = await loadConfig(dir);
        const files = await loadFiles(dir);
        TABS.push({ dir, cfg, files });
      } catch (err) {
        TABS.push({ dir, cfg: null, files: [], error: (err && err.message) || String(err) });
      }
    }
    if (!TABS.some(t => t.cfg)) {
      fatal('没有找到任何档位<br><br>需要 <code>高/config.js</code> 这样的结构；跑一次 <code>扫描图片.bat</code> 会自动生成档位列表');
      return;
    }
    renderTabs();
    activate(0);
  })();
})();
</script>
</body>
</html>
