    border-radius: 6px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
}
.pl-graph.panning { cursor: grabbing; }

    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    will-change: transform;
}
.pl-graph-edges {
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 1px;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
}
.pl-edge { stroke-width: 1.5; fill: none; opacity: 0.6; }
.pl-edge.back { stroke-dasharray: 5 4; opacity: 0.75; }
.pl-edge.hl { opacity: 1; stroke-width: 2.6; }
.pl-graph-ctrl {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 10;
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(20, 20, 24, 0.85);
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid #2a2a2e;
}
.pl-graph-ctrl .pl-zoom { font-size: 0.76rem; color: #8aa8c8; font-family: var(--pl-mono); min-width: 40px; }
.pl-graph-ctrl button {
    background: #1a2530; color: #aac8e0; border: 1px solid #2a3a4a;
    padding: 2px 9px; font-size: 0.74rem; border-radius: 3px;
}
.pl-graph-ctrl button:hover { background: #243545; }
.pl-graph-hint {
    position: absolute;
    bottom: 8px; left: 10px;
    z-index: 10;
    font-size: 0.72rem;
    color: #666;
    background: rgba(20, 20, 24, 0.75);
    padding: 3px 8px;
    border-radius: 3px;
    pointer-events: none;
}
.pl-node {
    position: absolute;
    background: #131316;
    border: 1px solid #2a2a2e;
    border-radius: 5px;
    z-index: 2;
    font-family: var(--pl-sans);
    transition: border-color 0.15s, box-shadow 0.15s;
    user-select: none;

    max-width: 520px;
}
.pl-node:hover { border-color: #5aa0e0; box-shadow: 0 0 16px rgba(106, 176, 224, 0.15); }
.pl-node.dragging { box-shadow: 0 4px 24px rgba(106, 176, 224, 0.3); border-color: #5aa0e0; z-index: 3; }
.pl-node-head {
    padding: 5px 9px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px 4px 0 0;

    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.35);
}
.pl-node.dragging .pl-node-head { cursor: grabbing; }
.pl-node-title { flex: 1; white-space: nowrap; color: #fff; font-weight: 600; font-size: 0.8rem; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45); }
.pl-node-tag {
    font-size: 0.6rem; padding: 1px 5px; border-radius: 2px; letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.95); font-weight: 600;
    background: rgba(0, 0, 0, 0.32); border: 1px solid rgba(255, 255, 255, 0.18);
}
.pl-lt {
    margin: 5px 9px 0;
    padding: 2px 6px;
    font-size: 0.62rem;
    font-family: var(--pl-mono);

}

.pl-lt.frame    { color: #7adcff; border-color: #2a6a8a; background: rgba(48, 128, 170, 0.20); }
.pl-lt.history  { color: #c9a8ff; border-color: #5a3a8a; background: rgba(110, 70, 170, 0.20); }
.pl-node-dp {

}
.pl-dp-kind {
    font-weight: 700; letter-spacing: 1px; padding: 0 3px; margin-right: 4px; border-radius: 2px;
    color: var(--dp, #5aa0e0); background: color-mix(in srgb, var(--dp, #5aa0e0) 18%, transparent);
}
.pl-dp-id { color: #8aa8b8; font-size: 0.62rem; }
.pl-dp-note { color: #8a8a90; font-style: italic; }
.pl-node-desc { padding: 5px 9px 0; font-size: 0.66rem; color: #7a7a82; font-family: var(--pl-mono); font-style: italic; }
.pl-node-pins { display: flex; justify-content: space-between; padding: 6px 0 7px; gap: 8px; }

.pl-pins.out { align-items: flex-end; text-align: right; }
.pl-pin { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: #a4a4a4; padding: 1px 0; white-space: nowrap; }
.pl-pin-dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #131316; flex-shrink: 0; }
.pl-pins.in .pl-pin-dot { margin-left: -5px; }

.pl-pin.ext span { font-style: italic; color: #808080; }

.pl-legend { display: flex; gap: 8px 18px; margin-top: 10px; font-size: 0.76rem; color: #9a9a9a; flex-wrap: wrap; align-items: center; }
.pl-legend > strong { color: #c4c4c4; letter-spacing: 1px; font-size: 0.72rem; width: 100%; display: block; }
.pl-legend-item { display: flex; align-items: center; gap: 6px; }
.pl-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.pl-legend .pl-dp-kind { font-family: var(--pl-mono); font-size: 0.66rem; }

.pl-common {
    background: linear-gradient(to bottom, #0a1015, #0e1418);

    border-radius: 5px;
    margin-bottom: 12px;
}
.pl-common > summary {
    cursor: pointer;
    padding: 9px 14px;
    color: #6ab0e0;
    font-size: 0.82rem;
    letter-spacing: 1.2px;
    font-weight: 600;
    user-select: none;
    list-style: none;
}

.pl-common > summary:hover { background: #131e25; }
.pl-common-body { padding: 4px 14px 12px; border-top: 1px solid #1a2a30; }

.pl-common-note { color: #8a90a4; font-size: 0.8rem; margin: 8px 0 4px; }

/* ── Node detail modal ── */
.pl-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.65); z-index: 9998; backdrop-filter: blur(2px);
}
.pl-backdrop.open { display: block; }
.pl-modal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 760px;
    max-width: 94vw;
    max-height: 86vh;
    background: #161618;
    border: 1px solid #2a2a30;
    border-radius: 8px;
    z-index: 9999;
    flex-direction: column;
    box-shadow: 0 12px 64px rgba(0, 0, 0, 0.8);
}
.pl-modal.open { display: flex; }
.pl-modal.wide { width: min(94vw, 1040px); max-height: 92vh; }
.pl-modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-bottom: 1px solid #232328;
}
.pl-modal-title { color: #eee; font-weight: 600; font-size: 1rem; flex: 1; font-family: var(--pl-mono); }
.pl-modal-tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; color: #fff; letter-spacing: 1px; font-weight: 600; }
.pl-modal-close {
    background: transparent; border: 1px solid #2a2a30; color: #888;
    width: 30px; height: 30px; padding: 0; font-size: 1.05rem; border-radius: 4px;
}
.pl-modal-close:hover { color: #fff; border-color: #4a4a50; background: #2a2a30; }

.pl-nd-label {
    color: #6ab0e0; font-size: 0.7rem; letter-spacing: 2px; margin: 14px 0 6px;
    text-transform: uppercase; display: block; font-weight: 600;
}
.pl-nd-label:first-child { margin-top: 0; }
.pl-nd-desc { color: #a4a4a4; font-size: 0.88rem; line-height: 1.75; margin-bottom: 4px; }
.pl-nd-lt { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid; border-radius: 4px; margin-bottom: 4px; }
.pl-nd-lt .pl-lt { margin: 0; }
.pl-nd-lt .pl-lt-tip { font-size: 0.8rem; color: #a4a4a4; }
.pl-nd-lt.resident { border-color: #7a5a2a; background: rgba(160, 106, 42, 0.10); }
.pl-nd-lt.param    { border-color: #7a4a2a; background: rgba(160, 80, 42, 0.10); }
.pl-nd-lt.frame    { border-color: #2a6a8a; background: rgba(48, 128, 170, 0.10); }
.pl-nd-lt.history  { border-color: #5a3a8a; background: rgba(110, 70, 170, 0.10); }
.pl-nd-dp { border-left: 2px solid var(--dp, #5aa0e0); background: #0e1114; padding: 6px 10px; border-radius: 0 4px 4px 0; font-family: var(--pl-mono); font-size: 0.78rem; }
.pl-nd-dp + .pl-nd-dp { margin-top: 6px; }
.pl-nd-dp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.pl-nd-dp-name { color: #e0e0e8; font-weight: 600; }
.pl-nd-dp table { width: 100%; border-collapse: collapse; }
.pl-nd-dp td { padding: 2px 6px 2px 0; vertical-align: top; }
.pl-nd-dp td:first-child { color: #8a90a0; width: 140px; font-size: 0.74rem; }
.pl-nd-dp td code { color: #c8d6e6; background: #161a20; padding: 0 5px; border-radius: 2px; }
.pl-nd-dp .pl-dp-note { margin-top: 4px; font-size: 0.74rem; }
.pl-conv, .pl-nd-common {
    background: #0e0e0e; border-left: 2px solid #3a3a2a; padding: 8px 12px;
    font-family: var(--pl-mono); font-size: 0.82rem; color: #a4a4a4; white-space: pre-wrap; line-height: 1.7;
    border-radius: 0 3px 3px 0; overflow-x: auto;
}
.pl-nd-common { border-left-color: #2a4a5a; }
.pl-nd-pins { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-family: var(--pl-mono); font-size: 0.78rem; }
.pl-nd-pins div { display: flex; align-items: center; gap: 6px; color: #b0b0b0; }
.pl-nd-preview { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 8px 0; }
.pl-nd-preview canvas { display: block; width: 300px; height: auto; max-width: 100%; border: 1px solid #2a2a2a; image-rendering: pixelated; background: #050505; }
.pl-nd-preview canvas.smooth { image-rendering: auto; }
.pl-nd-preview.large canvas { width: min(72vh, 760px); }
.pl-nd-preview .pl-pv-label { font-size: 0.78rem; }

/* ── Library appendix + References ── */
.pl-lib { padding-top: 0; }
.pl-refs { max-width: 1240px; margin: 0 auto; padding: 0 24px 64px; }
.pl-refs-card { background: #111; border: 1px solid #1f1f1f; border-radius: 8px; padding: 18px 24px; }
.pl-refs ol { padding-left: 1.4em; font-size: 0.86rem; color: #9a9a9a; line-height: 1.95; }
.pl-refs .pl-ref-note { color: #777; }

/* ── Runtime problem overlay (only visible when something is broken) ── */
.pl-overlay {
    position: fixed; right: 12px; bottom: 12px; z-index: 10003;
    max-width: min(560px, 90vw); max-height: 40vh; overflow: auto;
    background: rgba(40, 10, 10, 0.95); border: 1px solid #7a2a2a; border-radius: 6px;
    color: #f0b0b0; font-family: var(--pl-mono); font-size: 0.76rem; padding: 10px 12px;
    white-space: pre-wrap; display: none;
}
.pl-overlay b { color: #ffd0d0; }

/* screenshot mode (validator) */
.pl-shot .pl-header { position: static; }

<div id="pl-root"></div>
<script>
/* Pipeline Lab runtime — builds an interactive step-by-step pipeline explainer from a spec.
 * Usage (content file):  PipelineLab.mount({ title, params, stages, steps, graph, ... })
 * Full API: references/framework-api.md of the pipeline-explainer skill.
 * Exposes window.PipelineLab (alias window.PL). No external dependencies. */
(function () {
'use strict';

const PL = {};
window.PipelineLab = PL;
window.PL = PL;

// ════════════════════════════════════════════════════════════
// Small utilities
// ════════════════════════════════════════════════════════════
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
const isFn = (f) => typeof f === 'function';
const arr = (x) => (x == null ? [] : Array.isArray(x) ? x : [x]);
const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
};
const SVGNS = 'http://www.w3.org/2000/svg';
const raf = () => new Promise((r) => requestAnimationFrame(() => r()));

PL.esc = esc;
PL.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
PL.lerp = (a, b, t) => a + (b - a) * t;
PL.smoothstep = (e0, e1, x) => { const t = PL.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
PL.fract = (x) => x - Math.floor(x);
PL.rng = function (seed) {                       // mulberry32 → () ∈ [0,1)
    let a = (seed >>> 0) || 1;
    return function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
};
PL.gauss2 = function (rand) {                    // Box-Muller → [n0, n1] ~ N(0,1)
    const u1 = Math.max(rand(), 1e-12), u2 = rand();
    const r = Math.sqrt(-2 * Math.log(u1)), a = 2 * Math.PI * u2;
    return [r * Math.cos(a), r * Math.sin(a)];
};
PL.gauss = (rand) => PL.gauss2(rand)[0];
PL.buf = function (owner, name, length, Type) {  // reuse or (re)allocate a typed array
    Type = Type || Float32Array;
    const cur = owner[name];
    if (cur && cur.length === length && cur instanceof Type) return cur;
    return (owner[name] = new Type(length));
};
PL.hexToRgb = (hex) => [parseInt(hex.slice(1, 3), 16) / 255, parseInt(hex.slice(3, 5), 16) / 255, parseInt(hex.slice(5, 7), 16) / 255];
PL.v3 = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
    reflect: (d, n) => { const k = 2 * (d[0] * n[0] + d[1] * n[1] + d[2] * n[2]); return [d[0] - k * n[0], d[1] - k * n[1], d[2] - k * n[2]]; },
};

// ════════════════════════════════════════════════════════════
// FFT (radix-2, in place). Forward uses e^{-i}, inverse e^{+i} with 1/n per 1D pass.
// ════════════════════════════════════════════════════════════
function fft1d(re, im, inverse) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let len = 2; len <= n; len <<= 1) {
        const ang = (inverse ? 2 : -2) * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
        for (let i = 0; i < n; i += len) {
            let cr = 1, ci = 0;
            for (let j = 0; j < half; j++) {
                const a = i + j, b = a + half;
                const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
                re[b] = re[a] - xr; im[b] = im[a] - xi;
                re[a] += xr; im[a] += xi;
                const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
            }
        }
    }
    if (inverse) { const s = 1 / n; for (let i = 0; i < n; i++) { re[i] *= s; im[i] *= s; } }
}
const fftScratch = new Map();
function scratch(n) {
    let s = fftScratch.get(n);
    if (!s) { s = [new Float64Array(n), new Float64Array(n)]; fftScratch.set(n, s); }
    return s;
}
function fftRows(re, im, W, H, inverse) {
    const [tr, ti] = scratch(W);
    for (let y = 0; y < H; y++) {
        const o = y * W;
        for (let x = 0; x < W; x++) { tr[x] = re[o + x]; ti[x] = im[o + x]; }
        fft1d(tr, ti, inverse);
        for (let x = 0; x < W; x++) { re[o + x] = tr[x]; im[o + x] = ti[x]; }
    }
}
function fftCols(re, im, W, H, inverse) {
    const [tr, ti] = scratch(H);
    for (let x = 0; x < W; x++) {
        for (let y = 0; y < H; y++) { tr[y] = re[y * W + x]; ti[y] = im[y * W + x]; }
        fft1d(tr, ti, inverse);
        for (let y = 0; y < H; y++) { re[y * W + x] = tr[y]; im[y * W + x] = ti[y]; }
    }
}
PL.fft = {
    fft1d,
    rows: fftRows,
    cols: fftCols,
    fft2d(re, im, W, H, inverse) { H = H || W; fftRows(re, im, W, H, inverse); fftCols(re, im, W, H, inverse); },
    freq: (i, n) => (i < n / 2 ? i : i - n),                      // bin index → signed frequency
    shift: (x, y, W, H) => ((y + (H >> 1)) % H) * W + ((x + (W >> 1)) % W),  // display (x,y) → source index (DC centered)
};

// ════════════════════════════════════════════════════════════
// Colormaps — f(t ∈ [0,1], out) → out = [r,g,b] in 0..255
// ════════════════════════════════════════════════════════════
function stops(list) {
    const c = list.map((hx) => [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)]);
    const n = c.length - 1;
    return function (t, out) {

// guides vs strands, projected with the shared camera (vector drawing)
function drawGroom(c, S) {
    const { ctx, w, h } = PL.draw.ctx(c), cam = IX.cam;
    const P = (x, y, z) => { const p = HAIR.project(cam, [x, y, z], w, h); return [p[0], p[1]]; };
    ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(150,180,210,0.35)';
    S.groom.strands.forEach((s, k) => { if (k % 3) return; ctx.beginPath(); for (let i = 0; i < s.p.length; i += 3) { const [x, y] = P(s.p[i], s.p[i + 1], s.p[i + 2]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.stroke(); });
    ctx.lineWidth = 2; ctx.strokeStyle = '#e0a060';
    S.groom.guides.forEach((g) => { ctx.beginPath(); for (let i = 0; i < g.p.length; i += 3) { const [x, y] = P(g.p[i], g.p[i + 1], g.p[i + 2]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.stroke(); });
    ctx.fillStyle = '#888'; ctx.font = '10px Consolas, monospace'; ctx.fillText(`${S.groom.guides.length} guides → ${S.groom.strands.length} strands`, 6, 14);
}
// one clump (strands of guide 3) rasterized in its own front view = what a card bake stores in the coverage channel
function drawCardBake(c, S) {
    const clump = S.groom.strands.filter((s) => s.guide === 3), g = S.groom.guides[3];
    const cx = g.p[3 * 12], cz = g.p[3 * 12 + 2];
    const r = HAIR.raster(clump, HAIR.ortho({ center: [cx, -7, cz], size: 16 }), 64, 128, { widthScale: 2 });
    PL.draw.field(c, r.alpha, 64, 128, { range: [0, 1], map: 'gray' });
}
