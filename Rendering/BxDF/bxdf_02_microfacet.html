// Mount
// ════════════════════════════════════════════════════════════
PL.mount = function (spec) {
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', () => PL.mount(spec), { once: true }); return; }
    try { mountImpl(spec); } catch (e) { report('mount', e); } finally { PL._readyResolve(); }
};
function mountImpl(spec) {
    if (booted) { problem('error', 'mount', 'PipelineLab.mount called twice'); return; }

    SPEC = spec || {};
    const lang = SPEC.lang || 'zh-CN';
    LK = /^zh/i.test(lang) ? 'zh' : 'en';
    T = Object.assign({}, TEXT[LK], SPEC.ui || {});
    document.documentElement.lang = lang;
    if (SPEC.title) document.title = SPEC.title;
    if (SPEC.css) document.head.appendChild(el('style', '', SPEC.css));
    overlayEl = el('div', 'pl-overlay');
    document.body.appendChild(overlayEl);
    updateOverlay();

    S = PL.S = { t: 0, dt: 0, frame: 0, epoch: 0, seed: (SPEC.seed >>> 0) || 1337, playing: SPEC.autoplay !== false, timeScale: 1 };
    S.rand = PL.rng(S.seed);
    if (SPEC.state) Object.assign(S, isFn(SPEC.state) ? SPEC.state(S, PL) : SPEC.state);
    arr(SPEC.params).forEach((p) => {
        if (!p.id) { problem('error', 'params', 'param without id'); return; }
        if (RESERVED.has(p.id)) problem('error', 'param:' + p.id, 'reserved id (t, dt, frame, epoch, seed, rand, playing, timeScale)');
        p.type = p.type || (p.options ? 'select' : typeof p.value === 'boolean' ? 'check' : /^#[0-9a-f]{6}$/i.test(String(p.value)) ? 'color' : p.action ? 'button' : 'range');
        p.affects = p.affects || 'param';
        if (p.type !== 'button') { p.raw = p.value; S[p.id] = paramValue(p, p.value); }
    });
    arr(SPEC.stages).forEach((st, i) => {
        const lt = ltName(st.lifetime);
        if (!isFn(st.run)) { problem('error', 'stage:' + (st.id || i), 'missing run(S, PL)'); return; }
        stages.push({ id: st.id || 'stage' + i, lifetime: lt, rank: LIFETIMES[lt].rank, lazy: !!st.lazy, needs: st.needs, run: st.run, valid: false, order: i });
    });
    stages.sort((a, b) => a.rank - b.rank || a.order - b.order);

    if ('IntersectionObserver' in window) {
        io = new IntersectionObserver((ents) => ents.forEach((en) => {
            const t = en.target;
            if (t._pv) t._pv.visible = en.isIntersecting;
            if (t._sec) t._sec.visible = en.isIntersecting;
        }), { rootMargin: '200px 0px' });
    }
    const root = document.getElementById('pl-root') || document.body.appendChild(el('div', ''));
    buildHeader(root);
    const secs = arr(SPEC.sections);
    secs.filter((s) => (s.position || 'top') === 'top').forEach((s) => buildSection(s, root));
    if (SPEC.graph) buildGraph(root);
    secs.filter((s) => s.position === 'afterGraph').forEach((s) => buildSection(s, root));
    buildSteps(root);
    secs.filter((s) => s.position === 'afterSteps').forEach((s) => buildSection(s, root));
    buildRefs(root);
    buildModal();
    if (!io) { previews.forEach((pv) => { pv.visible = true; }); sections.forEach((s) => { s.visible = true; }); }
    if (G) G.nodes.forEach((n) => { if (n.step && !stepById.has(n.step)) problem('warn', 'node:' + n.id, `step "${n.step}" not found`); });

    invalidate(0);
    runPending();
    sections.forEach((sc) => { if (isFn(sc.spec.mount)) { try { sc.spec.mount(sc.body, S, PL); } catch (e) { report('section:' + sc.id, e); } } });
    previews.forEach((pv) => renderPv(pv, true));
    sections.forEach((sc) => renderSection(sc, true));
    if (G) { layoutGraph(); initGraphInteraction(); window.addEventListener('resize', () => { if (G) fitGraph(); }); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G && !G.nodes.some((n) => n._dragged)) layoutGraph(); });
    requestAnimationFrame(loop);
}
PL.ready = new Promise((r) => { PL._readyResolve = r; });

// Public helpers for content code

PL.setParam = function (id, value) {   // drive a header control programmatically (same effect as the user changing it)

// ════════════════════════════════════════════════════════════
// Self test (used by scripts/validate_doc.mjs)
// ════════════════════════════════════════════════════════════
function canvasStats(cv) {
    const out = { w: cv.width, h: cv.height, blank: true, sig: 0 };
    try {
        const k = 48, off = document.createElement('canvas');
        off.width = k; off.height = k;
        const c = off.getContext('2d');
        c.drawImage(cv, 0, 0, k, k);
        const d = c.getImageData(0, 0, k, k).data;
        let lo = 255, hi = 0, sig = 0, alpha = 0;
        for (let i = 0; i < d.length; i += 4) {
            const v = d[i] * 0.3 + d[i + 1] * 0.5 + d[i + 2] * 0.2;
            lo = Math.min(lo, v); hi = Math.max(hi, v); alpha = Math.max(alpha, d[i + 3]);
            sig = (sig * 31 + d[i] * 7 + d[i + 1] * 13 + d[i + 2]) % 1000000007;
        }
        out.blank = alpha === 0 || hi - lo < 3;
        out.contrast = Math.round(hi - lo);
        out.sig = sig;
    } catch (e) { out.error = String(e.message || e); }
    return out;
}
PL.selfTest = async function (opts) {
    opts = opts || {};
    await PL.ready;
    await raf(); await raf();
    const rep = { title: SPEC.title, steps: arr(SPEC.steps).length, stages: stages.length, params: arr(SPEC.params).length, previews: [], nodes: G ? G.nodes.length : 0, edges: G ? G.edges.length : 0, sections: sections.length, issues: [] };
    stages.forEach((st) => { if (!st.valid) runStage(st); });
    previews.forEach((pv) => renderPv(pv, true));
    sections.forEach((sc) => renderSection(sc, true));
    const before = new Map();
    previews.forEach((pv) => {
        const s = canvasStats(pv.canvas);
        before.set(pv.id, s.sig);
        rep.previews.push({ id: pv.id, live: pv.live, w: s.w, h: s.h, contrast: s.contrast, blank: s.blank, error: s.error });
        if (s.blank) rep.issues.push({ level: 'error', where: 'preview:' + pv.id, message: 'canvas is blank (uniform color) after render' });
    });
    if (hasAnim()) {
        let t0 = performance.now();
        const nf = opts.frames || 20;
        for (let k = 0; k < nf; k++) advanceFrame(opts.dt || 0.05);
        rep.stageMs = +((performance.now() - t0) / nf).toFixed(2);
        stages.forEach((st) => { if (!st.valid) runStage(st); });
        t0 = performance.now();
        previews.forEach((pv) => { if (pv.live) renderPv(pv, true); });
        rep.liveRenderMs = +(performance.now() - t0).toFixed(2);
        previews.forEach((pv) => {
            if (!pv.live) return;
            const s = canvasStats(pv.canvas);
            const r = rep.previews.find((x) => x.id === pv.id);
            r.changed = s.sig !== before.get(pv.id);
            if (!r.changed) rep.issues.push({ level: 'warn', where: 'preview:' + pv.id, message: 'marked live but did not change after advancing time' });
        });
    }
    sections.forEach((sc) => {
        sc.body.querySelectorAll('canvas').forEach((cv, k) => {
            const s = canvasStats(cv);
            if (s.blank) rep.issues.push({ level: 'warn', where: `section:${sc.id}:canvas${k}`, message: 'section canvas looks blank' });
        });
    });
    if (G) {
        rep.nodePreviews = [];
        for (const n of G.nodes) {
            openNode(n.id);
            await raf();
            if (modalPv) {
                rep.nodePreviews.push(n.id);
                renderPv(modalPv, true);
                const s = canvasStats(modalPv.canvas);
                if (s.blank) rep.issues.push({ level: 'error', where: 'node:' + n.id, message: 'node detail preview is blank' });
            }
            closeNode();
        }
        G.nodes.forEach((n) => { if (!n.inputs.length && !n.outputs.length) rep.issues.push({ level: 'warn', where: 'node:' + n.id, message: 'node has no pins' }); });
    }
    problems.forEach((p) => rep.issues.push(p));
    errors.forEach((e) => rep.issues.push({ level: 'error', where: e.where, message: e.message }));
    rep.ok = !rep.issues.some((i) => i.level === 'error');
    return rep;
};
})();

<script>
// ── bxdf_common.js ──
// ════════════════════════════════════════════════════════════════════════════
// BxDF series · shared helpers — prepended to every module at build time:
//   node <skill>/scripts/build_doc.mjs bxdf_common.js bxdf_0N_xxx.lab.js -o bxdf_0N_xxx.html
//
// Conventions shared by every module (formulas, HLSL and JS must all follow these):
//   • Local shading frame: n = +Z, tangent t = +X, bitangent b = +Y; θ from +Z, φ from +X toward +Y.
//   • wi points toward the light, wo toward the viewer — both point AWAY from the surface.
//   • A BxDF is f(wi, wo) in 1/sr returning a number or linear RGB [r,g,b]. A directional light of
//     irradiance E (measured at normal incidence) reflects L = f · E · cosθi.
//   • Perceptual roughness r ∈ [0,1]; GGX α = r² (Burley 2012). Anisotropy uses αx (along t), αy (along b).
//   • Relative IOR η = η_t / η_i (transmitted side over incident side); F0 = ((η−1)/(η+1))².
//   • Linear RGB everywhere; BX.display() (exposure → ACES fit → sRGB) is applied only for display.
//   • View-space for sphere renders: x right, y up, z toward the viewer.
// ════════════════════════════════════════════════════════════════════════════
const BX = (() => {
    const PI = Math.PI, INV_PI = 1 / Math.PI;

    const isRGB = Array.isArray;

    // ── directions & local-frame trigonometry ──
    const dir = (theta, phi = 0) => [Math.sin(theta) * Math.cos(phi), Math.sin(theta) * Math.sin(phi), Math.cos(theta)];
    const cosTheta = (w) => w[2];

    float G1_Smith(float NoX, float a) { return 1.0 / (1.0 + Lambda_GGX(NoX, a)); }

    }

    float4 PS_DeferredLighting(float4 pos : SV_Position) : SV_Target {
        Surface s = LoadGBuffer(pos.xy);                 // N, F0, rough（GBuffer）
        float3 V   = normalize(ViewPos - s.P);
        float  NoV = abs(dot(s.N, V)) + 1e-5;            // 避免 0 和负值 → NaN
        float  r   = max(SpecularAA(s.rough, s.N), 0.045);
        float  a   = r * r;
        float2 AB  = DFGLut.SampleLevel(samLinearClamp, float2(NoV, r), 0);
        float  Ess = AB.x + AB.y;                         // = E(μo, r)
        float3 energyComp = 1.0 + s.F0 * (1.0 / Ess - 1.0);   // Turquin（Filament 做法）

        // ① 解析光源：Cook-Torrance × 能量补偿
        float3 Lo = 0.0;
        for (uint i = 0; i < LightCount; ++i) {
            float3 L = Lights[i].dir, H = normalize(L + V);
            float  NoL = saturate(dot(s.N, L));
            if (NoL <= 0.0) continue;
            float  NoH = saturate(dot(s.N, H)), VoH = saturate(dot(V, H));
            float3 f = D_GGX(NoH, a) * V_SmithGGXCorrelated(NoV, NoL, a) * F_Schlick(s.F0, VoH);
            Lo += f * energyComp * Lights[i].E * NoL;
        }
        // ② IBL：split-sum = 预滤波环境 × DFG
        float3 R   = reflect(-V, s.N);
        float3 pre = PrefilteredEnv.SampleLevel(samLinear, R, r * (MIP_COUNT - 1)).rgb;
        Lo += pre * (s.F0 * AB.x + AB.y) * energyComp;
        return float4(Lo, 1.0);
    }`;

// ── small drawing helpers for this module ──
function mfScatter(canvas, S, key) {
    const { ctx, w, h } = PL.draw.ctx(canvas);
    const R = Math.min(w, h - 26) / 2 - 6, cx = w / 2, cy = 26 + (h - 26) / 2, d = S[key], st = S[key + 'St'], n = d.length / 4;
    ctx.strokeStyle = '#1d2329';
    for (const c of [0.5, Math.cos(60 / MF_DEG)]) { ctx.beginPath(); ctx.arc(cx, cy, R * Math.sqrt(1 - c), 0, 2 * Math.PI); ctx.stroke(); }
    ctx.strokeStyle = '#3a4148'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
    const proj = (x, y, z) => { const r = Math.sqrt(Math.max(0, 1 - Math.abs(z))), s = Math.hypot(x, y) || 1; return [cx + x / s * r * R, cy - y / s * r * R]; };
    for (let k = 0; k < n; k++) {
        const x = d[4 * k], y = d[4 * k + 1], z = d[4 * k + 2], wt = d[4 * k + 3];
        if (Number.isNaN(x)) continue;
        const [px, py] = proj(x, y, z);
        if (z <= 0) {          // below the horizon: mirrored to the upper hemisphere for display
            ctx.strokeStyle = '#e06c75'; ctx.lineWidth = 1; ctx.beginPath();
            ctx.moveTo(px - 2.5, py - 2.5); ctx.lineTo(px + 2.5, py + 2.5); ctx.moveTo(px + 2.5, py - 2.5); ctx.lineTo(px - 2.5, py + 2.5); ctx.stroke();
            continue;
        }
        const rel = wt / (st.mean || 1);
        ctx.fillStyle = rel > 2 ? '#e0a060' : '#56b6c2';
        ctx.beginPath(); ctx.arc(px, py, Math.min(6, 0.8 + 1.4 * Math.sqrt(rel)), 0, 2 * Math.PI); ctx.fill();
    }
    const wo = S.scWo, [ox, oy] = proj(wo[0], wo[1], wo[2]);
    ctx.fillStyle = '#e8c25a'; ctx.beginPath(); ctx.arc(ox, oy, 3.5, 0, 2 * Math.PI); ctx.fill();
    ctx.font = '10px Consolas, monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = '#9aa';
    ctx.fillText(`浪费 ${(st.bad * 100).toFixed(1)}%（背面 h ${(st.back * 100).toFixed(1)}%）`, 4, 2);
    ctx.fillText(`E ≈ ${st.mean.toFixed(3)}   σ/μ = ${st.rel.toFixed(2)}`, 4, 14);
}

            id: 'noise', lifetime: 'param', lazy: true, run(S) {
                const res = MF_IBL_RES, NB = 10, n3 = res * res * 3;
                const A = PL.buf(S, 'nzN', n3), B = PL.buf(S, 'nzV', n3), A2 = PL.buf(S, 'nzN2', n3), B2 = PL.buf(S, 'nzV2', n3);

            id: 'energyLUT', lifetime: 'param', run(S) {

                const emsOf = (rr) => {

                    for (let i = 0; i < 64; i++) { const mu = (i + 0.5) / 64; I += (1 - MF.lut2(S.Elut, N, mu, rr)) * mu; }

                    for (let k = 0; k < M; k++) { const Eo = MF.lut2(S.Elut, N, (k + 0.5) / M, rr); ems[k] = 1 - Ea > 1e-5 ? (1 - Eo) / (1 - Ea) * I : 0; }
                    return { Ea, ems, Fms: S.Favg.map((f) => f * f * Ea / (1 - f * (1 - Ea))) };
                };
                const cur = emsOf(r), Ea = cur.Ea, Fms = cur.Fms;
                S.EavgCur = Ea; S.Fms = Fms;
                const ems = PL.buf(S, 'msE', M), kc = PL.buf(S, 'msKC', M), tq = PL.buf(S, 'msTQ', M);
                const kcC = PL.buf(S, 'msKCc', M * 3), tqC = PL.buf(S, 'msTQc', M * 3);
                for (let k = 0; k < M; k++) {
                    const mu = (k + 0.5) / M, Eo = MF.lut2(S.Elut, N, mu, r);
                    ems[k] = cur.ems[k];
                    kc[k] = S.EssCur[k] + ems[k];
                    tq[k] = S.EssCur[k] / Eo;                               // Turquin with F0 = 1
                    for (let c = 0; c < 3; c++) {
                        const ss = S.EFcur[3 * k + c];
                        kcC[3 * k + c] = ss + Fms[c] * ems[k];
                        tqC[3 * k + c] = ss * (1 + S.F0[c] * (1 / Eo - 1));
                    }
                }
                // fixed-roughness strip with the current material: single scattering vs + Kulla-Conty
                S.msStrip = [0.25, 0.5, 0.75, 1.0].map((rr) => {
                    const a = BX.alpha(rr), o = emsOf(rr), ss = new Float32Array(M * 3), kk = new Float32Array(M * 3);
                    for (let k = 0; k < M; k++) {
                        const e = MF.albedo((k + 0.5) / M, a, 128, S.Ftab);
                        for (let c = 0; c < 3; c++) { ss[3 * k + c] = e[c]; kk[3 * k + c] = e[c] + o.Fms[c] * o.ems[k]; }
                    }
                    return { ss, kc: kk };
                });
            },
        },
    ],

                    float3 sum = 0.0;
                    for (uint i = 0; i < N; ++i) {
                        float2 u = Hammersley(i, N);
                        float3 H = useVNDF ? SampleGGXVNDF(V, a, a, u) : SampleGGXNDF(a, u);
                        float  VoH = dot(V, H);
                        if (VoH <= 0.0) continue;                         // NDF：背面微表面，样本作废
                        float3 L = 2.0 * VoH * H - V;
                        if (L.z <= 0.0) continue;                         // 反射到地平线下，样本作废
                        float  G2 = G2_HeightCorrelated(V.z, L.z, a);
                        float  w  = useVNDF ? G2 / G1_Smith(V.z, a)            // ≤ 1
                                            : G2 * VoH / (V.z * H.z);          // 无界
                        sum += SampleEnv(L) * F_Schlick(F0, VoH) * w;
