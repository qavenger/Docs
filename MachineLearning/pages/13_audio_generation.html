<script>
/* Pipeline Lab runtime — builds an interactive step-by-step pipeline explainer from a spec.
 * Usage (content file):  PipelineLab.mount({ title, params, stages, steps, graph, ... })
 * Full API: references/framework-api.md of the pipeline-explainer skill.
 * Exposes window.PipelineLab (alias window.PL). No external dependencies. */
(function () {
'use strict';

const PL = {};

// ════════════════════════════════════════════════════════════
// Small utilities
// ════════════════════════════════════════════════════════════
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

PL.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
    reflect: (d, n) => { const k = 2 * (d[0] * n[0] + d[1] * n[1] + d[2] * n[2]); return [d[0] - k * n[0], d[1] - k * n[1], d[2] - k * n[2]]; },

// ════════════════════════════════════════════════════════════
// FFT (radix-2, in place). Forward uses e^{-i}, inverse e^{+i} with 1/n per 1D pass.
// ════════════════════════════════════════════════════════════
function fft1d(re, im, inverse) {

    const [tr, ti] = scratch(H);

        fft1d(tr, ti, inverse);
        for (let y = 0; y < H; y++) { re[y * W + x] = tr[y]; im[y * W + x] = ti[y]; }

    fft1d,
    rows: fftRows,
    cols: fftCols,
    fft2d(re, im, W, H, inverse) { H = H || W; fftRows(re, im, W, H, inverse); fftCols(re, im, W, H, inverse); },
    freq: (i, n) => (i < n / 2 ? i : i - n),                      // bin index → signed frequency

};

// ════════════════════════════════════════════════════════════
// Colormaps — f(t ∈ [0,1], out) → out = [r,g,b] in 0..255
// ════════════════════════════════════════════════════════════
function stops(list) {
    const c = list.map((hx) => [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)]);
    const n = c.length - 1;

// ── 随机数：mulberry32，与页面里 JS 的 LM.rng / PL.rng 产生逐位相同的序列 ──

inline Rng makeRng(uint32_t seed) { Rng r; r.a = seed ? seed : 1; return r; }

// 返回 [0, 1) 上的均匀随机数
inline double uniform(Rng& r) {

    uint32_t t = (r.a ^ (r.a >> 15)) * (1u | r.a);

    return (float)(std::sqrt(-2.0 * std::log(u1)) * std::cos(6.283185307179586 * u2));
}

// [0, n) 上的随机整数
inline int randint(Rng& r, int n) { return (int)(uniform(r) * n); }

// ── 二维张量 ──
struct Tensor {

    float& at(int i, int j) { return v[(size_t)i * cols + j]; }

}

inline Tensor full(int rows, int cols, float x) {

    std::fill(t.v.begin(), t.v.end(), x);
    return t;
}

// 每个元素独立地 ~ N(0, std²)
inline Tensor randn(int rows, int cols, float std, Rng& r) {

    for (float& x : t.v) x = std * randn(r);
    return t;
}

inline Tensor fromVector(int rows, int cols, const std::vector<float>& data) {
    Tensor t = zeros(rows, cols);
    for (int i = 0; i < rows * cols; i++) t.v[i] = data[i];

// ── 不需要梯度的小工具（采样、评估用） ──
// x ← softmax(x / temperature)，原地；减去最大值防止 exp 溢出
inline void softmaxInPlace(std::vector<float>& x, float temperature) {
    float m = x[0];
    for (float a : x) m = std::max(m, a);
    double s = 0;
    for (float& a : x) { a = std::exp((a - m) / temperature); s += a; }
    for (float& a : x) a = (float)(a / s);

    return (int)p.size() - 1;
}

    for (int i = 0; i < n; i++) p[i] = i;
    for (int i = n - 1; i > 0; i--) { int j = (int)(uniform(r) * (i + 1)); std::swap(p[i], p[j]); }
    return p;
}

// minml_autograd.h — 极简 C++ 机器学习库 · 第 2 部分：自动微分（与页面 JS 的 LM.AG 一一对应）
// 思路：每个算子算出前向结果，同时把「怎样把输出的梯度传回输入」写成一个闭包，压进全局 tape；
// backward(loss) 从 loss 出发逆序执行这些闭包（链式法则），每个参数的 grad 里就累加出了 ∂loss/∂参数。
#pragma once
#include "minml_core.h"

// 计算图里的一个节点：前向值 + 损失对它的梯度（同形状）+ 反向传播闭包
struct Node {
    Tensor val, grad;
    bool requiresGrad = false;
    std::function<void(Node&)> backFn;                           // 由创建它的算子填写
};

// 节点的句柄（共享所有权）：Var x;  x->val 是数值，x->grad 是梯度
struct Var {
    std::shared_ptr<Node> n;
    Node* operator->() const { return n.get(); }
};

// 全局 tape：按前向顺序记录所有需要反向的节点
struct Tape { std::vector<Var> nodes; bool enabled = true; };

inline Tape& tape() { static Tape t; return t; }

inline Var makeVar(Tensor val) { Var x; x.n = std::make_shared<Node>(); x->val = std::move(val); return x; }

// 可训练参数（requiresGrad = true，梯度会累加进 ->grad）
inline Var param(Tensor init) { Var p = makeVar(std::move(init)); p->requiresGrad = true; return p; }

// 常量输入（数据、标签），不求梯度
inline Var constant(Tensor t) { return makeVar(std::move(t)); }

// 取梯度缓冲区（第一次用时分配成全 0）
inline Tensor& gradOf(const Var& x) {
    if ((int)x->grad.v.size() != x->val.size()) x->grad = zeros(x->val.rows, x->val.cols);
    return x->grad;
}

// 生成算子的输出节点：只要有一个输入需要梯度、且没在 NoGrad 里，就记进 tape
inline Var record(Tensor val, std::vector<Var> inputs, std::function<void(Node&)> back) {
    Var out = makeVar(std::move(val));
    bool need = false;
    for (const Var& x : inputs) need = need || x->requiresGrad;
    if (need && tape().enabled) { out->requiresGrad = true; out->backFn = back; tape().nodes.push_back(out); }
    return out;
}

// 反向传播：∂loss/∂loss = 1，然后逆序执行 tape（loss 必须是 1×1）
inline void backward(const Var& loss) {
    Tensor& g = gradOf(loss);
    std::fill(g.v.begin(), g.v.end(), 0.f);
    g.v[0] = 1.f;
    for (int i = (int)tape().nodes.size() - 1; i >= 0; --i) {
        Node& nd = *tape().nodes[i].n;
        if (!nd.grad.v.empty()) nd.backFn(nd);
    }
    tape().nodes.clear();
}

// 丢弃 tape（只做前向、不反向时调用，否则 tape 会一直变长）
inline void clearTape() { tape().nodes.clear(); }

// RAII：作用域内不记录 tape —— 推理 / 评估时用（相当于 PyTorch 的 torch.no_grad()）
struct NoGrad {
    bool prev = true;
    NoGrad() { prev = tape().enabled; tape().enabled = false; }
    ~NoGrad() { tape().enabled = prev; }
};

// ═══════════════════════════ 矩阵乘与线性层 ═══════════════════════════
// C = A·B    A[n×k]  B[k×m]  →  C[n×m]
inline Var matmul(const Var& A, const Var& B) {
    const Tensor &a = A->val, &b = B->val;
    int n = a.rows, k = a.cols, m = b.cols;
    Tensor c = zeros(n, m);
    for (int i = 0; i < n; i++)
        for (int p = 0; p < k; p++) {
            float av = a.v[i * k + p];
            if (av == 0) continue;
            for (int j = 0; j < m; j++) c.v[i * m + j] += av * b.v[p * m + j];
        }
    return record(std::move(c), {A, B}, [A, B](Node& o) {
        const Tensor &a = A->val, &b = B->val;
        int n = a.rows, k = a.cols, m = b.cols;
        if (A->requiresGrad) {                                   // dA = dC · Bᵀ
            Tensor& ga = gradOf(A);
            for (int i = 0; i < n; i++)
                for (int p = 0; p < k; p++) {
                    float s = 0;
                    for (int j = 0; j < m; j++) s += o.grad.v[i * m + j] * b.v[p * m + j];
                    ga.v[i * k + p] += s;
                }
        }
        if (B->requiresGrad) {                                   // dB = Aᵀ · dC
            Tensor& gb = gradOf(B);
            for (int i = 0; i < n; i++)
                for (int p = 0; p < k; p++) {
                    float av = a.v[i * k + p];
                    if (av == 0) continue;
                    for (int j = 0; j < m; j++) gb.v[p * m + j] += av * o.grad.v[i * m + j];
                }
        }
    });
}

// C = A·Bᵀ    A[n×k]  B[m×k]  →  C[n×m]（权重共享的 LM head、CLIP 的相似度矩阵）
inline Var matmulBT(const Var& A, const Var& B) {
    const Tensor &a = A->val, &b = B->val;
    int n = a.rows, k = a.cols, m = b.rows;
    Tensor c = zeros(n, m);
    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++) {
            float s = 0;
            for (int p = 0; p < k; p++) s += a.v[i * k + p] * b.v[j * k + p];
            c.v[i * m + j] = s;
        }
    return record(std::move(c), {A, B}, [A, B](Node& o) {
        const Tensor &a = A->val, &b = B->val;
        int n = a.rows, k = a.cols, m = b.rows;
        for (int i = 0; i < n; i++)
            for (int j = 0; j < m; j++) {
                float g = o.grad.v[i * m + j];
                if (g == 0) continue;
                if (A->requiresGrad) { Tensor& ga = gradOf(A); for (int p = 0; p < k; p++) ga.v[i * k + p] += g * b.v[j * k + p]; }
                if (B->requiresGrad) { Tensor& gb = gradOf(B); for (int p = 0; p < k; p++) gb.v[j * k + p] += g * a.v[i * k + p]; }
            }
    });
}

// Y = X + b：b 是一行 [1×m]，加到 X 的每一行上（偏置）
inline Var addRow(const Var& X, const Var& b) {
    Tensor y = X->val;
    int n = y.rows, m = y.cols;
    for (int i = 0; i < n; i++) for (int j = 0; j < m; j++) y.v[i * m + j] += b->val.v[j];
    return record(std::move(y), {X, b}, [X, b](Node& o) {
        int n = o.val.rows, m = o.val.cols;
        if (X->requiresGrad) { Tensor& gx = gradOf(X); for (int i = 0; i < n * m; i++) gx.v[i] += o.grad.v[i]; }
        if (b->requiresGrad) { Tensor& gb = gradOf(b); for (int i = 0; i < n; i++) for (int j = 0; j < m; j++) gb.v[j] += o.grad.v[i * m + j]; }
    });
}

// 线性层 Y = X·W + b    X[n×in]  W[in×out]  b[1×out]
inline Var linear(const Var& X, const Var& W, const Var& b) { return addRow(matmul(X, W), b); }

// ═══════════════════════════ 逐元素运算 ═══════════════════════════
// 逐元素加 / 减 / 乘（形状相同）
inline Var add(const Var& A, const Var& B) {
    Tensor y = A->val;
    for (int i = 0; i < y.size(); i++) y.v[i] += B->val.v[i];
    return record(std::move(y), {A, B}, [A, B](Node& o) {
        for (int i = 0; i < o.val.size(); i++) {
            if (A->requiresGrad) gradOf(A).v[i] += o.grad.v[i];
            if (B->requiresGrad) gradOf(B).v[i] += o.grad.v[i];
        }
    });
}

inline Var sub(const Var& A, const Var& B) {
    Tensor y = A->val;
    for (int i = 0; i < y.size(); i++) y.v[i] -= B->val.v[i];
    return record(std::move(y), {A, B}, [A, B](Node& o) {
        for (int i = 0; i < o.val.size(); i++) {
            if (A->requiresGrad) gradOf(A).v[i] += o.grad.v[i];
            if (B->requiresGrad) gradOf(B).v[i] -= o.grad.v[i];
        }
    });
}

inline Var mul(const Var& A, const Var& B) {
    Tensor y = A->val;
    for (int i = 0; i < y.size(); i++) y.v[i] *= B->val.v[i];
    return record(std::move(y), {A, B}, [A, B](Node& o) {
        for (int i = 0; i < o.val.size(); i++) {
            if (A->requiresGrad) gradOf(A).v[i] += o.grad.v[i] * B->val.v[i];   // ∂(ab)/∂a = b
            if (B->requiresGrad) gradOf(B).v[i] += o.grad.v[i] * A->val.v[i];
        }
    });
}

// 逐元素一元运算：激活函数等。actF = 前向 y = f(x)，actD = 导数 dy/dx（可以用 x，也可以用已算好的 y）
enum Act { ACT_RELU, ACT_TANH, ACT_SIGMOID, ACT_GELU, ACT_SILU, ACT_EXP, ACT_LOG, ACT_SOFTPLUS, ACT_LOGSIGMOID, ACT_SQUARE };

inline float actF(Act a, float x) {
    const float k = 0.7978845608f;                                // √(2/π)，GELU 的 tanh 近似（GPT-2 同款）
    switch (a) {
        case ACT_RELU: return x > 0 ? x : 0.f;
        case ACT_TANH: return std::tanh(x);
        case ACT_SIGMOID: return 1.f / (1.f + std::exp(-x));
        case ACT_GELU: return 0.5f * x * (1 + std::tanh(k * (x + 0.044715f * x * x * x)));
        case ACT_SILU: return x / (1.f + std::exp(-x));
        case ACT_EXP: return std::exp(x);
        case ACT_LOG: return std::log(x);
        case ACT_SOFTPLUS: return x > 20 ? x : x < -20 ? std::exp(x) : std::log1p(std::exp(x));
        case ACT_LOGSIGMOID: return x >= 0 ? -std::log1p(std::exp(-x)) : x - std::log1p(std::exp(x));   // log σ(x)，数值稳定
        case ACT_SQUARE: return x * x;
    }
    return x;
}

inline float actD(Act a, float x, float y) {
    const float k = 0.7978845608f;
    switch (a) {
        case ACT_RELU: return x > 0 ? 1.f : 0.f;
        case ACT_TANH: return 1 - y * y;
        case ACT_SIGMOID: return y * (1 - y);
        case ACT_GELU: { float t = std::tanh(k * (x + 0.044715f * x * x * x)); return 0.5f * (1 + t) + 0.5f * x * (1 - t * t) * k * (1 + 3 * 0.044715f * x * x); }
        case ACT_SILU: { float s = 1.f / (1.f + std::exp(-x)); return s * (1 + x * (1 - s)); }
        case ACT_EXP: return y;
        case ACT_LOG: return 1.f / x;
        case ACT_SOFTPLUS: return 1.f / (1.f + std::exp(-x));
        case ACT_LOGSIGMOID: return 1.f / (1.f + std::exp(x));
        case ACT_SQUARE: return 2 * x;
    }
    return 1.f;
}

inline Var activation(const Var& A, Act act) {
    Tensor y = A->val;
    for (float& x : y.v) x = actF(act, x);
    return record(std::move(y), {A}, [A, act](Node& o) {
        Tensor& ga = gradOf(A);
        for (int i = 0; i < o.val.size(); i++) ga.v[i] += o.grad.v[i] * actD(act, A->val.v[i], o.val.v[i]);
    });
}

inline Var relu(const Var& A) { return activation(A, ACT_RELU); }
inline Var tanhAct(const Var& A) { return activation(A, ACT_TANH); }
inline Var sigmoid(const Var& A) { return activation(A, ACT_SIGMOID); }
inline Var gelu(const Var& A) { return activation(A, ACT_GELU); }
inline Var silu(const Var& A) { return activation(A, ACT_SILU); }
inline Var expAct(const Var& A) { return activation(A, ACT_EXP); }
inline Var logAct(const Var& A) { return activation(A, ACT_LOG); }
inline Var softplus(const Var& A) { return activation(A, ACT_SOFTPLUS); }
inline Var logSigmoid(const Var& A) { return activation(A, ACT_LOGSIGMOID); }
inline Var square(const Var& A) { return activation(A, ACT_SQUARE); }

// Y = s·X（常数缩放）
inline Var scale(const Var& A, float s) {
    Tensor y = A->val;
    for (float& x : y.v) x *= s;
    return record(std::move(y), {A}, [A, s](Node& o) { Tensor& ga = gradOf(A); for (int i = 0; i < o.val.size(); i++) ga.v[i] += o.grad.v[i] * s; });
}

// Y = X + c（常数）
inline Var addConst(const Var& A, float c) {
    Tensor y = A->val;
    for (float& x : y.v) x += c;
    return record(std::move(y), {A}, [A](Node& o) { Tensor& ga = gradOf(A); for (int i = 0; i < o.val.size(); i++) ga.v[i] += o.grad.v[i]; });
}

// ═══════════════════════════ 归约与形状 ═══════════════════════════
// 所有元素的平均 → 1×1
inline Var meanAll(const Var& A) {
    Tensor y = zeros(1, 1);
    double s = 0;
    for (float x : A->val.v) s += x;
    y.v[0] = (float)(s / A->val.size());
    return record(std::move(y), {A}, [A](Node& o) { Tensor& ga = gradOf(A); float g = o.grad.v[0] / A->val.size(); for (float& x : ga.v) x += g; });
}

// 所有元素的和 → 1×1
inline Var sumAll(const Var& A) {
    Tensor y = zeros(1, 1);
    double s = 0;
    for (float x : A->val.v) s += x;
    y.v[0] = (float)s;
    return record(std::move(y), {A}, [A](Node& o) { Tensor& ga = gradOf(A); for (float& x : ga.v) x += o.grad.v[0]; });
}

// 转置 [n×m] → [m×n]
inline Var transpose(const Var& A) {
    int n = A->val.rows, m = A->val.cols;
    Tensor y = zeros(m, n);
    for (int i = 0; i < n; i++) for (int j = 0; j < m; j++) y.v[j * n + i] = A->val.v[i * m + j];
    return record(std::move(y), {A}, [A, n, m](Node& o) { Tensor& ga = gradOf(A); for (int i = 0; i < n; i++) for (int j = 0; j < m; j++) ga.v[i * m + j] += o.grad.v[j * n + i]; });
}

// 取行：Y[i] = X[idx[i]]（embedding 查表就是它）；反向 = 按行累加回去
inline Var gatherRows(const Var& X, const std::vector<int>& idx) {
    int n = (int)idx.size(), d = X->val.cols;
    Tensor y = zeros(n, d);
    for (int i = 0; i < n; i++) for (int j = 0; j < d; j++) y.v[i * d + j] = X->val.v[idx[i] * d + j];
    return record(std::move(y), {X}, [X, idx, n, d](Node& o) { Tensor& gx = gradOf(X); for (int i = 0; i < n; i++) for (int j = 0; j < d; j++) gx.v[idx[i] * d + j] += o.grad.v[i * d + j]; });
}

inline Var embedding(const std::vector<int>& ids, const Var& E) { return gatherRows(E, ids); }

// 按行拼接 [A; B]（列数相同）
inline Var concatRows(const Var& A, const Var& B) {
    Tensor y = zeros(A->val.rows + B->val.rows, A->val.cols);
    std::copy(A->val.v.begin(), A->val.v.end(), y.v.begin());
    std::copy(B->val.v.begin(), B->val.v.end(), y.v.begin() + A->val.size());
    return record(std::move(y), {A, B}, [A, B](Node& o) {
        int na = A->val.size();
        if (A->requiresGrad) { Tensor& ga = gradOf(A); for (int i = 0; i < na; i++) ga.v[i] += o.grad.v[i]; }
        if (B->requiresGrad) { Tensor& gb = gradOf(B); for (int i = 0; i < B->val.size(); i++) gb.v[i] += o.grad.v[na + i]; }
    });
}

// 按列拼接 [A | B]（行数相同）：U-Net 跳连 = 特征图的通道拼接，因为一张图就是一行
inline Var concatCols(const Var& A, const Var& B) {
    int n = A->val.rows, ca = A->val.cols, cb = B->val.cols;
    Tensor y = zeros(n, ca + cb);
    for (int i = 0; i < n; i++) {
        for (int j = 0; j < ca; j++) y.v[i * (ca + cb) + j] = A->val.v[i * ca + j];
        for (int j = 0; j < cb; j++) y.v[i * (ca + cb) + ca + j] = B->val.v[i * cb + j];
    }
    return record(std::move(y), {A, B}, [A, B, n, ca, cb](Node& o) {
        for (int i = 0; i < n; i++) {
            if (A->requiresGrad) for (int j = 0; j < ca; j++) gradOf(A).v[i * ca + j] += o.grad.v[i * (ca + cb) + j];
            if (B->requiresGrad) for (int j = 0; j < cb; j++) gradOf(B).v[i * cb + j] += o.grad.v[i * (ca + cb) + ca + j];
        }
    });
}

// 取第 [c0, c1) 列（把一个线性层的输出拆成 μ / logσ²、GRU 的几个门…）
inline Var sliceCols(const Var& A, int c0, int c1) {
    int n = A->val.rows, c = A->val.cols, m = c1 - c0;
    Tensor y = zeros(n, m);
    for (int i = 0; i < n; i++) for (int j = 0; j < m; j++) y.v[i * m + j] = A->val.v[i * c + c0 + j];
    return record(std::move(y), {A}, [A, n, c, m, c0](Node& o) { Tensor& ga = gradOf(A); for (int i = 0; i < n; i++) for (int j = 0; j < m; j++) ga.v[i * c + c0 + j] += o.grad.v[i * m + j]; });
}

// 每 k 行取平均：[(n·k) × d] → [n × d]（把一张图的所有 patch token 平均成一个向量）
inline Var meanRows(const Var& X, int k) {
    int n = X->val.rows / k, d = X->val.cols;
    Tensor y = zeros(n, d);
    for (int i = 0; i < n; i++) for (int r = 0; r < k; r++) for (int j = 0; j < d; j++) y.v[i * d + j] += X->val.v[(i * k + r) * d + j] / k;
    return record(std::move(y), {X}, [X, n, k, d](Node& o) { Tensor& gx = gradOf(X); for (int i = 0; i < n; i++) for (int r = 0; r < k; r++) for (int j = 0; j < d; j++) gx.v[(i * k + r) * d + j] += o.grad.v[i * d + j] / k; });
}

// ═══════════════════════════ 归一化 ═══════════════════════════
// LayerNorm（对每一行）：y = γ·(x − μ)/√(σ² + ε) + β
inline Var layerNorm(const Var& X, const Var& gamma, const Var& beta, float eps = 1e-5f) {
    int n = X->val.rows, d = X->val.cols;
    Tensor y = zeros(n, d), xhat = zeros(n, d);
    std::vector<float> rstd = floats(n);
    for (int i = 0; i < n; i++) {
        const float* x = &X->val.v[i * d];
        float mu = 0; for (int j = 0; j < d; j++) mu += x[j]; mu /= d;
        float var = 0; for (int j = 0; j < d; j++) var += (x[j] - mu) * (x[j] - mu); var /= d;
        rstd[i] = 1.f / std::sqrt(var + eps);
        for (int j = 0; j < d; j++) { xhat.v[i * d + j] = (x[j] - mu) * rstd[i]; y.v[i * d + j] = xhat.v[i * d + j] * gamma->val.v[j] + beta->val.v[j]; }
    }
    return record(std::move(y), {X, gamma, beta}, [X, gamma, beta, xhat, rstd, n, d](Node& o) {
        for (int i = 0; i < n; i++) {
            float s1 = 0, s2 = 0;
            for (int j = 0; j < d; j++) {
                float g = o.grad.v[i * d + j], dh = g * gamma->val.v[j];
                s1 += dh; s2 += dh * xhat.v[i * d + j];
                if (gamma->requiresGrad) gradOf(gamma).v[j] += g * xhat.v[i * d + j];
                if (beta->requiresGrad) gradOf(beta).v[j] += g;
            }
            if (X->requiresGrad) {
                s1 /= d; s2 /= d;
                Tensor& gx = gradOf(X);
                for (int j = 0; j < d; j++) gx.v[i * d + j] += rstd[i] * (o.grad.v[i * d + j] * gamma->val.v[j] - s1 - xhat.v[i * d + j] * s2);
            }
        }
    });
}

// 每一行除以自己的 L2 范数（CLIP 的嵌入）
inline Var l2Normalize(const Var& X) {
    int n = X->val.rows, d = X->val.cols;
    Tensor y = zeros(n, d);
    std::vector<float> inv = floats(n);
    for (int i = 0; i < n; i++) {
        double s = 0; for (int j = 0; j < d; j++) s += X->val.v[i * d + j] * X->val.v[i * d + j];
        inv[i] = (float)(1.0 / std::sqrt(s + 1e-12));
        for (int j = 0; j < d; j++) y.v[i * d + j] = X->val.v[i * d + j] * inv[i];
    }
    return record(std::move(y), {X}, [X, inv, n, d](Node& o) {
        Tensor& gx = gradOf(X);
        for (int i = 0; i < n; i++) {
            float dot = 0; for (int j = 0; j < d; j++) dot += o.grad.v[i * d + j] * o.val.v[i * d + j];
            for (int j = 0; j < d; j++) gx.v[i * d + j] += inv[i] * (o.grad.v[i * d + j] - o.val.v[i * d + j] * dot);
        }
    });
}

// ═══════════════════════════ 注意力 ═══════════════════════════
// 多头缩放点积注意力。Q/K/V: [B·T × D]，H 个头，每头 dh = D/H；causal = true 时位置 i 只看 j ≤ i。
// probsOut（可选）收集注意力权重：下标 ((b·H + h)·T + i)·T + j
inline Var attention(const Var& Q, const Var& K, const Var& Vv, int B, int T, int H, bool causal, std::vector<float>* probsOut = nullptr) {
    int D = Q->val.cols, dh = D / H;
    float sc = 1.f / std::sqrt((float)dh);
    Tensor out = zeros(B * T, D);
    std::vector<float> P = floats(B * H * T * T), row = floats(T);
    for (int b = 0; b < B; b++)
        for (int h = 0; h < H; h++)
            for (int i = 0; i < T; i++) {
                int jmax = causal ? i : T - 1;
                const float* q = &Q->val.v[(b * T + i) * D + h * dh];
                float m = -1e30f;
                for (int j = 0; j <= jmax; j++) {
                    const float* k = &K->val.v[(b * T + j) * D + h * dh];
                    float s = 0; for (int c = 0; c < dh; c++) s += q[c] * k[c];
                    row[j] = s * sc; m = std::max(m, row[j]);
                }
                float z = 0; for (int j = 0; j <= jmax; j++) { row[j] = std::exp(row[j] - m); z += row[j]; }
                float* o = &out.v[(b * T + i) * D + h * dh];
                for (int j = 0; j <= jmax; j++) {
                    float p = row[j] / z;
                    P[((size_t)(b * H + h) * T + i) * T + j] = p;
                    const float* v = &Vv->val.v[(b * T + j) * D + h * dh];
                    for (int c = 0; c < dh; c++) o[c] += p * v[c];
                }
            }
    if (probsOut) *probsOut = P;
    return record(std::move(out), {Q, K, Vv}, [Q, K, Vv, P, B, T, H, causal, dh, sc](Node& o) {
        int D = H * dh;
        std::vector<float> dP = floats(T);
        for (int b = 0; b < B; b++)
            for (int h = 0; h < H; h++)
                for (int i = 0; i < T; i++) {
                    int jmax = causal ? i : T - 1;
                    const float* g = &o.grad.v[(b * T + i) * D + h * dh];
                    const float* pr = &P[((size_t)(b * H + h) * T + i) * T];
                    float dot = 0;
                    for (int j = 0; j <= jmax; j++) {                // dV += pᵢⱼ · dO；dP = dO · V
                        const float* v = &Vv->val.v[(b * T + j) * D + h * dh];
                        float s = 0;
                        for (int c = 0; c < dh; c++) { s += g[c] * v[c]; if (Vv->requiresGrad) gradOf(Vv).v[(b * T + j) * D + h * dh + c] += pr[j] * g[c]; }
                        dP[j] = s; dot += pr[j] * s;
                    }
                    for (int j = 0; j <= jmax; j++) {                // softmax 反向：dS = P ⊙ (dP − Σ P·dP)
                        float ds = pr[j] * (dP[j] - dot) * sc;
                        if (ds == 0) continue;
                        for (int c = 0; c < dh; c++) {
                            if (Q->requiresGrad) gradOf(Q).v[(b * T + i) * D + h * dh + c] += ds * K->val.v[(b * T + j) * D + h * dh + c];
                            if (K->requiresGrad) gradOf(K).v[(b * T + j) * D + h * dh + c] += ds * Q->val.v[(b * T + i) * D + h * dh + c];
                        }
                    }
                }
    });
}

// ═══════════════════════════ 损失函数 ═══════════════════════════
// 交叉熵（自带 softmax）。logits[n×V]，targets[n]（−1 = 忽略该行）。weights（可空）= 每行权重，可为负（策略梯度的 advantage）；
// denom ≤ 0 时自动取有效行数（或 Σ|w|）。返回 1×1。rowLossOut（可选）收集每行的 −log p。
inline Var crossEntropy(const Var& L, const std::vector<int>& targets, const std::vector<float>* weights = nullptr, float denom = 0.f, std::vector<float>* rowLossOut = nullptr) {
    int n = L->val.rows, V = L->val.cols;
    Tensor P = zeros(n, V);
    double tot = 0, cnt = 0;
    if (rowLossOut) rowLossOut->assign(n, NAN);
    for (int i = 0; i < n; i++) {
        const float* z = &L->val.v[i * V];
        float m = z[0]; for (int j = 1; j < V; j++) m = std::max(m, z[j]);
        double s = 0; for (int j = 0; j < V; j++) { P.v[i * V + j] = std::exp(z[j] - m); s += P.v[i * V + j]; }
        for (int j = 0; j < V; j++) P.v[i * V + j] = (float)(P.v[i * V + j] / s);
        int t = targets[i];
        if (t < 0) continue;
        double li = -(z[t] - m - std::log(s)), w = weights ? (*weights)[i] : 1.0;
        if (rowLossOut) (*rowLossOut)[i] = (float)li;
        tot += w * li; cnt += weights ? std::fabs(w) : 1.0;
    }
    float den = denom > 0 ? denom : (float)std::max(cnt, 1.0);
    Tensor y = zeros(1, 1); y.v[0] = (float)(tot / den);
    std::vector<float> w = weights ? *weights : std::vector<float>();   // 复制一份：反向时调用方的数组可能已经不在了
    return record(std::move(y), {L}, [L, P, targets, w, den, n, V](Node& o) {
        Tensor& gl = gradOf(L);
        for (int i = 0; i < n; i++) {
            int t = targets[i];
            if (t < 0) continue;
            float k = o.grad.v[0] * (w.empty() ? 1.f : w[i]) / den;
            for (int j = 0; j < V; j++) gl.v[i * V + j] += k * P.v[i * V + j];   // ∂/∂z = (softmax − onehot) · w / denom
            gl.v[i * V + t] -= k;
        }
    });
}

// 均方误差 mean((A − B)²)
inline Var mse(const Var& A, const Var& B) {
    Tensor y = zeros(1, 1);
    double s = 0;
    for (int i = 0; i < A->val.size(); i++) s += (A->val.v[i] - B->val.v[i]) * (A->val.v[i] - B->val.v[i]);
    int n = A->val.size();
    y.v[0] = (float)(s / n);
    return record(std::move(y), {A, B}, [A, B, n](Node& o) {
        float k = 2 * o.grad.v[0] / n;
        for (int i = 0; i < n; i++) {
            float d = A->val.v[i] - B->val.v[i];
            if (A->requiresGrad) gradOf(A).v[i] += k * d;
            if (B->requiresGrad) gradOf(B).v[i] -= k * d;
        }
    });
}

// 每条序列的 Σ log p(目标)：rowSeq[i] = 第 i 行属于第几条序列（−1 = 不计）。返回 [nSeq × 1]（DPO 用）
inline Var seqLogProb(const Var& L, const std::vector<int>& targets, const std::vector<int>& rowSeq, int nSeq) {
    int n = L->val.rows, V = L->val.cols;
    Tensor P = zeros(n, V), y = zeros(nSeq, 1);
    for (int i = 0; i < n; i++) {
        int s = rowSeq[i], t = targets[i];
        if (s < 0 || t < 0) continue;
        const float* z = &L->val.v[i * V];
        float m = z[0]; for (int j = 1; j < V; j++) m = std::max(m, z[j]);
        double sum = 0; for (int j = 0; j < V; j++) { P.v[i * V + j] = std::exp(z[j] - m); sum += P.v[i * V + j]; }
        for (int j = 0; j < V; j++) P.v[i * V + j] = (float)(P.v[i * V + j] / sum);
        y.v[s] += (float)(z[t] - m - std::log(sum));
    }
    return record(std::move(y), {L}, [L, P, targets, rowSeq, n, V](Node& o) {
        Tensor& gl = gradOf(L);
        for (int i = 0; i < n; i++) {
            int s = rowSeq[i], t = targets[i];
            if (s < 0 || t < 0) continue;
            float k = o.grad.v[s];
            for (int j = 0; j < V; j++) gl.v[i * V + j] -= k * P.v[i * V + j];
            gl.v[i * V + t] += k;
        }
    });
}

// ═══════════════════════════ 卷积族（一张图 = 一行，通道优先 C×H×W） ═══════════════════════════
struct ConvSpec { int C = 1, H = 1, W = 1, KH = 3, KW = 3, stride = 1, padH = 0, padW = 0; };

// 方形卷积核的常用写法：conv(C, H, W, K, stride, pad)
inline ConvSpec conv(int C, int H, int W, int K, int stride = 1, int pad = 0) {
    ConvSpec s; s.C = C; s.H = H; s.W = W; s.KH = K; s.KW = K; s.stride = stride; s.padH = pad; s.padW = pad;
    return s;
}

inline int convOutH(const ConvSpec& s) { return (s.H + 2 * s.padH - s.KH) / s.stride + 1; }
inline int convOutW(const ConvSpec& s) { return (s.W + 2 * s.padW - s.KW) / s.stride + 1; }

// 二维卷积（互相关，与 PyTorch Conv2d 相同）。X[N × C·H·W]，Wt[Cout × C·KH·KW]，b[1 × Cout]
inline Var conv2d(const Var& X, const Var& Wt, const Var& b, const ConvSpec& s) {
    int N = X->val.rows, Co = Wt->val.rows, Ho = convOutH(s), Wo = convOutW(s);
    int inS = s.C * s.H * s.W, outS = Co * Ho * Wo, kS = s.C * s.KH * s.KW;
    Tensor y = zeros(N, outS);
    for (int n = 0; n < N; n++)
        for (int co = 0; co < Co; co++)
            for (int oy = 0; oy < Ho; oy++)
                for (int ox = 0; ox < Wo; ox++) {
                    float acc = b->val.v[co];
                    for (int ci = 0; ci < s.C; ci++)
                        for (int ky = 0; ky < s.KH; ky++) {
                            int iy = oy * s.stride - s.padH + ky;
                            if (iy < 0 || iy >= s.H) continue;
                            for (int kx = 0; kx < s.KW; kx++) {
                                int ix = ox * s.stride - s.padW + kx;
                                if (ix < 0 || ix >= s.W) continue;
                                acc += X->val.v[n * inS + (ci * s.H + iy) * s.W + ix] * Wt->val.v[co * kS + (ci * s.KH + ky) * s.KW + kx];
                            }
                        }
                    y.v[n * outS + (co * Ho + oy) * Wo + ox] = acc;
                }
    return record(std::move(y), {X, Wt, b}, [X, Wt, b, s, N, Co, Ho, Wo, inS, outS, kS](Node& o) {
        for (int n = 0; n < N; n++)
            for (int co = 0; co < Co; co++)
                for (int oy = 0; oy < Ho; oy++)
                    for (int ox = 0; ox < Wo; ox++) {
                        float g = o.grad.v[n * outS + (co * Ho + oy) * Wo + ox];
                        if (g == 0) continue;
                        if (b->requiresGrad) gradOf(b).v[co] += g;
                        for (int ci = 0; ci < s.C; ci++)
                            for (int ky = 0; ky < s.KH; ky++) {
                                int iy = oy * s.stride - s.padH + ky;
                                if (iy < 0 || iy >= s.H) continue;
                                for (int kx = 0; kx < s.KW; kx++) {
                                    int ix = ox * s.stride - s.padW + kx;
                                    if (ix < 0 || ix >= s.W) continue;
                                    int xi = n * inS + (ci * s.H + iy) * s.W + ix, wi = co * kS + (ci * s.KH + ky) * s.KW + kx;
                                    if (Wt->requiresGrad) gradOf(Wt).v[wi] += g * X->val.v[xi];
                                    if (X->requiresGrad) gradOf(X).v[xi] += g * Wt->val.v[wi];
                                }
                            }
                    }
    });
}

// 2×2 平均池化：[N × C·H·W] → [N × C·(H/2)·(W/2)]
inline Var avgPool2(const Var& X, int C, int H, int W) {
    int N = X->val.rows, h = H / 2, w = W / 2;
    Tensor y = zeros(N, C * h * w);
    for (int n = 0; n < N; n++) for (int c = 0; c < C; c++) for (int i = 0; i < h; i++) for (int j = 0; j < w; j++) {
        int base = n * C * H * W + c * H * W + 2 * i * W + 2 * j;
        y.v[n * C * h * w + (c * h + i) * w + j] = 0.25f * (X->val.v[base] + X->val.v[base + 1] + X->val.v[base + W] + X->val.v[base + W + 1]);
    }
    return record(std::move(y), {X}, [X, N, C, H, W, h, w](Node& o) {
        Tensor& gx = gradOf(X);
        for (int n = 0; n < N; n++) for (int c = 0; c < C; c++) for (int i = 0; i < h; i++) for (int j = 0; j < w; j++) {
            int base = n * C * H * W + c * H * W + 2 * i * W + 2 * j;
            float g = 0.25f * o.grad.v[n * C * h * w + (c * h + i) * w + j];
            gx.v[base] += g; gx.v[base + 1] += g; gx.v[base + W] += g; gx.v[base + W + 1] += g;
        }
    });
}

// 2×2 最大池化：梯度只回到每个窗口里最大的那个位置
inline Var maxPool2(const Var& X, int C, int H, int W) {
    int N = X->val.rows, h = H / 2, w = W / 2;
    Tensor y = zeros(N, C * h * w);
    std::vector<int> arg = ints(y.size());
    for (int n = 0; n < N; n++) for (int c = 0; c < C; c++) for (int i = 0; i < h; i++) for (int j = 0; j < w; j++) {
        int base = n * C * H * W + c * H * W + 2 * i * W + 2 * j, cand[4] = {base, base + 1, base + W, base + W + 1}, best = cand[0];
        for (int k = 1; k < 4; k++) if (X->val.v[cand[k]] > X->val.v[best]) best = cand[k];
        int oi = n * C * h * w + (c * h + i) * w + j;
        y.v[oi] = X->val.v[best]; arg[oi] = best;
    }
    return record(std::move(y), {X}, [X, arg](Node& o) { Tensor& gx = gradOf(X); for (int i = 0; i < o.val.size(); i++) gx.v[arg[i]] += o.grad.v[i]; });
}

// 最近邻 2× 上采样：[N × C·H·W] → [N × C·2H·2W]（U-Net 解码器）
inline Var upsample2(const Var& X, int C, int H, int W) {
    int N = X->val.rows, H2 = 2 * H, W2 = 2 * W;
    Tensor y = zeros(N, C * H2 * W2);
    for (int n = 0; n < N; n++) for (int c = 0; c < C; c++) for (int i = 0; i < H2; i++) for (int j = 0; j < W2; j++)
        y.v[n * C * H2 * W2 + (c * H2 + i) * W2 + j] = X->val.v[n * C * H * W + (c * H + i / 2) * W + j / 2];
    return record(std::move(y), {X}, [X, N, C, H, W, H2, W2](Node& o) {
        Tensor& gx = gradOf(X);
        for (int n = 0; n < N; n++) for (int c = 0; c < C; c++) for (int i = 0; i < H2; i++) for (int j = 0; j < W2; j++)
            gx.v[n * C * H * W + (c * H + i / 2) * W + j / 2] += o.grad.v[n * C * H2 * W2 + (c * H2 + i) * W2 + j];
    });
}

// 按通道广播加：X[N × C·HW] + Bc[N × C]（扩散 U-Net 里把时间步 embedding 加到每个通道上）

        }
    });
}

inline Var mulChannel(const Var& X, const Var& Sc, int C) {
    int N = X->val.rows, HW = X->val.cols / C;
    Tensor y = X->val;
    for (int n = 0; n < N; n++) for (int c = 0; c < C; c++) for (int k = 0; k < HW; k++) y.v[n * C * HW + c * HW + k] *= Sc->val.v[n * C + c];
    return record(std::move(y), {X, Sc}, [X, Sc, N, C, HW](Node& o) {
        for (int n = 0; n < N; n++) for (int c = 0; c < C; c++) {
            float s = 0, sc = Sc->val.v[n * C + c];

            }
            if (Sc->requiresGrad) gradOf(Sc).v[n * C + c] += s;
        }
    });

// minml_nn.h — 极简 C++ 机器学习库 · 第 3 部分：初始化、线性层、优化器、学习率调度（与页面 JS 的 LM.AdamW / LM.SGD / LM.cosineLR 相同）
#pragma once
#include "minml_autograd.h"

// ── 初始化 ──
// He / Kaiming：std = √(2 / fanIn)，适合 ReLU 一类激活（第 02 篇）
inline Tensor heInit(int rows, int cols, int fanIn, Rng& r) { return randn(rows, cols, std::sqrt(2.f / fanIn), r); }

// Xavier / Glorot：std = √(2 / (fanIn + fanOut))，适合 tanh / sigmoid
inline Tensor xavierInit(int rows, int cols, int fanIn, int fanOut, Rng& r) { return randn(rows, cols, std::sqrt(2.f / (fanIn + fanOut)), r); }

// ── 线性层：Y = X·W + b，W 存成 [in × out]（PyTorch 的 nn.Linear 存 [out × in]，算的是同一个东西） ──
struct Linear { Var W, b; };

inline Linear makeLinear(int in, int out, float std, Rng& r) { Linear l; l.W = param(randn(in, out, std, r)); l.b = param(zeros(1, out)); return l; }

inline Var forward(const Linear& l, const Var& x) { return linear(x, l.W, l.b); }

// ── 梯度工具 ──
inline void zeroGrad(std::vector<Var>& params) { for (Var& p : params) std::fill(p->grad.v.begin(), p->grad.v.end(), 0.f); }

// 所有梯度的全局 L2 范数；超过 maxNorm 就整体缩小到 maxNorm。返回裁剪前的范数
inline float clipGradNorm(std::vector<Var>& params, float maxNorm) {
    double s = 0;
    for (Var& p : params) for (float g : p->grad.v) s += (double)g * g;
    float norm = (float)std::sqrt(s);
    if (maxNorm > 0 && norm > maxNorm) {
        float k = maxNorm / (norm + 1e-6f);
        for (Var& p : params) for (float& g : p->grad.v) g *= k;
    }
    return norm;
}

// ── SGD（可带动量）：v ← μ·v + g；p ← p − lr·v ──
struct SGD { std::vector<Var> params; std::vector<Tensor> vel; float lr = 0.1f, momentum = 0.f; };

inline SGD makeSGD(std::vector<Var> params, float lr, float momentum = 0.f) {
    SGD o; o.params = params; o.lr = lr; o.momentum = momentum;
    for (Var& p : params) o.vel.push_back(zeros(p->val.rows, p->val.cols));
    return o;
}

inline void sgdStep(SGD& o, float lr) {
    for (size_t k = 0; k < o.params.size(); k++) {
        Var& p = o.params[k];
        if (p->grad.v.empty()) continue;
        for (int i = 0; i < p->val.size(); i++) { o.vel[k].v[i] = o.momentum * o.vel[k].v[i] + p->grad.v[i]; p->val.v[i] -= lr * o.vel[k].v[i]; }
    }
}

// ── AdamW（Loshchilov & Hutter：权重衰减与梯度的自适应缩放解耦）。decay[k] = 第 k 个参数要不要做权重衰减 ──
struct AdamW {
    std::vector<Var> params;
    std::vector<bool> decay;
    std::vector<Tensor> m, v;                                    // 一阶 / 二阶矩
    float lr = 1e-3f, b1 = 0.9f, b2 = 0.95f, eps = 1e-8f, wd = 0.1f;
    int t = 0;
};

inline AdamW makeAdamW(std::vector<Var> params, std::vector<bool> decay, float lr, float wd, float b1 = 0.9f, float b2 = 0.95f, float eps = 1e-8f) {
    AdamW o; o.params = params; o.decay = decay; o.lr = lr; o.wd = wd; o.b1 = b1; o.b2 = b2; o.eps = eps;
    for (Var& p : params) { o.m.push_back(zeros(p->val.rows, p->val.cols)); o.v.push_back(zeros(p->val.rows, p->val.cols)); }
    return o;
}

// 一步更新：m ← β₁m + (1−β₁)g；v ← β₂v + (1−β₂)g²；p ← p − lr·( m̂/(√v̂ + ε) + wd·p )，m̂、v̂ 是偏差修正后的值
inline void adamwStep(AdamW& o, float lr) {
    o.t++;
    double bc1 = 1 - std::pow((double)o.b1, o.t), bc2 = 1 - std::pow((double)o.b2, o.t);
    for (size_t k = 0; k < o.params.size(); k++) {
        Var& p = o.params[k];
        if (p->grad.v.empty()) continue;
        float wd = o.decay[k] ? o.wd : 0.f;
        for (int i = 0; i < p->val.size(); i++) {
            float g = p->grad.v[i];
            o.m[k].v[i] = o.b1 * o.m[k].v[i] + (1 - o.b1) * g;
            o.v[k].v[i] = o.b2 * o.v[k].v[i] + (1 - o.b2) * g * g;
            double mh = o.m[k].v[i] / bc1, vh = o.v[k].v[i] / bc2;
            p->val.v[i] -= (float)(lr * (mh / (std::sqrt(vh) + o.eps) + wd * p->val.v[i]));
        }
    }
}

// ── 学习率：线性 warmup → cosine 衰减到 minLR（nanoGPT 的 get_lr 同款） ──
inline float cosineLR(int it, float maxLR, float minLR, int warmup, int total) {
    if (it < warmup) return maxLR * (it + 1) / warmup;
    if (it >= total) return minLR;
    double r = (double)(it - warmup) / std::max(1, total - warmup);
    return (float)(minLR + 0.5 * (1 + std::cos(3.141592653589793 * r)) * (maxLR - minLR));
}

// 一个 Pre-LN Block：x ← x + Attn(LN₁(x))；x ← x + MLP(LN₂(x))
inline Var blockForward(const Block& b, const Var& x, int B, int T, int H) {

    Var q = linear(h1, b.Wq, b.bq), k = linear(h1, b.Wk, b.bk), v = linear(h1, b.Wv, b.bv);

    Var h2 = layerNorm(x1, b.ln2g, b.ln2b);
    return add(x1, linear(gelu(linear(h2, b.W1, b.b1)), b.W2, b.b2));
}

// 前向：ids = B 条长度 T 的序列（展平）→ logits [B·T × V]。inputEmb 非空时替代 token embedding（多模态前缀）
inline Var gptForward(GPT& m, const std::vector<int>& ids, int B, int T, const Var* inputEmb = nullptr) {
    std::vector<int> pos = ints(B * T);
    for (int i = 0; i < B * T; i++) pos[i] = i % T;
    Var x = add(inputEmb ? *inputEmb : embedding(ids, m.wte), gatherRows(m.wpe, pos));

    return matmulBT(layerNorm(x, m.lnfg, m.lnfb), m.wte);   // 权重共享：LM head 就是 wteᵀ
}

// ── 训练数据：随机取 B 个长度 T+1 的窗口，y 是 x 右移一位（每个位置都在预测下一个 token） ──
struct Batch { std::vector<int> x, y; };

inline Batch getBatch(const std::vector<int>& data, int B, int T, Rng& r) {
    Batch b; b.x.resize(B * T); b.y.resize(B * T);
    for (int i = 0; i < B; i++) {
        int s = (int)(uniform(r) * (data.size() - T - 1));
        for (int t = 0; t < T; t++) { b.x[i * T + t] = data[s + t]; b.y[i * T + t] = data[s + t + 1]; }
    }
    return b;
}

// 一步训练：前向 → 交叉熵 → 反向 → 梯度裁剪到 1.0 → AdamW。返回这一步的 loss
inline float trainStep(GPT& m, AdamW& opt, const Batch& b, int B, int T, float lr) {
    zeroGrad(m.params);
    Var loss = crossEntropy(gptForward(m, b.x, B, T), b.y);
    backward(loss);
    clipGradNorm(m.params, 1.0f);
    adamwStep(opt, lr);
    return loss->val.v[0];
}

// ── 解码：温度 → top-k → top-p（nucleus），返回重新归一化后的分布（没选中的为 0） ──
inline std::vector<float> decodeDist(std::vector<float> logits, float temperature, int topK, float topP) {
    int V = (int)logits.size();
    softmaxInPlace(logits, std::max(temperature, 1e-4f));
    std::vector<int> order = ints(V);
    for (int i = 0; i < V; i++) order[i] = i;
    std::stable_sort(order.begin(), order.end(), [&logits](int a, int b) { return logits[a] > logits[b]; });
    std::vector<float> p = floats(V);
    double cum = 0, s = 0;
    for (int r = 0; r < V; r++) {
        if (topK > 0 && r >= topK) break;
        int i = order[r];
        p[i] = logits[i]; cum += logits[i];
        if (topP > 0 && topP < 1 && cum >= topP) break;
    }
    for (float x : p) s += x;
    for (float& x : p) x = (float)(x / s);
    return p;
}

// ── 推理用的逐 token 前向（不建计算图）+ KV cache：每个新 token 只算自己的 q/k/v，复用之前所有位置的 k/v ──
struct KVCache { std::vector<std::vector<float>> k, v; };       // 每层一份 [T × d]

// 一行的 LayerNorm（推理用）
inline void layerNormRow(const float* x, const Var& g, const Var& b, int d, float* out) {
    float mu = 0, var = 0;
    for (int j = 0; j < d; j++) mu += x[j];
    mu /= d;
    for (int j = 0; j < d; j++) var += (x[j] - mu) * (x[j] - mu);
    float rs = 1.f / std::sqrt(var / d + 1e-5f);
    for (int j = 0; j < d; j++) out[j] = (x[j] - mu) * rs * g->val.v[j] + b->val.v[j];
}

// 一行的线性层：out = x·W + b（推理用）
inline void linearRow(const float* x, const Var& W, const Var& b, int in, int outN, float* out) {
    for (int j = 0; j < outN; j++) out[j] = b->val.v[j];
    for (int p = 0; p < in; p++) { float xv = x[p]; if (xv == 0) continue; for (int j = 0; j < outN; j++) out[j] += xv * W->val.v[p * outN + j]; }
}

// 把位置 pos 的 token 喂进模型，返回下一个 token 的 logits（并把这一位置的 k / v 写进 cache）
inline std::vector<float> gptStep(const GPT& m, KVCache& c, int tok, int pos) {
    const GPTConfig& g = m.cfg;
    int d = g.d, dh = d / g.H;
    std::vector<float> x = floats(d), h = floats(d), q = floats(d), k = floats(d), v = floats(d), a = floats(d);
    std::vector<float> t = floats(std::max(d, g.ff)), f = floats(g.ff), att = floats(g.T), logits = floats(g.V);
    for (int j = 0; j < d; j++) x[j] = m.wte->val.v[tok * d + j] + m.wpe->val.v[pos * d + j];
    for (int l = 0; l < g.L; l++) {
        const Block& b = m.blocks[l];
        layerNormRow(x.data(), b.ln1g, b.ln1b, d, h.data());
        linearRow(h.data(), b.Wq, b.bq, d, d, q.data()); linearRow(h.data(), b.Wk, b.bk, d, d, k.data()); linearRow(h.data(), b.Wv, b.bv, d, d, v.data());
        std::copy(k.begin(), k.end(), c.k[l].begin() + pos * d);
        std::copy(v.begin(), v.end(), c.v[l].begin() + pos * d);
        std::fill(a.begin(), a.end(), 0.f);
        for (int hh = 0; hh < g.H; hh++) {
            float mx = -1e30f, z = 0;
            for (int j = 0; j <= pos; j++) {
                float s = 0;
                for (int e = 0; e < dh; e++) s += q[hh * dh + e] * c.k[l][j * d + hh * dh + e];
                att[j] = s / std::sqrt((float)dh); mx = std::max(mx, att[j]);
            }
            for (int j = 0; j <= pos; j++) { att[j] = std::exp(att[j] - mx); z += att[j]; }
            for (int j = 0; j <= pos; j++) for (int e = 0; e < dh; e++) a[hh * dh + e] += att[j] / z * c.v[l][j * d + hh * dh + e];
        }
        linearRow(a.data(), b.Wo, b.bo, d, d, t.data());
        for (int j = 0; j < d; j++) x[j] += t[j];
        layerNormRow(x.data(), b.ln2g, b.ln2b, d, h.data());
        linearRow(h.data(), b.W1, b.b1, d, g.ff, f.data());
        for (float& z : f) z = actF(ACT_GELU, z);
        linearRow(f.data(), b.W2, b.b2, g.ff, d, t.data());
        for (int j = 0; j < d; j++) x[j] += t[j];
    }
    layerNormRow(x.data(), m.lnfg, m.lnfb, d, h.data());
    for (int vv = 0; vv < g.V; vv++) { float s = 0; for (int j = 0; j < d; j++) s += h[j] * m.wte->val.v[vv * d + j]; logits[vv] = s; }
    return logits;
}

// 自回归生成：先把 prompt 喂进去，然后每步从 decodeDist 采样一个 token（greedy = 取最大），遇到 stopId 或上下文满了就停
inline std::vector<int> generate(const GPT& m, std::vector<int> prompt, int maxNew, float temperature, int topK, float topP, Rng& r, bool greedy = false, int stopId = -1) {
    const GPTConfig& g = m.cfg;
    KVCache c;
    c.k.assign(g.L, std::vector<float>(g.T * g.d, 0.f));
    c.v.assign(g.L, std::vector<float>(g.T * g.d, 0.f));
    std::vector<float> logits;
    for (int t = 0; t < (int)prompt.size() && t < g.T; t++) logits = gptStep(m, c, prompt[t], t);
    std::vector<int> out = prompt;
    for (int n = 0; n < maxNew && (int)out.size() < g.T; n++) {
        int id = greedy ? argmaxIndex(logits) : sampleIndex(decodeDist(logits, temperature, topK, topP), r);
        out.push_back(id);
        if (id == stopId) break;
        if ((int)out.size() < g.T) logits = gptStep(m, c, id, (int)out.size() - 1);
    }
    return out;
}

// ── 字符级词表（UTF-8）：一个汉字 / 标点 = 一个 token；特殊 token 写成 <eos> 这样的整体 ──
struct Vocab { std::vector<std::string> itos; };

// 把 UTF-8 字符串切成一个个字符（汉字占 3 个字节）
inline std::vector<std::string> utf8Chars(const std::string& s) {
    std::vector<std::string> out;
    for (size_t i = 0; i < s.size();) {
        unsigned char c = (unsigned char)s[i];
        size_t n = c < 0x80 ? 1 : (c >> 5) == 6 ? 2 : (c >> 4) == 14 ? 3 : 4;
        out.push_back(s.substr(i, n)); i += n;
    }
    return out;
}

inline int tokenId(const Vocab& v, const std::string& tok) {
    for (int i = 0; i < (int)v.itos.size(); i++) if (v.itos[i] == tok) return i;
    return -1;
}

inline std::vector<int> encode(const Vocab& v, const std::string& text) {
    std::vector<int> ids;
    std::vector<std::string> chars = utf8Chars(text);
    for (size_t i = 0; i < chars.size(); i++) {
        if (chars[i] == "<") {                                   // 特殊 token：<eos>、<user>、<bot>…
            std::string tok = "<";
            size_t j = i + 1;
            while (j < chars.size() && chars[j] != ">") tok += chars[j++];
            int id = tokenId(v, tok + ">");
            if (id >= 0) { ids.push_back(id); i = j; continue; }
        }
        ids.push_back(tokenId(v, chars[i]));
    }
    return ids;
}

inline std::string decode(const Vocab& v, const std::vector<int>& ids) {
    std::string s;
    for (int id : ids) s += v.itos[id];
    return s;
}

    function difSchedule(Tn) {
        const s = 0.008, f = (t) => Math.cos((t / Tn + s) / (1 + s) * Math.PI / 2) ** 2, ab = new Float64Array(Tn + 1);
        for (let t = 0; t <= Tn; t++) ab[t] = f(t) / f(0);
        ab[Tn] = Math.max(ab[Tn], 1e-5);
        return ab;
    }
    /** 去噪网络：[x_t, 时间步的正弦 embedding] → MLP（SiLU）→ 预测噪声 ε */
    function difCreate(seed, hid, D) {
        const rand = LM.rng(seed), E = 32; hid = hid || 128; D = D || DIF.K;
        const P = (name, r, c, init, decay) => { const t = AG.param(name, r, c, init); t.decay = !!decay; return t; };
        const m = { D, E, hid, W1: P('W1', D + E, hid, LM.init.he(rand, D + E), true), b1: P('b1', 1, hid), W2: P('W2', hid, hid, LM.init.he(rand, hid), true), b2: P('b2', 1, hid), W3: P('W3', hid, D, LM.init.normal(rand, 0.01), true), b3: P('b3', 1, D) };
        m.params = [m.W1, m.b1, m.W2, m.b2, m.W3, m.b3];

    }
    function timeEmb(ts, E) { const n = ts.length, out = new Float32Array(n * E); for (let i = 0; i < n; i++) for (let j = 0; j < E / 2; j++) { const fr = Math.exp(-Math.log(1000) * j / (E / 2)), a = ts[i] * fr; out[i * E + j] = Math.sin(a); out[i * E + E / 2 + j] = Math.cos(a); } return out; }
    function difForward(m, Xt, ts, n) {
        const h0 = AG.concatCols(AG.tensor(n, m.D, Xt), AG.tensor(n, m.E, timeEmb(ts, m.E)));
        const h1 = AG.silu(AG.linear(h0, m.W1, m.b1)), h2 = AG.silu(AG.linear(h1, m.W2, m.b2));

    }
    /** 一步训练：随机 t、随机噪声 ε，x_t = √ᾱ_t·x₀ + √(1−ᾱ_t)·ε；网络预测 v = √ᾱ_t·ε − √(1−ᾱ_t)·x₀（v-prediction），损失 = ‖v̂ − v‖² 的均值 */
    function difTrainStep(m, opt, X0, nData, B, rand, lr) {
        const D = m.D, Xt = new Float32Array(B * D), V = new Float32Array(B * D), ts = new Float32Array(B);
        for (let b = 0; b < B; b++) {
            const i = Math.floor(rand() * nData), t = 1 + Math.floor(rand() * DIF.TSTEPS), a = Math.sqrt(m.ab[t]), s = Math.sqrt(1 - m.ab[t]);
            ts[b] = t;
            for (let j = 0; j < D; j++) { const e = LM.randn(rand), x0 = X0[i * D + j]; Xt[b * D + j] = a * x0 + s * e; V[b * D + j] = a * e - s * x0; }
        }
        LM.zeroGrad(m.params);
        const loss = AG.mse(difForward(m, Xt, ts, B), AG.tensor(B, D, V));
        AG.backward(loss);
        LM.clipGradNorm(m.params, 1.0);
        opt.step(lr);
        return loss.item();
    }
    /** DDIM（η = 0，确定性）从纯噪声走 nSteps 步回到 x₀；返回每个样本最后的 x₀（以及中间若干步的 x̂₀ 用于画图） */
    function difSample(m, n, nSteps, rand, keep) {
        const D = m.D, ab = m.ab, x = new Float32Array(n * D), ts = new Float32Array(n), snaps = [];
        for (let i = 0; i < n * D; i++) x[i] = LM.randn(rand);
        const seq = []; for (let k = 0; k < nSteps; k++) seq.push(Math.round(DIF.TSTEPS * (1 - k / nSteps)));
        AG.noGrad(() => {
            seq.forEach((t, k) => {
                const tp = k + 1 < nSteps ? seq[k + 1] : 0;
                ts.fill(t);
                const vh = difForward(m, x, ts, n).data, a = ab[t], ap = ab[tp], sa = Math.sqrt(a), s1 = Math.sqrt(1 - a);
                const x0 = new Float32Array(n * D);
                for (let i = 0; i < n * D; i++) {
                    const v0 = PL_clamp(sa * x[i] - s1 * vh[i], -4, 4), e = (x[i] - sa * v0) / s1;   // x̂₀ = √ᾱ·x_t − √(1−ᾱ)·v̂，ε̂ 由 x̂₀ 反推
                    x0[i] = v0; x[i] = Math.sqrt(ap) * v0 + Math.sqrt(1 - ap) * e;
                }
                if (keep && keep.includes(k)) snaps.push({ k, t, x: Float32Array.from(x), x0 });
            });
        });
        return { x, snaps };
    }

    // ═════════════════════════════ 第 01 步：采样、混叠、量化 ═════════════════════════════
    /** 采样后听到的频率：把 f 折回 [0, fs/2]（f_a = |f − fs·round(f/fs)|） */
    const aliasFreq = (f, fs) => { const r = ((f % fs) + fs) % fs; return r > fs / 2 ? fs - r : r; };
    /** 理想重建（Whittaker–Shannon）：x(t) = Σ_k x[k]·sinc(fs·t − k)，截断到 ±taps 个样本并加 Hann 窗。xs[i] 是第 k0 + i 个样本 */
    function sincAt(xs, k0, fs, t, taps) {
        const u = fs * t, c = Math.floor(u); let s = 0;
        for (let k = c - taps + 1; k <= c + taps; k++) { const i = k - k0; if (i < 0 || i >= xs.length) continue; const d = u - k, w = 0.5 + 0.5 * Math.cos(Math.PI * d / taps); s += xs[i] * (d === 0 ? 1 : Math.sin(Math.PI * d) / (Math.PI * d)) * w; }
        return s;
    }
    /** 任意采样率的信号 → 目标采样率（带限 sinc 插值，就是 DAC 的重建滤波器；降采样时先低通到新的奈奎斯特）。只用于播放 */
    function resample(x, fsIn, fsOut, taps) {
        taps = taps || 16; const n = Math.floor(x.length * fsOut / fsIn), y = new Float64Array(n), lp = Math.min(1, fsOut / fsIn);
        for (let j = 0; j < n; j++) {
            const u = j * fsIn / fsOut, c = Math.floor(u); let s = 0;
            for (let k = c - taps + 1; k <= c + taps; k++) { if (k < 0 || k >= x.length) continue; const e = u - k, d = e * lp, w = 0.5 + 0.5 * Math.cos(Math.PI * e / taps); s += x[k] * lp * (d === 0 ? 1 : Math.sin(Math.PI * d) / (Math.PI * d)) * w; }
            y[j] = s;
        }
        return y;
    }
    /** 量化：均匀 b bit（round 到 2^(b−1) 级），或 μ-law（μ = 255：先压扩 y = sgn(x)·ln(1 + μ|x|)/ln(1 + μ)，再均匀量化，再展开） */
    function quantize(x, bits, mu) {
        const q = Math.pow(2, bits - 1), y = new Float64Array(x.length), MU = 255, lmu = Math.log1p(MU);
        for (let i = 0; i < x.length; i++) {
            let v = PL_clamp(x[i], -1, 1);
            if (mu) v = Math.sign(v) * Math.log1p(MU * Math.abs(v)) / lmu;
            v = PL_clamp(Math.round(v * q), -q, q - 1) / q;
            if (mu) v = Math.sign(v) * (Math.pow(1 + MU, Math.abs(v)) - 1) / MU;

    }
    function snrDb(x, y, i0, i1) { i0 = i0 || 0; i1 = i1 ?? x.length; let s = 0, e = 0; for (let i = i0; i < i1; i++) { s += x[i] * x[i]; e += (x[i] - y[i]) ** 2; } return 10 * Math.log10((s + 1e-30) / (e + 1e-30)); }
    /** 采样率 fs 下，对 0 … fmax 的一串纯音做 FFT，读出谱峰的位置 = 实测的输出频率 */
    function measureFold(fs, fmax, n) {
        const N = 1024, w = hann(N), out = [];
        for (let i = 0; i <= n; i++) {
            const f = fmax * i / n, re = new Float64Array(N), im = new Float64Array(N);
            for (let k = 0; k < N; k++) re[k] = Math.sin(TAU * f * k / fs + 0.3) * w[k];
            fft(re, im, false);
            let b = 0, bv = -1; for (let k = 0; k <= N / 2; k++) { const p = re[k] * re[k] + im[k] * im[k]; if (p > bv) { bv = p; b = k; } }
            let d = 0;   // 抛物线插值求峰的精确位置
            if (b > 0 && b < N / 2) { const a0 = Math.log(re[b - 1] ** 2 + im[b - 1] ** 2 + 1e-30), a1 = Math.log(bv + 1e-30), a2 = Math.log(re[b + 1] ** 2 + im[b + 1] ** 2 + 1e-30); d = 0.5 * (a0 - a2) / ((a0 - 2 * a1 + a2) || 1); }
            out.push({ f, fo: (b + d) * fs / N });
        }
        return out;
    }

    // ═════════════════════════════ 演示片段（第 02–04 步）：旋律 → 啁啾 → 元音 a、i → 噪声 → 三下咔嗒 ═════════════════════════════
    function makeClip() {
        const L = Math.round(2.65 * SR), x = new Float64Array(L), rand = LM.rng(2024), segs = [];
        const put = (y, t, gain) => { const at = Math.round(t * SR); for (let i = 0; i < y.length && at + i < L; i++) x[at + i] += y[i] * gain; };
        [60, 64, 67, 72].forEach((m, k) => addNote(x, Math.round(k * 0.25 * SR), Math.round(0.25 * SR), midiHz(m), TIMBRES[0], 0.16));
        segs.push({ t0: 0, t1: 1, label: '旋律 C4 E4 G4 C5' });
        put(fadeEdges(chirpLin(200, 3800, Math.round(0.5 * SR), 0.3), 5), 1.05, 1); segs.push({ t0: 1.05, t1: 1.55, label: '啁啾' });
        const rmsN = (y, r) => { let p = 0; for (const v of y) p += v * v; const g = r / Math.sqrt(p / y.length + 1e-20); for (let i = 0; i < y.length; i++) y[i] *= g; return y; };
        put(rmsN(vowelClip(VOWELS[0], { f0: 120, vtl: 1 }, 0.3, rand), 0.13), 1.62, 1); segs.push({ t0: 1.62, t1: 1.92, label: '元音 a' });
        put(rmsN(vowelClip(VOWELS[2], { f0: 112, vtl: 1 }, 0.3, rand), 0.13), 1.92, 1); segs.push({ t0: 1.92, t1: 2.22, label: 'i' });
        const nz = new Float64Array(Math.round(0.14 * SR)); for (let i = 0; i < nz.length; i++) nz[i] = (2 * rand() - 1) * Math.exp(-i / (0.035 * SR)) * 0.4;
        put(nz, 2.27, 1); segs.push({ t0: 2.27, t1: 2.41, label: '噪声' });
        [2.47, 2.52, 2.57].forEach((t) => { const i = Math.round(t * SR); x[i] += 0.7; x[i + 1] -= 0.35; });
        segs.push({ t0: 2.45, t1: 2.6, label: '咔嗒' });
        return { x, L, segs };
    }

    // ═════════════════════════════ 第 05 / 06 步的数据：48 段训练旋律 + 6 段测试旋律（两种音色交替）→ MDCT 帧 ═════════════════════════════
    const CODEC = { M: 256, NQ: 8, B: 64, GAMMA: 0.98, STEPS: 1500, EVAL_EVERY: 10, BEAT: 2048, NTRAIN: 48, NTEST: 6, EVALF: 64 };
    CODEC.FPS = SR / CODEC.M;
    function melodySet(n, seed) {
        const r = LM.rng(seed), out = [];
        for (let i = 0; i < n; i++) { const mel = makeMelody(r, 8 + Math.floor(r() * 5)), m = renderMelody(mel, CODEC.BEAT, i % 2, 0.22, 0); m.mel = mel; m.tb = i % 2; m.mdct = mdct(m.x, CODEC.M); out.push(m); }
        return out;
    }
    function codecData() {
        const train = melodySet(CODEC.NTRAIN, 11), test = melodySet(CODEC.NTEST, 999), F = train.reduce((a, m) => a + m.mdct.F, 0), X = new Float64Array(F * CODEC.M);
        let o = 0; train.forEach((m) => { X.set(m.mdct.C, o); o += m.mdct.C.length; });
        const ev = test[0].mdct, EF = Math.min(CODEC.EVALF, ev.F);
        return { train, test, X, F, sec: train.reduce((a, m) => a + m.x.length, 0) / SR, evC: ev.C.subarray(0, EF * CODEC.M), EF };
    }
    /** 系数域的 SNR（MDCT 是正交变换：系数的误差能量 = 波形的误差能量） */
    function coefSNR(X, Xh) { let s = 0, e = 0; for (let i = 0; i < X.length; i++) { s += X[i] * X[i]; e += (X[i] - Xh[i]) ** 2; } return 10 * Math.log10(s / (e + 1e-30)); }
    function newCodecRun(K, seed) { return { K, Q: rvqCreate(CODEC.M, K, CODEC.NQ, { gamma: CODEC.GAMMA, seed }), step: 0, curve: [], evals: [], rand: LM.rng((seed * 13 + 1) >>> 0), last: null }; }
    function codecEval(R, D) {
        const codes = rvqEncode(R.Q, D.evC, D.EF, CODEC.NQ), snr = [], use = [];
        for (let nq = 1; nq <= CODEC.NQ; nq++) snr.push(coefSNR(D.evC, rvqDecode(R.Q, codes, D.EF, nq)));
        for (let l = 0; l < CODEC.NQ; l++) { const h = new Int32Array(R.K); for (let t = 0; t < D.EF; t++) h[codes[t * CODEC.NQ + l]]++; use.push(h); }
        R.last = { step: R.step, codes, snr, use };
        R.evals.push({ step: R.step, snr });
    }
    /** 每帧：要么训练一步（mini-batch EMA k-means），要么做一次评估（每 10 步一次），不在同一帧里都做 */
    function codecTick(R, D) {
        const due = R.step % CODEC.EVAL_EVERY === 0 || R.step >= CODEC.STEPS;
        if (due && (!R.last || R.last.step !== R.step)) { codecEval(R, D); return; }
        if (R.step < CODEC.STEPS) { R.curve.push(rvqTrainStep(R.Q, D.X, D.F, CODEC.B, R.rand)); R.step++; }
    }
    /** 全部测试旋律上的 SNR（按层数），Node 里核对用 */
    function codecTestSNR(Q, D, nqMax) {
        const out = [];
        for (let nq = 1; nq <= nqMax; nq++) { let s = 0, e = 0; D.test.forEach((m) => { const c = rvqEncode(Q, m.mdct.C, m.mdct.F, Q.NQ), Xh = rvqDecode(Q, c, m.mdct.F, nq); for (let i = 0; i < Xh.length; i++) { s += m.mdct.C[i] ** 2; e += (m.mdct.C[i] - Xh[i]) ** 2; } }); out.push(10 * Math.log10(s / e)); }
        return out;
    }

    // ═════════════════════════════ 第 06 步的训练：阶段 1 训练 LM 自己的编解码器（4 层）→ 阶段 2 打 token → 阶段 3 训练延迟排布 LM ═════════════════════════════
    const LMC = { K: 64, NQ: 4, CODEC_STEPS: 500, CODEC_SPF: 2, TOK_CHUNK: 160, B: 2, T: 32, STEPS: 2000, LR: 3e-3, WARM: 100, EVAL_EVERY: 100, VALB: 8, PROMPT: 8, GEN: 88 };
    function newLMRun(seed) {
        const R = { phase: 0, seed, Q: rvqCreate(CODEC.M, LMC.K, LMC.NQ, { gamma: CODEC.GAMMA, seed: seed + 5 }), crand: LM.rng(seed * 7 + 3), cstep: 0, tokPos: 0, codes: null, step: 0, loss: [], evals: [], ms: 0, batch: null };
        R.m = tlmCreate({ NQ: LMC.NQ, K: LMC.K, T: LMC.T, d: 32, L: 2, H: 4, ff: 128 }, seed);
        R.opt = new LM.AdamW(R.m.params, { lr: LMC.LR, b1: 0.9, b2: 0.95, eps: 1e-8, wd: 0.1 });
        R.rand = LM.rng((seed * 7919 + 11) >>> 0);
        return R;
    }
    function lmTick(R, D) {
        if (R.phase === 0) {   // 阶段 1：编解码器（与第 05 步同一个 EMA k-means，但只要 4 层、K = 64）
            for (let k = 0; k < LMC.CODEC_SPF && R.cstep < LMC.CODEC_STEPS; k++) { rvqTrainStep(R.Q, D.X, D.F, CODEC.B, R.crand); R.cstep++; }
            if (R.cstep >= LMC.CODEC_STEPS) { R.phase = 1; R.codes = new Int32Array(D.F * LMC.NQ); }
            return;
        }
        if (R.phase === 1) {   // 阶段 2：冻结码本，给整个训练集打 token（分几帧做完）
            const t1 = Math.min(D.F, R.tokPos + LMC.TOK_CHUNK);
            R.codes.set(rvqEncode(R.Q, D.X.subarray(R.tokPos * CODEC.M, t1 * CODEC.M), t1 - R.tokPos, LMC.NQ), R.tokPos * LMC.NQ); R.tokPos = t1;
            if (R.tokPos >= D.F) {
                R.stream = delayPattern(R.codes, D.F, LMC.NQ, LMC.K); R.P = D.F + LMC.NQ - 1;
                R.seen = new Set(); for (let t = 0; t < D.F; t++) R.seen.add(R.codes.subarray(t * LMC.NQ, t * LMC.NQ + LMC.NQ).join(','));
                R.test = D.test.map((m) => ({ codes: rvqEncode(R.Q, m.mdct.C, m.mdct.F, LMC.NQ), F: m.mdct.F, x: m.x }));
                let F = 0; R.test.forEach((t) => { F += t.F; }); const all = new Int32Array(F * LMC.NQ); let o = 0; R.test.forEach((t) => { all.set(t.codes, o); o += t.codes.length; });
                R.vb = tlmBatch(delayPattern(all, F, LMC.NQ, LMC.K), F + LMC.NQ - 1, LMC.NQ, LMC.K, LMC.VALB, LMC.T, LM.rng(77));
                R.phase = 2;
            }
            return;
        }
        const evalDue = R.step % LMC.EVAL_EVERY === 0 || R.step >= LMC.STEPS;
        if (evalDue && (!R.evals.length || R.evals[R.evals.length - 1].step !== R.step)) { R.evals.push({ step: R.step, val: tlmEval(R.m, R.vb.x, R.vb.y, LMC.VALB, LMC.T) }); return; }
        if (R.step >= LMC.STEPS) return;
        R.batch = tlmBatch(R.stream, R.P, LMC.NQ, LMC.K, LMC.B, LMC.T, R.rand, R.batch);
        const t0 = now(), r = tlmTrainStep(R.m, R.opt, R.batch.x, R.batch.y, LMC.B, LMC.T, LM.cosineLR(R.step, { maxLR: LMC.LR, minLR: LMC.LR / 10, warmup: LMC.WARM, total: LMC.STEPS }));
        const dt = now() - t0; R.ms = R.ms ? 0.9 * R.ms + 0.1 * dt : dt;
        R.loss.push(r.loss); R.lastPer = r.per; R.step++;
    }
    /** 用当前模型续写：提示 = 测试旋律的前 8 帧（第一个音符），再生成 88 帧；解码 → 波形 → 每拍的音高分析 */
    function lmGenerate(R, which, temp, seed) {
        const t = R.test[which], F0 = LMC.PROMPT, prompt = delayPattern(t.codes.subarray(0, F0 * LMC.NQ), F0, LMC.NQ, LMC.K);
        const seq = tlmGenerate(R.m, prompt, F0, LMC.GEN + LMC.NQ - 1, { temperature: temp, rand: LM.rng(seed), force: t.codes, forceF: F0 });
        const codes = undelay(seq, F0 + LMC.GEN + LMC.NQ - 1, LMC.NQ), F = codes.length / LMC.NQ;
        const valid = new Uint8Array(F); for (let f = 0; f < F; f++) valid[f] = R.seen.has(codes.subarray(f * LMC.NQ, f * LMC.NQ + LMC.NQ).join(',')) ? 1 : 0;
        const x = imdct(rvqDecode(R.Q, codes, F, LMC.NQ), F, CODEC.M, (F - 1) * CODEC.M);
        const nReal = Math.min(t.x.length, x.length), real = t.x.subarray(0, nReal), recon = imdct(rvqDecode(R.Q, t.codes, t.F, LMC.NQ), t.F, CODEC.M, t.x.length);
        return { codes, F, valid, x, real, recon, prompt: x.subarray(0, F0 * CODEC.M), pitch: pitchReport(x, CODEC.BEAT), F0 };
    }
    /** 每拍（2048 个样本）中间 1024 点做 FFT：在音阶的 8 个音里找谐波能量（按 1/h 加权）最大的那个；清晰度 = 它的谐波能量占比 */
    function pitchReport(y, beat) {
        const out = [], N = 1024, w = hann(N);
        for (let s = 0; s + beat <= y.length; s += beat) {
            const re = new Float64Array(N), im = new Float64Array(N), o = s + (beat - N) / 2;
            for (let i = 0; i < N; i++) re[i] = (y[o + i] || 0) * w[i];
            fft(re, im, false);
            const P = new Float64Array(N / 2); let tot = 0; for (let k = 1; k < N / 2; k++) { P[k] = re[k] ** 2 + im[k] ** 2; tot += P[k]; }
            let best = -1, bs = 0, bw = -1;
            SCALE.forEach((m) => { const f0 = midiHz(m); let e = 0, ew = 0; for (let h = 1; h * f0 < 3800; h++) { const kc = Math.round(h * f0 * N / SR); let eh = 0; for (let k = kc - 2; k <= kc + 2; k++) if (k > 0 && k < N / 2) eh += P[k]; e += eh; ew += eh / h; } if (ew > bw) { bw = ew; bs = e; best = m; } });
            out.push({ midi: best, clarity: tot > 1e-9 ? bs / tot : 0, energy: tot });
        }
        return out;

    // ═════════════════════════════ 第 07 步的训练：阶段 1 合成音符 → 阶段 2 PCA 潜空间 → 阶段 3 潜空间扩散 ═════════════════════════════

const P13_CPP_COMMON = String.raw`
// 全篇统一的采样率（8 kHz，电话音质：浏览器里能实时算 STFT / Griffin-Lim / 训练）与 π
const int SR = 8000;
const double kPi = 3.14159265358979323846;

// 复数谱：第 t 帧第 k 个频率在 [t·nb + k]；N = 窗长，H = 跳长，nb = N/2 + 1 个频率（实信号只需要非负频率）
struct Spec { int T = 0, N = 0, H = 0, nb = 0; std::vector<float> re, im; };

// 原地基 2 复数 FFT（Cooley–Tukey）；inverse = true 时做逆变换并除以 n
void fft(std::vector<double>& re, std::vector<double>& im, bool inverse) {
    int n = (int)re.size();
    for (int i = 1, j = 0; i < n; i++) {                        // 位反转重排
        int bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) { std::swap(re[i], re[j]); std::swap(im[i], im[j]); }
    }
    double sg = inverse ? 1.0 : -1.0;
    for (int size = 2; size <= n; size <<= 1) {                 // log₂n 级蝶形
        int half = size / 2;
        for (int i = 0; i < n; i += size)
            for (int j = 0; j < half; j++) {
                double wr = std::cos(2 * kPi * j / size), wi = sg * std::sin(2 * kPi * j / size);
                int a = i + j, b = a + half;
                double xr = re[b] * wr - im[b] * wi, xi = re[b] * wi + im[b] * wr;
                re[b] = re[a] - xr; im[b] = im[a] - xi;
                re[a] += xr; im[a] += xi;
            }
    }
    if (inverse) for (int i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

// 周期 Hann 窗 w[n] = 0.5 − 0.5·cos(2πn/N)
std::vector<double> hann(int N) {
    std::vector<double> w = std::vector<double>(N);
    for (int n = 0; n < N; n++) w[n] = 0.5 - 0.5 * std::cos(2 * kPi * n / N);
    return w;
}

// STFT（center = true：两端各补 N/2 个零）：第 t 帧覆盖样本 [t·H − N/2, t·H + N/2)，共 1 + ⌊L/H⌋ 帧
Spec stft(const std::vector<float>& x, int N, int H) {
    int L = (int)x.size(), h2 = N / 2;
    Spec S;
    S.N = N; S.H = H; S.T = 1 + L / H; S.nb = N / 2 + 1;
    S.re = floats(S.T * S.nb);
    S.im = floats(S.T * S.nb);
    std::vector<double> w = hann(N), fr = std::vector<double>(N), fi = std::vector<double>(N);
    for (int t = 0; t < S.T; t++) {
        for (int n = 0; n < N; n++) {
            int i = t * H - h2 + n;
            fr[n] = (i >= 0 && i < L) ? x[i] * w[n] : 0.0;      // 加窗
            fi[n] = 0.0;
        }
        fft(fr, fi, false);
        for (int k = 0; k < S.nb; k++) { S.re[t * S.nb + k] = (float)fr[k]; S.im[t * S.nb + k] = (float)fi[k]; }
    }
    return S;
}

// 逆 STFT：每帧补全共轭对称 → 逆 FFT → 加窗重叠相加 → 除以 Σw²（最小二乘意义下的逆，与 torch.istft 相同）

            int q = k < X.nb ? k : N - k;                       // 负频率 = 对应正频率的共轭

    }

    for (int i = 0; i < L; i++) x[i] = wsum[i] > 1e-8 ? (float)(acc[i] / wsum[i]) : 0.f;
    return x;
}

    `,
    regen: { label: '换随机种子', title: '换一组随机初始化（Griffin-Lim 的初始相位、码本、语言模型、扩散模型、识别器），所有训练从头开始；合成的数据不变' },

    params: [
        { id: 'fs', label: '采样率 fs', min: 1000, max: 16000, step: 250, value: 8000, unit: ' Hz', affects: 'frame', desc: 'Step 01：对「连续」信号采样的频率。奈奎斯特频率 = fs/2：高于它的成分会被折回低频（混叠）。把 fs 降到 6000 以下，5 kHz 的音就变成了另一个音高。' },
        { id: 'tone', label: '输入频率 f', min: 50, max: 7950, step: 10, value: 5000, unit: ' Hz', affects: 'frame', desc: 'Step 01：被采样的纯音频率。f < fs/2 时采样点能还原它；f > fs/2 时，同一串采样点恰好也落在频率 |f − fs·round(f/fs)| 的正弦上——重建出来的是这个「假」频率。' },
        { id: 'bits', label: '量化位数', options: [16, 12, 8, 6, 4, 3, 2], value: 8, affects: 'frame', desc: 'Step 01：每个样本用几个 bit。均匀量化每少 1 bit，满幅正弦的信噪比少约 6 dB（6.02b + 1.76）；μ-law 让小信号也有足够的级数（WaveNet 用 8 bit μ-law，256 类）。' },

        { id: 'hop', label: '跳长', options: [{ value: 2, label: 'N/2' }, { value: 4, label: 'N/4' }, { value: 8, label: 'N/8' }], value: 4, affects: 'frame', desc: 'Step 02–04：相邻两帧相隔多少样本。跳长只决定时间轴的采样密度，不改变每帧的分辨率；Griffin-Lim 需要足够的重叠（N/4 或更密）才能收敛到好的相位。' },
        { id: 'nmels', label: 'mel 通道数', options: [16, 24, 40, 64, 80], value: 40, affects: 'frame', desc: 'Step 03–04：mel 滤波器组的三角滤波器个数（Whisper 用 80）。通道少 → 频谱更粗、更省；窗很短时通道太多，低频的三角形里落不到任何 FFT bin（空滤波器）。' },
        { id: 'K', label: '码本大小 K', options: [16, 32, 64, 128], value: 64, affects: 'frame', desc: 'Step 05：RVQ 每层码本的码字数。每层每帧花 log₂K bit：K 越大每层越准、码率越高、训练越慢（K = 128 时每帧训练约 2 倍耗时）。改动会让第 05 步从头训练。' },

    stages: [
        { id: 'clip', lifetime: 'resident', run(S) { S.snd = S.snd || {}; S.clip = P13.makeClip(); S.snd.clip = { x: S.clip.x, sr: P13.SR }; } },
        {
            id: 'samp', lifetime: 'frame', run(S) {   // Step 01：只在 fs / f / 位数变化时重算
                const key = [S.fs, S.tone, S.bits].join('|'); if (S.sm && S.sm.key === key) return;
                const fs = S.fs, f = S.tone, fa = P13.aliasFreq(f, fs), k0 = -64, nS = Math.ceil(0.006 * fs) + 128, xs = new Float64Array(nS);
                for (let i = 0; i < nS; i++) xs[i] = Math.sin(P13.TAU * f * (k0 + i) / fs + 0.4);
                const tw = 0.004, NC = 600, cont = new Float64Array(NC), rec = new Float64Array(NC), ts = new Float64Array(NC);
                for (let j = 0; j < NC; j++) { const t = tw * j / (NC - 1); ts[j] = t * 1000; cont[j] = Math.sin(P13.TAU * f * t + 0.4); rec[j] = P13.sincAt(xs, k0, fs, t, 48); }
                const kx = [], ky = []; for (let k = 0; k <= Math.floor(tw * fs); k++) { kx.push(1000 * k / fs); ky.push(xs[k - k0]); }

                const nC = Math.round(2 * fs), ch = new Float64Array(nC); for (let i = 0; i < nC; i++) { const t = i / fs; ch[i] = 0.5 * Math.sin(P13.TAU * (50 * t + 0.5 * (7950 / 2) * t * t)); }
                const Nf = fs >= 8000 ? 256 : 128, sp = P13.stft(ch, Nf, Nf / 4), cdb = P13.powerDb(sp);
                // 量化：演示片段里的元音 a（−20 dBFS）与满幅 / 不同电平的正弦
                const seg = S.clip.x.subarray(Math.round(1.70 * P13.SR), Math.round(1.70 * P13.SR) + 160), lev = 0.1 / Math.max(...Array.from(seg, Math.abs)), vx = Float64Array.from(seg, (v) => v * lev);
                const qu = P13.quantize(vx, S.bits, false), qm = P13.quantize(vx, S.bits, true);
                const levels = [], su = [], smu = [], sine = new Float64Array(4000);
                for (let L = -60; L <= 0; L += 5) { const a = Math.pow(10, L / 20); for (let i = 0; i < sine.length; i++) sine[i] = a * Math.sin(P13.TAU * 441 * i / 8000 + 0.1); levels.push(L); su.push(P13.snrDb(sine, P13.quantize(sine, S.bits, false))); smu.push(P13.snrDb(sine, P13.quantize(sine, S.bits, true))); }
                const clipQ = Float64Array.from(S.clip.x, (v) => v * 0.1), cqU = P13.quantize(clipQ, S.bits, false), cqM = P13.quantize(clipQ, S.bits, true);
                S.sm = { key, fs, f, fa, aliased: f > fs / 2, ts, cont, rec, kx, ky, fold, chirp: ch, cdb, cT: sp.T, cNb: sp.nb, vx, qu, qm, levels, su, smu, snrU: P13.snrDb(clipQ, cqU), snrM: P13.snrDb(clipQ, cqM) };
                const T = 1.2, hi = 32000, nT = Math.round(T * hi);
                S.snd.tone = () => { const y = new Float64Array(nT); for (let i = 0; i < nT; i++) y[i] = 0.5 * Math.sin(P13.TAU * f * i / hi); return { x: y, sr: hi }; };
                S.snd.toneS = () => { const n = Math.round(T * fs), y = new Float64Array(n); for (let i = 0; i < n; i++) y[i] = 0.5 * Math.sin(P13.TAU * f * i / fs); return { x: P13.resample(y, fs, hi, 24), sr: hi }; };
                S.snd.chirp = () => { const n = 2 * hi, y = new Float64Array(n); for (let i = 0; i < n; i++) { const t = i / hi; y[i] = 0.5 * Math.sin(P13.TAU * (50 * t + 0.5 * (7950 / 2) * t * t)); } return { x: y, sr: hi }; };
                S.snd.chirpS = () => ({ x: P13.resample(ch, fs, hi, 24), sr: hi });
                S.snd.qU = { x: cqU, sr: P13.SR }; S.snd.qM = { x: cqM, sr: P13.SR };
            },
        },
        {
            id: 'spec', lifetime: 'frame', run(S) {   // Step 02–04：演示片段的 STFT / mel，只在窗长 / 跳长 / mel 数变化时重算
                const key = [S.win, S.hop, S.nmels].join('|'); if (S.sp && S.sp.key === key) return;

        {

                S.trio = [64, 256, 1024].map((N) => { const H = N / 4, sp = P13.stft(S.clip.x, N, H), db = P13.powerDb(sp); return { N, H, db, T: sp.T, nb: sp.nb, range: P13.dbRange(db, 80) }; });

        },
        {
            id: 'gl', lifetime: 'history', lazy: true, run(S) {   // Step 04：Griffin-Lim 与快速 Griffin-Lim 各迭代一次 / 帧，最多 100 次（只在本步可见时运行）
                const key = [S.epoch, S.win, S.hop, S.seed].join('|');
                if (!S.gl || S.gl.key !== key) {
                    const p = S.sp, A = P13.magnitude(p.sp), L = S.clip.L;

                for (let k = 0; k < 32; k++) P13.glStep(G);

                S.gm = { key, x: G.x, sc: G.sc[G.sc.length - 1], invErr: Math.sqrt(e / a), Pdb: Float32Array.from(P, (v) => 10 * Math.log10(v + 1e-10)) };

        },
        { id: 'cdata', lifetime: 'resident', lazy: true, run(S) { S.cdata = P13.codecData(); const t = S.cdata.test[0]; S.snd.codecOrig = { x: t.x, sr: P13.SR }; } },
        {
            id: 'codec', lifetime: 'history', lazy: true, needs: ['cdata'], run(S) {   // Step 05：RVQ 码本的 EMA k-means 训练（只在本步可见时运行）
                const key = [S.epoch, S.K, S.seed].join('|');
                if (!S.codec || S.codec.key !== key) { S.codec = P13.newCodecRun(S.K, S.seed); S.codec.key = key; }
                P13.codecTick(S.codec, S.cdata);
                const R = S.codec, D = S.cdata, t = D.test[0];
                [1, 2, 4, 8].forEach((n) => { S.snd['codec' + n] = () => ({ x: P13.imdct(P13.rvqDecode(R.Q, P13.rvqEncode(R.Q, t.mdct.C, t.mdct.F, P13.CODEC.NQ), t.mdct.F, n), t.mdct.F, P13.CODEC.M, t.x.length), sr: P13.SR }); });

        },
        {
            id: 'codecView', lifetime: 'frame', lazy: true, needs: ['codec'], run(S) {   // Step 05：当前码本 + 当前层数下的解码结果（评估片段）
                const R = S.codec; if (!R || !R.last) return;
                const key = R.last.step + '|' + S.nq + '|' + R.key; if (S.cv && S.cv.key === key) return;
                const D = S.cdata, EF = D.EF, y = P13.imdct(P13.rvqDecode(R.Q, R.last.codes, EF, S.nq), EF, P13.CODEC.M, (EF - 1) * P13.CODEC.M), sp = P13.stft(y, 256, 64);
                if (!S.cvOrig) { const x0 = D.test[0].x.subarray(0, (EF - 1) * P13.CODEC.M), s0 = P13.stft(x0, 256, 64); S.cvOrig = { db: P13.powerDb(s0), T: s0.T, nb: s0.nb }; S.cvOrig.range = P13.dbRange(S.cvOrig.db, 80); }

        {
            id: 'lm', lifetime: 'history', lazy: true, needs: ['cdata'], run(S) {   // Step 06：编解码器 → 打 token → 延迟排布 LM（只在本步可见时运行）

        {

                const key = [S.epoch, S.seed].join('|');

    intro: {
        title: '声音也是一串数：从波形、频谱到音频 token，再到生成与识别',
        flow: ['波形（采样 / 量化）', 'STFT 频谱图', 'mel 频谱', '相位重建（声码器）', '编解码器：RVQ → token', 'token 语言模型', 'mel 潜空间扩散', 'TTS：文本 → 语音', 'ASR：语音 → 文本'],
        html: LM.navHtml('13') + `
            <p>图像是二维的像素网格，文本是一串 token，声音则是<strong>一维的压力随时间变化</strong>：麦克风每秒读几千到几万次数，得到一条很长的波形。1 秒 16 kHz 的语音就有 16 000 个数——直接把它当成 token 序列喂给第 04 篇的 Transformer，序列太长、每个数的含义又太「底层」。音频模型的历史，很大程度上就是在找<strong>更好的表示</strong>：频谱图（看得见音高和音色）、mel 频谱（贴近人耳）、神经编解码器的离散 token（能像文字一样做语言建模），然后在这些表示上做生成（TTS、音乐生成）和理解（ASR）。</p>
            <p>本页的声音全部在页面里<strong>合成</strong>：五声音阶的旋律（风琴 / 拨弦两种音色）、啁啾、用共振峰合成器（Klatt 1980 的级联谐振器）做的元音和汉语音节、噪声与咔嗒声。采样率统一为 <b>8 kHz</b>（电话音质），这样 STFT、Griffin-Lim 和五个训练都能在浏览器里实时跑。每个 <b>▶</b> 按钮播放的都是页面刚刚算出来的真实结果：原始声音、Griffin-Lim 的重建、不同码率下编解码器的输出、语言模型 / 扩散模型生成的声音、合成的语音。</p>
            <p>带 <span style="color:#a45fa5">LIVE</span> 的步骤在训练（第 04 步 Griffin-Lim 迭代、第 05 步码本、第 06 步 token 语言模型、第 07 步扩散模型、第 09 步识别器）。为了不让整页卡顿，<strong>每个训练只在它所在的步骤出现在屏幕上时才跑</strong>，滚走就暂停、回来接着训。代码块是同一算法的 C++ 版本（C++17 标准库 + 本系列自带的极简库 <code>cpp/minml_*.h</code>，见节点图上方的 Common）。会用到前面几篇的东西：第 09 篇的 VQ（向量量化）、第 04 / 05 篇的 Transformer 语言模型、第 11 篇的扩散，用到时都会先回顾一句。</p>

                // 以采样率 fs 对 x(t) = sin(2πf·t + φ) 采样 n 个点：x[k] = x(k / fs)
                std::vector<float> sampleTone(float f, float fs, int n, float phi) {
                    std::vector<float> x = floats(n);
                    for (int k = 0; k < n; k++) x[k] = (float)std::sin(2 * kPi * f * k / fs + phi);
                    return x;
                }

                // 采样后「听到」的频率：把 f 折回 [0, fs/2]
                float aliasFrequency(float f, float fs) {
                    float r = std::fmod(f, fs);
                    return r > fs / 2 ? fs - r : r;
                }

                // 理想重建（Whittaker–Shannon）：x(t) = Σ_k x[k]·sinc(fs·t − k)，截断到 ±taps 个样本并乘 Hann 窗
                float sincReconstruct(const std::vector<float>& x, float fs, double t, int taps) {
                    double u = fs * t, s = 0;
                    int c = (int)std::floor(u);
                    for (int k = c - taps + 1; k <= c + taps; k++) {
                        if (k < 0 || k >= (int)x.size()) continue;
                        double d = u - k, sinc = d == 0 ? 1.0 : std::sin(kPi * d) / (kPi * d);
                        s += x[k] * sinc * (0.5 + 0.5 * std::cos(kPi * d / taps));
                    }
                    return (float)s;
                }

                // 均匀量化：每半边 2^(bits−1) 级，四舍五入
                float quantizeUniform(float x, int bits) {
                    float q = (float)(1 << (bits - 1));
                    float v = std::round(std::clamp(x, -1.f, 1.f) * q);
                    return std::clamp(v, -q, q - 1) / q;
                }

                // μ-law（μ = 255）：先压扩，小信号被放大 → 量化级数更多地给了小幅度；再均匀量化、展开回去
                float quantizeMuLaw(float x, int bits) {
                    const float mu = 255.f;
                    float y = std::log1p(mu * std::min(std::fabs(x), 1.f)) / std::log1p(mu);
                    float yq = quantizeUniform(x < 0 ? -y : y, bits);
                    float a = (std::pow(1 + mu, std::fabs(yq)) - 1) / mu;
                    return yq < 0 ? -a : a;
                }

                    for (size_t i = 0; i < x.size(); i++) { s += x[i] * x[i]; e += (x[i] - y[i]) * (x[i] - y[i]); }
                    return 10 * std::log10((s + 1e-30) / (e + 1e-30));
                }`,

                float melToHz(float m) { return 700.f * (std::pow(10.f, m / 2595.f) - 1.f); }

                // nMels 个三角滤波器：W[m·nb + k]，峰值 1，中心在 mel 刻度上等间距（0 … SR/2）
                struct MelBank { int nMels = 0, nb = 0; std::vector<float> W; };

                MelBank melFilterbank(int N, int nMels) {

                // 谱收敛度：‖|STFT(x)| − A‖ / ‖A‖
                float spectralConvergence(const Spec& Y, const std::vector<float>& A) {
                    double e = 0, a = 0;
                    for (size_t i = 0; i < A.size(); i++) { double m = std::hypot(Y.re[i], Y.im[i]); e += (m - A[i]) * (m - A[i]); a += A[i] * A[i]; }
                    return (float)std::sqrt(e / a);
                }

                // Griffin-Lim：已知幅度 A[T × nb]，从随机相位出发；momentum = 0 是原始算法，0.99 是快速 Griffin-Lim
                std::vector<float> griffinLim(const std::vector<float>& A, int T, int N, int H, int L, int iters, float momentum, Rng& r) {
                    Spec X; X.T = T; X.N = N; X.H = H; X.nb = N / 2 + 1; X.re = floats(T * X.nb); X.im = floats(T * X.nb);
                    for (int i = 0; i < T * X.nb; i++) { double ph = 2 * kPi * uniform(r); X.re[i] = A[i] * (float)std::cos(ph); X.im[i] = A[i] * (float)std::sin(ph); }
                    std::vector<float> prevRe = floats(T * X.nb), prevIm = floats(T * X.nb);
                    std::vector<float> x = istft(X, L);
                    for (int it = 0; it < iters; it++) {

                        for (int i = 0; i < T * X.nb; i++) {

                        }
                        x = istft(X, L);                                              // 投影回「真实存在的波形」

                std::vector<float> mdctFrame(const std::vector<float>& seg, int M) {

                        double s = 0;
                        for (int n = 0; n < 2 * M; n++) s += std::sin(kPi * (n + 0.5) / (2 * M)) * seg[n] * std::cos(kPi / M * (n + 0.5 + M / 2.0) * (k + 0.5));

                std::vector<float> imdctFrame(const std::vector<float>& X, int M) {

                struct RVQ { int D = 0, K = 0, NQ = 0, inited = 0; float gamma = 0.98f; std::vector<Tensor> C, sum, cnt; };

                    RVQ q; q.D = D; q.K = K; q.NQ = NQ;
                    for (int l = 0; l < NQ; l++) { q.C.push_back(zeros(K, D)); q.sum.push_back(zeros(K, D)); q.cnt.push_back(zeros(1, K)); }

                // 最近的码字：argmin_k ‖r − c_k‖²
                int nearestCode(const Tensor& C, const std::vector<float>& r) {

                        for (int j = 0; j < C.cols; j++) { double e = r[j] - C.at(k, j); d += e * e; }

                struct PCA { int D = 0, k = 0; std::vector<float> mu, lam; Tensor U; };

                // 子空间迭代：反复 U ← orth(U·Cov)，收敛到协方差矩阵的前 k 个特征向量
                PCA pcaFit(const Tensor& X, int k, int iters, Rng& r) {
                    PCA p; p.D = X.cols; p.k = k; p.mu = floats(p.D); p.lam = floats(k);
                    for (int i = 0; i < X.rows; i++) for (int j = 0; j < p.D; j++) p.mu[j] += X.at(i, j) / X.rows;

                    for (int it = 0; it <= iters; it++) {

                        for (int c = 0; c < k; c++) for (int a = 0; a < p.D; a++) for (int b = 0; b < p.D; b++) W.at(c, a) += Cv.at(a, b) * p.U.at(c, b);

                            for (int q = 0; q < c; q++) { double d = 0; for (int j = 0; j < p.D; j++) d += W.at(c, j) * W.at(q, j); for (int j = 0; j < p.D; j++) W.at(c, j) -= (float)d * W.at(q, j); }
                            double n = 0; for (int j = 0; j < p.D; j++) n += W.at(c, j) * W.at(c, j);
                            if (it == iters) p.lam[c] = (float)std::sqrt(n);                // 最后一轮：‖Cov·u‖ = 特征值
                            for (int j = 0; j < p.D; j++) W.at(c, j) /= (float)std::sqrt(n);
                        }
                        if (it < iters) p.U = W;
                    }
                    return p;
                }

                Tensor pcaEncode(const PCA& p, const Tensor& X) {

                Tensor whisperLogMel(const std::vector<float>& x, const MelBank& B, int N, int H) {
                    Spec S = stft(x, N, H);
                    std::vector<float> lg = floats(S.T * B.nMels);
                    float mx = -1e30f;
                    for (int t = 0; t < S.T; t++)
                        for (int m = 0; m < B.nMels; m++) {
                            double e = 0;
                            for (int k = 0; k < S.nb; k++) { int i = t * S.nb + k; e += B.W[m * B.nb + k] * (S.re[i] * S.re[i] + S.im[i] * S.im[i]); }
                            lg[t * B.nMels + m] = (float)std::log10(std::max(e, 1e-10));

                    VowelNet m; m.NM = NM; m.T = T; m.C1 = C1; m.T2 = (T + 2 - 3) / 2 + 1;

                    m.W2 = param(heInit(C1, C1 * 3, C1 * 3, r)); m.b2 = param(zeros(1, C1));
                    m.fc.W = param(xavierInit(C1, 5, C1, 5, r)); m.fc.b = param(zeros(1, 5));
                    Tensor P = zeros(C1 * m.T2, C1);                                   // 时间平均 = 乘一个固定矩阵
                    for (int c = 0; c < C1; c++) for (int t = 0; t < m.T2; t++) P.at(c * m.T2 + t, c) = 1.f / m.T2;
                    m.pool = constant(P);
                    m.params = { m.W1, m.b1, m.W2, m.b2, m.fc.W, m.fc.b };
