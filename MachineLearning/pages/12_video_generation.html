        void applyKnownFrames(std::vector<float>& x, const std::vector<float>& cond, int B, int known) {
            for (int b = 0; b < B; b++)
                std::copy(cond.begin() + (size_t)b * FRAMES * NPIX, cond.begin() + (size_t)b * FRAMES * NPIX + known * NPIX, x.begin() + (size_t)b * FRAMES * NPIX);
        }

        // Euler 积分 K 步：t 从 1（纯噪声）走到 0；x_{t−Δt} = x_t − Δt·v̂
        std::vector<float> eulerSample(DiT& m, std::vector<float> x, int B, int K, const std::vector<int>& cls) {
            for (int k = 0; k < K; k++) {
                float t = 1.f - (float)k / K, dt = 1.f / K;
                std::vector<float> v = predictVelocity(m, x, B, t, cls, 0);
                for (size_t i = 0; i < x.size(); i++) x[i] -= dt * v[i];
            }
            return x;
        }

        // 逐帧生成：图像模型把 8 帧当成 8 张互不相干的图（B = 8）。噪声相关 ρ：ε_f = √ρ·ε_共享 + √(1 − ρ)·ε_f'
        std::vector<float> generatePerFrame(DiT& imageModel, float rho, int K, Rng& r) {
            std::vector<float> shared = floats(NPIX), x = floats(FRAMES * NPIX);
            for (float& e : shared) e = randn(r);
            for (int f = 0; f < FRAMES; f++)
                for (int i = 0; i < NPIX; i++) x[f * NPIX + i] = std::sqrt(rho) * shared[i] + std::sqrt(1 - rho) * randn(r);
            return eulerSample(imageModel, x, FRAMES, K, ints(FRAMES, NCLS));
        }`,

    train: `
        // 一个训练 batch：每段视频一个随机的球；x_t = (1 − t)·x₀ + t·ε；前 known 帧直接放干净的原帧、不计损失；20% 丢掉类别（CFG）
        struct FlowBatch { Tensor tok, target, mask; std::vector<float> ts; std::vector<int> cls; int B = 0; };

        // 已知帧数的分布：0 帧 50%、1 帧 20%、2 / 3 / 4 帧各 10%
        int pickKnown(Rng& r) {
            float u = (float)uniform(r);
            if (u < 0.5f) return 0;
            if (u < 0.7f) return 1;
            if (u < 0.8f) return 2;
            if (u < 0.9f) return 3;
            return 4;
        }

        // 把一段视频的 token 矩阵（[128 × cols]）拷进 batch 矩阵的第 b 段
        void putRows(Tensor& dst, const Tensor& src, int b) { std::copy(src.v.begin(), src.v.end(), dst.v.begin() + (size_t)b * src.rows * src.cols); }

        FlowBatch flowBatch(DiT& m, int B, Rng& r) {
            FlowBatch fb; fb.B = B;
            int rowsPer = FRAMES * NSP;
            fb.tok = zeros(B * rowsPer, m.inD); fb.target = zeros(B * rowsPer, PDIM); fb.mask = zeros(B * rowsPer, PDIM);
            std::vector<Ball> balls; std::vector<int> known;
            for (int b = 0; b < B; b++) {
                balls.push_back(sampleBall(r, -1));
                known.push_back(pickKnown(r));
                fb.cls.push_back(uniform(r) < 0.2 ? NCLS : balls[b].cls);          // 第 NCLS 类 = 「无条件」
            }
            for (int b = 0; b < B; b++) {
                float t = (float)uniform(r);
                std::vector<float> x0 = renderVideo(balls[b], FRAMES, 0), xt = floats(FRAMES * NPIX);
                for (int i = 0; i < FRAMES * NPIX; i++) { float e = randn(r); xt[i] = i < known[b] * NPIX ? x0[i] : (1 - t) * x0[i] + t * e; }
                putRows(fb.tok, patchify(xt, FRAMES, m.inD, known[b]), b);
                putRows(fb.target, patchify(x0, FRAMES, PDIM, 0), b);             // 预测目标：干净视频 x̂₀
                for (int row = 0; row < rowsPer; row++)
                    for (int j = 0; j < PDIM; j++) fb.mask.at(b * rowsPer + row, j) = row / NSP < known[b] ? 0.f : 1.f;
                fb.ts.push_back(t);
            }
            return fb;
        }

        // 带掩码的 MSE：Σ m·(x̂₀ − x₀)² / Σ m（已知帧 m = 0）
        Var maskedMSE(const Var& pred, const Tensor& target, const Tensor& mask) {
            float cnt = 0; for (float w : mask.v) cnt += w;
            Var diff = mul(sub(pred, constant(target)), constant(mask));
            return scale(sumAll(square(diff)), 1.f / std::max(1.f, cnt));
        }

        // 一步训练：前向 → 带掩码的 MSE → 反向 → 梯度裁剪 → AdamW（余弦学习率）→ 更新 EMA 权重（采样用 EMA）
        float trainStepDiT(DiT& m, DiT& ema, AdamW& opt, int it, int total, int B, Rng& r) {
            FlowBatch fb = flowBatch(m, B, r);
            zeroGrad(m.params);
            Var loss = maskedMSE(ditForward(m, fb.tok, B, fb.ts, fb.cls, nullptr), fb.target, fb.mask);
            backward(loss);
            clipGradNorm(m.params, 1.0f);
            adamwStep(opt, cosineLR(it, 1e-3f, 5e-5f, 200, total));
            float decay = std::min(0.999f, (1.f + it) / (10.f + it));
            for (size_t k = 0; k < m.params.size(); k++) {
                std::vector<float>& e = ema.params[k]->val.v;
                const std::vector<float>& w = m.params[k]->val.v;
                for (size_t i = 0; i < e.size(); i++) e[i] = decay * e[i] + (1 - decay) * w[i];
            }
            float value = loss->val.v[0];
            clearTape();
            return value;
        }

        // 把 src 的数值拷进 dst 的开头（形状相同，或 dst 多出几行）
        void copyValues(Var dst, const Var& src) { std::copy(src->val.v.begin(), src->val.v.end(), dst->val.v.begin()); }

        // 「膨胀」：用训练好的图像模型初始化视频模型。空间部分原样拷贝；adaLN 从 4 组 (γ₁ β₁ γ₃ β₃) 扩成 6 组，新的 (γ₂ β₂) = 0；
        // patch 投影的第 17 行（已知帧标记）= 0；时间注意力的输出投影本来就是 0 → 时间注意力分支刚插入时输出为 0。
        // 时间位置 embedding posT 是新参数：本页沿用 makeDiT 里的随机初始化（标准差 0.3），所以起点是「被轻微扰动的逐帧模型」；把它也置 0 就精确等于逐帧模型
        void inflate(DiT& video, const DiT& image) {
            int d = video.cfg.d;
            std::fill(video.win->val.v.begin(), video.win->val.v.end(), 0.f);
            copyValues(video.win, image.win);   copyValues(video.bin, image.bin);   copyValues(video.posS, image.posS);
            copyValues(video.tw1, image.tw1);   copyValues(video.tb1, image.tb1);
            copyValues(video.tw2, image.tw2);   copyValues(video.tb2, image.tb2);
            for (size_t l = 0; l < video.blocks.size(); l++) {
                DiTBlock& p = video.blocks[l];
                const DiTBlock& q = image.blocks[l];
                copyValues(p.wq, q.wq); copyValues(p.bq, q.bq); copyValues(p.wk, q.wk); copyValues(p.bk, q.bk);
                copyValues(p.wv, q.wv); copyValues(p.bv, q.bv); copyValues(p.wo, q.wo); copyValues(p.bo, q.bo);
                copyValues(p.w1, q.w1); copyValues(p.b1, q.b1); copyValues(p.w2, q.w2); copyValues(p.b2, q.b2);
                // adaLN 的第 j 列属于第 j / d 组：图像的第 0、1 组 → 视频的第 0、1 组；图像的第 2、3 组（MLP 的 γ₃ β₃）→ 视频的第 4、5 组
                for (int r = 0; r < q.mw->val.rows; r++)
                    for (int j = 0; j < 4 * d; j++) p.mw->val.at(r, j < 2 * d ? j : j + 2 * d) = q.mw->val.at(r, j);
                for (int j = 0; j < 4 * d; j++) p.mb->val.at(0, j < 2 * d ? j : j + 2 * d) = q.mb->val.at(0, j);
            }
            copyValues(video.fw, image.fw);     copyValues(video.fb, image.fb);
            copyValues(video.wout, image.wout); copyValues(video.bout, image.bout);
        }`,

    sample: `
        // 视频模型采样：8 帧从同一份整段噪声出发，每个 Euler 步网络都看完整段视频（B 段一起算）。
        // 已知帧（known > 0）：每一步都换回 cond 里的干净帧。CFG：w ≠ 1 时每步算两次——有条件 v̂_c、无条件 v̂_∅，v̂ = v̂_∅ + w·(v̂_c − v̂_∅)
        std::vector<float> sampleVideo(DiT& m, int B, int K, const std::vector<int>& cls, float w, int known, const std::vector<float>& cond, Rng& r) {
            std::vector<float> x = floats(B * FRAMES * NPIX);
            for (float& e : x) e = randn(r);
            for (int k = 0; k < K; k++) {
                float t = 1.f - (float)k / K, dt = 1.f / K;
                applyKnownFrames(x, cond, B, known);
                std::vector<float> v = predictVelocity(m, x, B, t, cls, known);
                if (w != 1.f) {
                    std::vector<float> vu = predictVelocity(m, x, B, t, ints(B, NCLS), known);
                    for (size_t i = 0; i < v.size(); i++) v[i] = vu[i] + w * (v[i] - vu[i]);
                }
                for (size_t i = 0; i < x.size(); i++) x[i] -= dt * v[i];
            }
            applyKnownFrames(x, cond, B, known);
            return x;
        }

        // 第 1 层时间注意力的概率，对 16 个位置、H 个头取平均 → 8×8（行 = 查询帧，列 = 被看的帧）
        Tensor temporalAttentionMap(DiT& m, const std::vector<float>& video, float t, Rng& r) {
            std::vector<float> xt = floats(FRAMES * NPIX), probs;
            for (int i = 0; i < FRAMES * NPIX; i++) xt[i] = (1 - t) * video[i] + t * randn(r);
            NoGrad ng;
            ditForward(m, patchify(xt, FRAMES, m.inD, 0), 1, floats(1, t), ints(1, NCLS), &probs);
            Tensor A = zeros(FRAMES, FRAMES);
            int H = m.cfg.H;
            for (int s = 0; s < NSP; s++)
                for (int h = 0; h < H; h++)
                    for (int i = 0; i < FRAMES; i++)
                        for (int j = 0; j < FRAMES; j++) A.at(i, j) += probs[((s * H + h) * FRAMES + i) * FRAMES + j] / (NSP * H);
            return A;
        }`,

    metrics: `
        // 一帧的统计：q = (x + 1)/2；质心与质量只算 q > 0.25 的像素；连通块数按 q > 0.5（4 邻接，栈式泛洪）
        struct FrameStats { float mass = 0, cx = 0, cy = 0; int comps = 0; };

        FrameStats frameStats(const std::vector<float>& video, int f) {
            FrameStats s;
            std::vector<int> lab = ints(NPIX), stack;
            float sx = 0, sy = 0;
            for (int i = 0; i < NPIX; i++) {
                float q = std::clamp((video[f * NPIX + i] + 1) * 0.5f, 0.f, 1.f);
                if (q > 0.25f) { s.mass += q; sx += q * (i % SIDE + 0.5f); sy += q * (i / SIDE + 0.5f); }
                lab[i] = q > 0.5f ? 1 : 0;
            }
            for (int i = 0; i < NPIX; i++) {
                if (lab[i] != 1) continue;
                s.comps++; lab[i] = 2; stack.push_back(i);
                while (!stack.empty()) {
                    int k = stack.back(), kx = k % SIDE, ky = k / SIDE; stack.pop_back();
                    if (kx > 0 && lab[k - 1] == 1) { lab[k - 1] = 2; stack.push_back(k - 1); }
                    if (kx < SIDE - 1 && lab[k + 1] == 1) { lab[k + 1] = 2; stack.push_back(k + 1); }
                    if (ky > 0 && lab[k - SIDE] == 1) { lab[k - SIDE] = 2; stack.push_back(k - SIDE); }
                    if (ky < SIDE - 1 && lab[k + SIDE] == 1) { lab[k + SIDE] = 2; stack.push_back(k + SIDE); }
                }
            }
            if (s.mass > 0) { s.cx = sx / s.mass; s.cy = sy / s.mass; }
            return s;
        }

        // 单轴拟合 p(t) = r + tri(a + v·t, W − 2r)：40 × 41 的粗网格，再做 4 轮局部细化（每轮步长缩小 4 倍）
        struct AxisFit { float a = 0, v = 0, sse = 0; };

        float axisError(const std::vector<float>& pos, const std::vector<int>& ok, float r, float a, float v) {
            float L = SIDE - 2 * r, e = 0;
            for (size_t t = 0; t < pos.size(); t++) if (ok[t]) { float dd = pos[t] - r - tri(a + v * t, L); e += dd * dd; }
            return e;
        }

        AxisFit fitAxis(const std::vector<float>& pos, const std::vector<int>& ok, float r) {
            float L = SIDE - 2 * r;
            AxisFit best; best.sse = 1e30f;
            for (int i = 0; i < 40; i++)
                for (int j = 0; j < 41; j++) {
                    float a = (i + 0.5f) / 40 * 2 * L, v = -2.6f + 5.2f * j / 40, e = axisError(pos, ok, r, a, v);
                    if (e < best.sse) { best.sse = e; best.a = a; best.v = v; }
                }
            float da = 2 * L / 40, dv = 5.2f / 40;
            for (int it = 0; it < 4; it++) {
                AxisFit c = best;
                for (int i = -4; i <= 4; i++)
                    for (int j = -4; j <= 4; j++) {
                        float a = c.a + i * da / 4, v = c.v + j * dv / 4, e = axisError(pos, ok, r, a, v);
                        if (e < best.sse) { best.sse = e; best.a = a; best.v = v; }
                    }
                da /= 4; dv /= 4;
            }
            return best;
        }

        // 一段视频（nF 帧）的度量：one = 恰好一个球的帧比例；jump = 相邻帧球心的平均位移；
        // res = 用「一个匀速、弹墙的球」拟合球心轨迹后的 RMS 残差（px）；size = 球质量（≈ 面积）在帧间的变异系数
        struct VideoMetrics { float one = 0, jump = 0, res = -1, size = 0, r = 2; AxisFit fx, fy; std::vector<float> cx, cy, mass; std::vector<int> ok; };

        VideoMetrics videoMetrics(const std::vector<float>& video, int nF) {
            VideoMetrics m;
            m.cx = floats(nF); m.cy = floats(nF); m.mass = floats(nF); m.ok = ints(nF);
            int n = 0, nj = 0; float msum = 0;
            for (int t = 0; t < nF; t++) {
                FrameStats s = frameStats(video, t);
                if (s.comps == 1) m.one += 1.f / nF;
                if (s.mass > 1) { m.ok[t] = 1; m.cx[t] = s.cx; m.cy[t] = s.cy; m.mass[t] = s.mass; msum += s.mass; n++; }
            }
            for (int t = 1; t < nF; t++) if (m.ok[t] && m.ok[t - 1]) { m.jump += std::hypot(m.cx[t] - m.cx[t - 1], m.cy[t] - m.cy[t - 1]); nj++; }
            if (nj) m.jump /= nj;
            float mean = n ? msum / n : 0, var = 0;
            for (int t = 0; t < nF; t++) if (m.ok[t]) var += (m.mass[t] - mean) * (m.mass[t] - mean);
            m.size = n ? std::sqrt(var / n) / std::max(mean, 1e-6f) : 0;
            m.r = std::clamp(std::sqrt(mean / 3.14159265f), 1.2f, 3.2f);            // 由面积估计半径
            if (n >= 3) {
                m.fx = fitAxis(m.cx, m.ok, m.r);
                m.fy = fitAxis(m.cy, m.ok, m.r);
                m.res = std::sqrt((m.fx.sse + m.fy.sse) / n);
            }
            return m;
        }`,

    cond: `
        // 拟合轨迹在 t = 0 的速度：tri 是偶函数，(a, v) 与 (−a, −v) 描述同一条轨迹，所以方向要看 t = 0 处三角波的斜率
        float slopeAt0(const AxisFit& f, float r) {
            float L = SIDE - 2 * r, m = std::fmod(f.a, 2 * L);
            if (m < 0) m += 2 * L;
            return m < L ? f.v : -f.v;
        }

        Vec2 initialVelocity(const VideoMetrics& m) { Vec2 v; v.x = slopeAt0(m.fx, m.r); v.y = slopeAt0(m.fy, m.r); return v; }

        // 方向条件 + CFG 的检验：生成 n 段方向 cls 的视频，统计「拟合出的初速度方向落在该类别」的比例（随机猜 = 25%）
        float directionAccuracy(DiT& m, int cls, float w, int n, Rng& r) {
            int ok = 0;
            for (int i = 0; i < n; i++) {
                std::vector<float> video = sampleVideo(m, 1, 16, ints(1, cls), w, 0, floats(0), r);
                VideoMetrics vm = videoMetrics(video, FRAMES);
                if (vm.res < 0) continue;
                Vec2 v = initialVelocity(vm);
                if (std::hypot(v.x, v.y) > 0.3f && dirClass(v.x, v.y) == cls) ok++;
            }
            return (float)ok / n;
        }

        // 图生视频：真实视频的前 known 帧作为已知帧，其余帧由模型生成（无类别条件）
        std::vector<float> imageToVideo(DiT& m, const std::vector<float>& real, int known, Rng& r) {
            return sampleVideo(m, 1, 16, ints(1, NCLS), 1.f, known, real, r);
        }`,

    long: `
        // 自回归续写到 L 帧：第一块无条件生成 8 帧；之后每块把已有视频的最后 ctx 帧当作已知帧，生成 8 − ctx 个新帧
        std::vector<float> generateLong(DiT& m, int L, int ctx, Rng& r) {
            std::vector<float> out = floats(L * NPIX);
            std::vector<float> first = sampleVideo(m, 1, 16, ints(1, NCLS), 1.f, 0, floats(0), r);
            std::copy(first.begin(), first.end(), out.begin());
            int have = FRAMES;
            while (have < L) {
                std::vector<float> cond = floats(FRAMES * NPIX);
                std::copy(out.begin() + (size_t)(have - ctx) * NPIX, out.begin() + (size_t)have * NPIX, cond.begin());    // 最后 ctx 帧 → 新一块的第 0…ctx−1 帧
                std::vector<float> chunk = sampleVideo(m, 1, 16, ints(1, NCLS), 1.f, ctx, cond, r);
                int add = std::min(FRAMES - ctx, L - have);
                std::copy(chunk.begin() + (size_t)ctx * NPIX, chunk.begin() + (size_t)(ctx + add) * NPIX, out.begin() + (size_t)have * NPIX);
                have += add;
            }
            return out;
        }`,

    scale: `
        // 规模账：一段视频经过（可选的）VAE 压缩、再切 patch 之后有多少个 token，注意力要算多少个打分
        struct VideoShape { int frames = 8, height = 16, width = 16; };
        struct TokenPlan { int64_t latentFrames = 0, gridH = 0, gridW = 0, tokens = 0; double fullScores = 0, factorizedScores = 0; };

        // tCompress / sCompress：VAE 在时间 / 空间上的压缩倍数（像素上直接切 patch 时都是 1）；causal：因果 VAE 单独保留第 1 帧，T 帧 → 1 + (T − 1)/tCompress 个潜帧
        TokenPlan planTokens(VideoShape v, int tCompress, int sCompress, int patch, int patchT, bool causal) {
            TokenPlan p;
            int64_t lt = causal ? 1 + (v.frames - 1) / tCompress : v.frames / tCompress;
            p.latentFrames = lt / patchT;
            p.gridH = v.height / sCompress / patch;
            p.gridW = v.width / sCompress / patch;
            int64_t S = p.gridH * p.gridW;                                     // 每个潜帧的空间 token 数
            p.tokens = p.latentFrames * S;
            p.fullScores = (double)p.tokens * (double)p.tokens;              // 全时空注意力：每头每层 N² 个打分
            p.factorizedScores = (double)p.tokens * (double)(S + p.latentFrames);   // 分解：空间 N·S + 时间 N·T'
            return p;
        }

        // 一个注意力矩阵（每头每层）如果真的存下来要多少字节（fp16）：N² × 2——这就是为什么要 FlashAttention 式的分块计算
        double attentionMatrixBytes(const TokenPlan& p) { return p.fullScores * 2.0; }`,
});

const P12UI = {
    NG: 8,                                    // 每个画廊的视频段数
    FPS: 5,                                   // 预览里视频的播放速度（帧 / 秒）
    path: (b, nF) => { const out = []; for (let s = 0; s <= (nF - 1) * 10; s++) { const c = P12.ballAt(b, s / 10); out.push([c[0], c[1], s / 10]); } return out; },
    dirTxt: (b) => `${P12.DIRS[b.cls]} ${b.s.toFixed(1)}`,
};

// ═══ P12V 的补充：注意力矩阵、token 分组示意 ═══
Object.assign(P12V, (() => {
    const C = LM.C;
    /** n×n 矩阵（行 = 查询帧，列 = 被看的帧）画进 (X, Y, S×S)；返回最大值 */
    function heatN(ctx, A, n, X, Y, S, title) {
        const cs = S / n, c3 = [0, 0, 0];
        let mx = 0; for (const v of A) mx = Math.max(mx, v);
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { PL.cmap.viridis(A[i * n + j] / (mx || 1), c3); ctx.fillStyle = LM.rgbStr(c3); ctx.fillRect(X + j * cs, Y + i * cs, Math.ceil(cs), Math.ceil(cs)); }
        ctx.strokeStyle = '#2a3038'; ctx.lineWidth = 1; ctx.strokeRect(X - 0.5, Y - 0.5, S + 1, S + 1);
        ctx.font = LM.FONT(11); ctx.fillStyle = C.dim; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        for (let j = 0; j < n; j++) ctx.fillText(String(j), X + (j + 0.5) * cs, Y - 1);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (let i = 0; i < n; i++) ctx.fillText(String(i), X - 3, Y + (i + 0.5) * cs);
        if (title) { ctx.font = LM.FONT(11, true); ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(title, X + S / 2, Y + S + 4); }

    stages: [
        {
            id: 'data', lifetime: 'resident', run(S) {
                // 画廊：8 段真实视频（随「换一批」变）；参照集：300 段（固定种子）用于 PCA 与度量的基线
                S.gal = P12.makeSet(P12UI.NG, S.rand); S.galVer = (S.galVer || 0) + 1;

                const ref = P12.makeSet(300, LM.rng(777)), test = P12.makeSet(60, LM.rng(778));
                S.pca = [1, 2, 4].map((pt) => P12.fitPCA(ref.X, ref.n, pt));
                const out = new Float32Array(P12.VD);
                S.pcaCurve = S.pca.map((p) => [1, 2, 4, 8, 16, 32].map((rho) => {
                    if (p.D / rho < 1) return NaN;
                    const k = Math.round(p.D / rho); let e = 0;
                    for (let v = 0; v < test.n; v++) { P12.pcaRecon(p, test.X, v * P12.VD, k, out, 0); for (let i = 0; i < P12.VD; i++) e += (out[i] - test.X[v * P12.VD + i]) ** 2; }
                    return e / test.n / P12.VD;
                }));
                S.refM = ref.balls.map((b, i) => P12.videoMetrics(ref.X, i * P12.VD));
            },
        },
        {
            id: 'sel', lifetime: 'frame', run(S) {
                // 选中视频的 PCA 重建（8× 压缩）：逐帧 patch k = 2、tubelet(2 帧) k = 4、tubelet(4 帧) k = 8
                const v = S.vid, key = `${S.epoch}|${v}`;
                if (S._selKey === key) return;
                S._selKey = key;
                S.rec = S.pca.map((p) => { const out = new Float32Array(P12.VD), k = p.D / 8; P12.pcaRecon(p, S.gal.X, v * P12.VD, k, out, 0); let e = 0; for (let i = 0; i < P12.VD; i++) e += (out[i] - S.gal.X[v * P12.VD + i]) ** 2; return { x: out, k, mse: e / P12.VD }; });

        },
        { id: 'play', lifetime: 'frame', run(S) { S.fi = Math.floor(S.t * P12UI.FPS) % P12.T; } },
