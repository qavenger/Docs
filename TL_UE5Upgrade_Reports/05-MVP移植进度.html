<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火炬项目UE5迁移规划</title>
<style>
  :root {
    --bg0: #060a13; --bg1: #0c1424; --panel: rgba(18, 28, 48, .72); --line: rgba(120, 150, 200, .16);
    --ink: #e7eefb; --ink2: #a9b7cf; --ink3: #7a89a3;
    --done: #34d399; --doing: #4cc3ff; --start: #fbbf24; --track: rgba(140, 165, 210, .14);
    --accent1: #36d1ff; --accent2: #7c6cff; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, rgba(27, 42, 74, 0) 60%),
                radial-gradient(900px 500px at 100% 100%, #1a1240 0%, rgba(26, 18, 64, 0) 55%),
                linear-gradient(180deg, var(--bg1), var(--bg0));
    background-attachment: fixed;
  }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 28px 28px 0; }

  /* ---------- 顶部：标题 + 总进度（横向） ---------- */
  .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 460px); align-items: center; gap: 14px 44px; padding: 22px 28px;
         border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
         box-shadow: 0 20px 60px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04); }
  .eyebrow { font-size: 12.5px; letter-spacing: .32em; color: var(--ink3); text-transform: uppercase; }
  .top h1 { margin: 6px 0 4px; font-size: 30px; font-weight: 700; letter-spacing: .04em; }
  .hsub { color: var(--ink2); font-size: 13.5px; }
  .big { display: flex; align-items: baseline; gap: 10px; }
  .big .pct { font-size: 60px; font-weight: 800; line-height: 1; letter-spacing: -.02em;
              background: linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .big .lbl { font-size: 13px; letter-spacing: .3em; color: var(--ink3); }
  .dots::after { content: "…"; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.6s steps(4, end) infinite; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { 0% { width: 0; } 100% { width: 1.2em; } }
  .bar { position: relative; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
  .bar.big-bar { height: 16px; margin: 10px 0 10px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05); }
  .bar.big-bar > i { background: linear-gradient(90deg, var(--accent1), var(--accent2)); box-shadow: 0 0 18px rgba(54, 209, 255, .45); }
  .bar.big-bar > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, .35) 45%, transparent 70%);
                            transform: translateX(-100%); animation: shine 2.6s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(160%); } }
  .tip { color: var(--ink2); font-size: 13.5px; min-height: 1.6em; transition: opacity .35s; }
  .tip b { color: var(--start); font-weight: 600; }

  /* 流程大纲：先「可以运行」，再并行推进各条线；汇报时一眼看全，点卡片跳到对应环节。宽屏横排，窄屏竖排 */
  .flow { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
  .flow .cap { font-size: 11px; letter-spacing: .24em; color: var(--ink3); }
  .flow .c1 { display: none; }
  .flow > .lane { order: 1; }
  .flow .arrow { order: 2; color: var(--ink3); text-align: center; font-size: 20px; line-height: 26px; transform: rotate(90deg); }
  .flow .c3 { order: 3; }
  .flow .par { order: 4; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .lane { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto auto; align-items: baseline; column-gap: 10px; padding: 10px 13px 11px;
          border: 1px solid var(--line); border-radius: 10px; background: rgba(10, 16, 30, .55); color: inherit; text-decoration: none; }
  .lane:hover { border-color: rgba(76, 195, 255, .45); }
  .lane .k { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink3); letter-spacing: .06em; }
  .lane .t { grid-column: 1 / -1; align-self: start; font-size: 14.5px; font-weight: 600; line-height: 1.45; }
  .lane .v { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .lane .w { font-size: 11.5px; color: var(--ink3); text-align: right; }
  .lane .bar { grid-column: 1 / -1; height: 5px; margin-top: 4px; }

  /* ---------- 左侧目录（固定）+ 右侧正文 ---------- */
  .layout { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 28px; align-items: start; }
  .main { min-width: 0; padding-bottom: 70px; }   /* 页尾留白放在正文里：滚到底时左侧目录也不会被顶上去 */
  .nav { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 12px 10px 14px; border: 1px solid var(--line);
         border-radius: 14px; background: rgba(10, 16, 30, .6); scrollbar-width: thin; scrollbar-color: rgba(120, 150, 200, .3) transparent; }
  .nav-total { display: flex; align-items: baseline; justify-content: space-between; padding: 0 8px 8px; margin-bottom: 2px; border-bottom: 1px solid var(--line);
               font-size: 12.5px; color: var(--ink3); }
  .nav-total b { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav-sep { margin: 10px 8px 0; font-size: 11px; letter-spacing: .24em; color: var(--ink3); }
  .nav a { display: block; color: inherit; text-decoration: none; }
  .nav-t { margin-top: 4px; padding: 6px 10px; border: 1px solid transparent; border-radius: 9px; }
  .nav-t:hover { background: rgba(255, 255, 255, .04); }
  .nav-t.on { border-color: rgba(76, 195, 255, .45); background: rgba(54, 209, 255, .07); }
  .nav-t .nk { display: block; font-size: 11px; line-height: 1.4; color: var(--ink3); letter-spacing: .06em; }
  .nav-t .nr { display: flex; align-items: baseline; gap: 8px; line-height: 1.4; }
  .nav-t .nn { flex: 1 1 auto; font-size: 14.5px; font-weight: 600; }
  .nav-t .np { flex: 0 0 auto; font-size: 15px; font-weight: 700; }
  .nav-t .bar { height: 4px; margin-top: 5px; }
  .nav-n { display: flex !important; align-items: baseline; gap: 8px; margin: 1px 0 0 6px; padding: 3px 10px 3px 12px; font-size: 12.5px; line-height: 1.45; color: var(--ink2);
           border-left: 2px solid var(--line); border-radius: 0 6px 6px 0; }
  .nav-n:hover { color: var(--ink); background: rgba(255, 255, 255, .04); }
  .nav-n.on { color: var(--ink); border-left-color: var(--accent1); background: rgba(54, 209, 255, .07); }
  .nav-n .ni { flex: 0 0 auto; font: 600 11px/1 Consolas, "Cascadia Mono", monospace; color: var(--ink3); }
  .nav-n .nt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-n .np { flex: 0 0 auto; font-size: 12px; font-weight: 600; }

  /* ---------- 图例与工具条 ---------- */
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; margin: 22px 2px 10px; color: var(--ink2); font-size: 13px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: currentColor; }
  .lg-done { color: var(--done); } .lg-doing { color: var(--doing); } .lg-start { color: var(--start); }
  .toolbar .sp { flex: 1; }
  .btn { font: inherit; font-size: 13px; color: var(--ink); background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  .btn:hover { background: rgba(255, 255, 255, .09); }

  /* ---------- 环节与节点 ---------- */
  section.track { margin-top: 26px; scroll-margin-top: 16px; }
  .thead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 0 4px 8px; border-bottom: 1px solid var(--line); }
  .thead h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .thead .kind { font-size: 12px; color: var(--ink3); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .thead .tw { color: var(--ink3); font-size: 12.5px; }
  .thead .tp { margin-left: auto; font-size: 18px; font-weight: 700; }
  .tdesc { color: var(--ink2); font-size: 13px; margin: 8px 4px 0; }
  .node { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; scroll-margin-top: 16px; }
  .nbtn { width: 100%; display: block; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 13px 16px 14px; cursor: pointer; }
  .nbtn:hover { background: rgba(255, 255, 255, .025); }
  .nbtn:focus-visible { outline: 2px solid var(--accent1); outline-offset: -2px; border-radius: 12px; }
  .nrow { display: flex; align-items: center; gap: 12px; }
  .idx { flex: 0 0 auto; font: 600 12px/1 Consolas, "Cascadia Mono", monospace; color: var(--ink3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .ntitle { flex: 1 1 auto; font-size: 15.5px; font-weight: 600; }
  .ntitle small { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink3); margin-top: 1px; }
  .npct { flex: 0 0 auto; font-size: 18px; font-weight: 700; min-width: 3.2em; text-align: right; }
  .chev { flex: 0 0 auto; width: 18px; height: 18px; color: var(--ink3); transition: transform .25s; }
  .node.open .chev { transform: rotate(90deg); }
  .nbtn .bar { margin-top: 10px; height: 8px; }
  .subs { display: none; padding: 2px 16px 12px; border-top: 1px dashed var(--line); background: rgba(6, 10, 19, .35); }
  .node.open .subs { display: block; }

  /* 子项：标题 + 进度 + 当前值 / 阶段条 + 100% 目标 + 进度依据 */
  .sub { padding: 12px 2px 11px; border-bottom: 1px solid rgba(120, 150, 200, .08); }
  .sub:last-child { border-bottom: 0; }
  .sh { display: flex; align-items: baseline; gap: 10px; }
  .sh .st { flex: 1 1 auto; font-size: 14.5px; font-weight: 600; }
  .sh .sp2 { flex: 0 0 auto; font-size: 14.5px; font-weight: 700; }
  .sub .bar { height: 5px; margin-top: 7px; }
  .now { margin-top: 5px; font-size: 12.5px; color: var(--ink2); }
  .now b { color: var(--ink); font-weight: 600; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
  .step { font-size: 11.5px; color: var(--ink3); text-align: center; }
  .step i { display: block; height: 6px; border-radius: 3px; margin-bottom: 4px;
            background: linear-gradient(90deg, var(--c, var(--doing)) calc(var(--f) * 100%), var(--track) calc(var(--f) * 100%)); }
  .step.on { color: var(--ink); }
  .kv { margin-top: 6px; font-size: 13px; color: var(--ink2); display: grid; grid-template-columns: 5.6em 1fr; gap: 2px 8px; }
  .kv .k { color: var(--ink3); }
  .tag { display: inline-block; font-size: 11px; font-weight: 400; color: var(--ink3); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; }
  .sub.info .st { color: var(--ink2); font-weight: 500; }
  .done { color: var(--done); } .doing { color: var(--doing); } .start { color: var(--start); }
  .f-done { background: var(--done); } .f-doing { background: var(--doing); } .f-start { background: var(--start); }
  .nweight { margin-top: 8px; font-size: 12px; color: var(--ink3); }

  /* ---------- 底部口径 ---------- */
  .foot { margin-top: 30px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: rgba(10, 16, 30, .5); color: var(--ink2); font-size: 13px; }
  .foot h3 { margin: 12px 0 6px; font-size: 14px; color: var(--ink); }
  .foot h3:first-child { margin-top: 0; }
  .foot p, .foot li { margin: 5px 0; }
  .foot ul { margin: 4px 0; padding-left: 20px; }
  .foot b { color: var(--ink); }
  .foot a { color: var(--accent1); }
  .foot .date { color: var(--ink3); }

  /* ---------- 编辑模式 ---------- */
  [hidden] { display: none !important; }
  .btn.primary { background: linear-gradient(90deg, rgba(54, 209, 255, .26), rgba(124, 108, 255, .26)); border-color: rgba(76, 195, 255, .55); }
  .btn.primary:hover { background: linear-gradient(90deg, rgba(54, 209, 255, .4), rgba(124, 108, 255, .4)); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn .pen { width: 13px; height: 13px; margin-right: 5px; vertical-align: -1px; color: var(--ink2); }
  .editing .ed, .editing .num { scroll-margin: 90px 0 40px; }
  .estat { font-size: 12.5px; color: var(--ink3); }
  .estat.warn, .estat .wwarn { color: var(--start); }
  .estat.ok { color: var(--done); }
  .estat.err { color: var(--bad); }
  .linkbtn { font: inherit; color: var(--accent1); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .editing .legend { display: none; }
  .editing .toolbar { position: sticky; top: 0; z-index: 30; margin-left: -12px; margin-right: -12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px;
                      background: rgba(9, 14, 27, .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
  .ehint { display: none; margin: 0 2px 4px; font-size: 12.5px; color: var(--ink3); }
  .ehint b { color: var(--ink2); font-weight: 600; }
  .editing .ehint { display: block; }
  .edmark { outline: 1px dashed rgba(76, 195, 255, .6); outline-offset: 1px; border-radius: 3px; padding: 0 2px; color: var(--ink2); }
  .ed { outline: 1px dashed rgba(76, 195, 255, .3); outline-offset: 2px; border-radius: 3px; cursor: text; }
  .ed:hover { outline-color: rgba(76, 195, 255, .7); }
  .ed:focus { outline: 2px solid var(--accent1); outline-offset: 2px; background: rgba(54, 209, 255, .08); }
  .ed:empty::before { content: attr(data-ph); color: var(--ink3); opacity: .75; font-weight: 400; font-style: italic; }
  span.ed:empty, b.ed:empty { display: inline-block; min-width: 4em; }
  .editing .kv { row-gap: 7px; margin-top: 8px; }
  .editing section.track, .editing .node { scroll-margin-top: 84px; }   /* 跳转时不被吸顶的工具条挡住 */
  .editing .now { margin-top: 7px; }
  .foot.ed-area { outline: 1px dashed rgba(76, 195, 255, .3); outline-offset: 3px; cursor: text; }
  .foot.ed-area:hover { outline-color: rgba(76, 195, 255, .7); }
  .foot.ed-area:focus { outline: 2px solid var(--accent1); }
  .num { width: 3.6em; font: inherit; color: var(--ink); text-align: right; background: rgba(255, 255, 255, .05); border: 1px solid rgba(76, 195, 255, .4);
         border-radius: 5px; padding: 0 4px; margin: 0 2px; line-height: 1.45; }
  .num:hover { border-color: rgba(76, 195, 255, .75); }
  .num:focus { outline: 2px solid var(--accent1); outline-offset: 0; background: rgba(54, 209, 255, .1); }
  .sp2 .num { color: inherit; font-weight: 700; }
  .num.sm { width: 3.1em; font-size: 11px; padding: 0 3px; }
  .ectl { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 9px; font-size: 12px; color: var(--ink3); }
  .ectl .sp { flex: 1; }
  .ectl label { white-space: nowrap; }
  .ectl .num { font-weight: 600; }
  .ebtn { font: inherit; font-size: 12px; color: var(--ink2); background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 6px; padding: 1px 9px; cursor: pointer; }
  .ebtn:hover:not(:disabled) { color: var(--ink); background: rgba(255, 255, 255, .1); }
  .ebtn:disabled { opacity: .35; cursor: default; }
  .ebtn.add { color: var(--accent1); border-style: dashed; border-color: rgba(76, 195, 255, .45); }
  .ebtn.del:hover:not(:disabled) { color: var(--bad); border-color: rgba(248, 113, 113, .5); }
  .esel { font: inherit; font-size: 12px; color: var(--ink); background: #101a31; border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; color-scheme: dark; }
  .nctl { margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .tctl { margin-top: 10px; }
  .tog { display: inline-flex; flex: 0 0 auto; background: none; border: 0; padding: 3px; margin: -3px; color: inherit; cursor: pointer; border-radius: 6px; }
  .tog:hover { background: rgba(255, 255, 255, .07); }
  .tog:focus-visible { outline: 2px solid var(--accent1); }
  .draft { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 18px; padding: 10px 14px; border: 1px solid rgba(251, 191, 36, .4);
           border-radius: 10px; background: rgba(251, 191, 36, .08); font-size: 13px; color: var(--ink2); }
  .draft > span { flex: 1 1 260px; }
  .draft b { color: var(--start); }
  /* 超链接：字段里的链接、链接编辑框、光标在链接上时的小气泡 */
  .kv a, .now a, .tdesc a { color: var(--accent1); text-decoration: none; border-bottom: 1px solid rgba(54, 209, 255, .4); }
  .kv a:hover, .now a:hover, .tdesc a:hover { border-bottom-color: var(--accent1); }
  .editing .ed a, .foot.ed-area a { cursor: text; }
  .lpop { position: absolute; z-index: 60; width: 360px; max-width: calc(100vw - 16px); padding: 12px 12px 10px; border: 1px solid rgba(76, 195, 255, .45); border-radius: 10px;
          background: #0d1628; box-shadow: 0 14px 40px rgba(0, 0, 0, .55); font-size: 12.5px; color: var(--ink2); }
  .lpop label { display: block; margin-bottom: 8px; }
  .lpop input { display: block; width: 100%; margin-top: 3px; font: inherit; font-size: 13px; color: var(--ink); background: rgba(255, 255, 255, .05);
                border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .lpop input:focus { outline: 2px solid var(--accent1); outline-offset: 0; }
  .lperr { color: var(--bad); margin: -2px 0 8px; }
  .lperr:empty { display: none; }
  .lpbtns { display: flex; align-items: center; gap: 8px; }
  .lpbtns .sp { flex: 1; }
  .lpbtns .btn { font-size: 12.5px; padding: 3px 12px; }
  .lbub { position: absolute; z-index: 55; display: flex; align-items: center; gap: 10px; max-width: min(480px, calc(100vw - 16px)); padding: 5px 10px;
          border: 1px solid var(--line); border-radius: 8px; background: #0d1628; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); font-size: 12px; color: var(--ink3); }
  .lbub .lburl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }

  @media (min-width: 1360px) {
    /* 横向阅读：「100% 目标」和「进度依据」左右并排 */
    .kv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto; grid-auto-flow: column; gap: 1px 28px; }
    /* 流程大纲横排：可以运行 → 各并行线排成一行 */
    .flow { grid-template-columns: minmax(150px, 200px) 34px minmax(0, 1fr); grid-template-rows: auto auto; }
    .flow .c1 { display: block; grid-area: 1 / 1; }
    .flow .c3 { grid-area: 1 / 3; }
    .flow > .lane { grid-area: 2 / 1; }
    .flow .arrow { grid-area: 2 / 2; align-self: center; transform: none; }
    .flow .par { grid-area: 2 / 3; }
  }
  @media (max-width: 1100px) {
    .top { grid-template-columns: 1fr; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .nav { display: none !important; }   /* 窄窗口不放侧边目录：用顶部流程大纲的卡片跳转 */
  }
  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 50px; }
    .top { padding: 18px 16px; }
    .top h1 { font-size: 24px; }
    .big .pct { font-size: 52px; }
    .ntitle { font-size: 14.5px; }
    .kv { grid-template-columns: 1fr; }
    .kv .k { margin-top: 4px; }
    .editing .toolbar { margin-left: -6px; margin-right: -6px; }
  }
  .noanim .bar > i { transition: none; }
  .noanim .bar.big-bar > i::after { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .bar > i { transition: none; }
    .bar.big-bar > i::after, .dots::after { animation: none; }
  }
  @media print {
    body { background: #fff; color: #111; }
    .node .subs { display: block; }
    .toolbar .btn, .chev { display: none; }
    .bar > i { transition: none; }
    .ectl, .ehint, .draft, .estat, .tog, .lpop, .lbub { display: none !important; }
    .kv a, .now a, .tdesc a { color: inherit; border: 0; }
    .ed, .foot.ed-area { outline: none !important; }
    .editing .toolbar { position: static; box-shadow: none; }
    .nav { display: none !important; }

    if (!EDIT) return;
    var t = e.target;
    if (t.classList.contains("num")) { var v = parseNum(t.value); if (v != null) { numSet(t, v); refresh(); changed(); } return; }
    if (t.hasAttribute("data-path")) { setPath(t.getAttribute("data-path"), t.hasAttribute("data-rich") ? richVal(t) : oneLine(t.textContent)); refresh(); changed(); return; }
    if (t === footEl) { D.foot = cleanHtml(footEl.innerHTML); changed(); }
  });
  wrapEl.addEventListener("change", function (e) {
    var t = e.target;
    if (!EDIT || !t.matches("select[data-sel=type]")) return;
    var k = t.getAttribute("data-k"), s = at(k);
    if (!s) return;
    setType(s, t.value); render(); changed();
    var sel = tracksEl.querySelector('select[data-k="' + k + '"]');
    if (sel) sel.focus();
  });
  wrapEl.addEventListener("focusin", function (e) {
    var t = e.target;
    if (!t.hasAttribute || !t.hasAttribute("data-path")) return;
    if (t._keep) t._keep = false; else t._orig = t.innerHTML;   // 从链接框回来时保留最初的内容，Esc 仍能整体还原
  });
  wrapEl.addEventListener("focusout", function (e) {
    var t = e.target;
    if (!EDIT || !t.hasAttribute) return;
    if (t.classList.contains("num")) t.value = fmtNum(numVal(t));
    else if (t.hasAttribute("data-path")) commitField(t);
  });
  wrapEl.addEventListener("keydown", function (e) {
    var t = e.target;
    if (!EDIT || e.isComposing || e.keyCode === 229 || !t.hasAttribute) return;   // 输入法选词时不拦截
    if (t.classList.contains("num")) {
      if (e.key === "Enter") { e.preventDefault(); t.blur(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        var v = numSet(t, (parseNum(t.value) || 0) + (e.key === "ArrowUp" ? 1 : -1) * (e.shiftKey ? 10 : 1));
        t.value = fmtNum(v); refresh(); changed();
      }
    } else if (t.hasAttribute("data-path") || t === footEl) {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "k" || e.key === "K")) {
        e.preventDefault();
        if (t === footEl || t.hasAttribute("data-rich")) openLinkPop(t);
        else { setMsg("这一栏不能加链接；「100% 目标」「进度依据」「当前」、环节说明和底部说明可以"); updateBar(); }
        return;
      }
      if (t === footEl) return;
      if (e.key === "Enter") { e.preventDefault(); t.blur(); }
      else if (e.key === "Escape") { e.preventDefault(); if (t._orig != null) t.innerHTML = t._orig; t.blur(); }
    }
  });
  // 可含链接的字段仍是一行文字：不接受加粗、斜体、换行
  wrapEl.addEventListener("beforeinput", function (e) {
    var t = e.target;
    if (EDIT && t.hasAttribute && t.hasAttribute("data-rich") && /^format|^insertParagraph$|^insertLineBreak$/.test(e.inputType || "")) e.preventDefault();
  });
  // 粘贴只取纯文本，避免把别处的字体颜色带进来；选中文字后粘贴网址 = 给这段文字加链接
  wrapEl.addEventListener("paste", function (e) {
    if (!EDIT) return;
    var host = e.target.closest ? e.target.closest("[data-path], #foot") : null, cd = e.clipboardData, sel = window.getSelection();
    if (!host || !cd) return;
    var text = cd.getData("text/plain"), url = text.trim();
    e.preventDefault();
    if ((host === footEl || host.hasAttribute("data-rich")) && sel.rangeCount && !sel.isCollapsed && /^(https?:\/\/|www\.|file:\/\/)\S+$/i.test(url) && safeUrl(url)) {
      insertLink(host, normUrl(url), null);
      return;
    }
    document.execCommand("insertText", false, host.hasAttribute("data-path") ? oneLine(text) : text);
  });

  // ---------- 超链接：Ctrl+K / 「链接」按钮打开链接框；光标在链接上时显示地址小气泡 ----------
  var lpop = $("lpop"), lpText = $("lpText"), lpUrl = $("lpUrl"), lpErr = $("lpErr"), lpDel = $("lpDel"), lbub = $("lbub"), lbUrl = $("lbUrl"), linkBtn = $("linkBtn");
  var LP = null, BUB = null;
  function richHost(node) {
    var el = node && (node.nodeType === 1 ? node : node.parentNode), h = el && el.closest ? el.closest("[data-rich], #foot") : null;
    return h && (h !== footEl || EDIT) ? h : null;
  }
  function linkAt(node, host) {
    var el = node && (node.nodeType === 1 ? node : node.parentNode), a = el && el.closest ? el.closest("a[href]") : null;
    return a && host && a !== host && host.contains(a) ? a : null;
  }
  function linkTag(host, url, text) {
    return '<a href="' + esc(url) + '"' + (host === footEl ? ' target="_blank" rel="noopener"' : "") + ">" + esc(text || url) + "</a>";
  }
  // 用当前选区插入链接；选区碰到已有链接时整段替换，避免链接套链接
  function insertLink(host, url, text) {
    var sel = window.getSelection(), r = sel.rangeCount ? sel.getRangeAt(0) : null;
    if (r) {
      var a1 = linkAt(r.startContainer, host), a2 = linkAt(r.endContainer, host);
      if (a1 || a2) { if (a1) r.setStartBefore(a1); if (a2) r.setEndAfter(a2); sel.removeAllRanges(); sel.addRange(r); }
      if (text == null) text = oneLine(r.toString()).trim();
    }
    document.execCommand("insertHTML", false, linkTag(host, url, text));
  }
  function placeAt(el, rect) {
    el.hidden = false;
    var vw = document.documentElement.clientWidth, x = Math.max(8, Math.min(rect.left, vw - el.offsetWidth - 8));
    el.style.left = Math.round(x + window.scrollX) + "px";
    el.style.top = Math.round(rect.bottom + 6 + window.scrollY) + "px";
  }
  function hideBubble() { BUB = null; lbub.hidden = true; }
  function openLinkPop(host, a) {
    var sel = window.getSelection(), r = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
    if (!r || !host.contains(r.commonAncestorContainer)) { r = document.createRange(); r.selectNodeContents(host); r.collapse(false); }
    if (!a) { var a1 = linkAt(r.startContainer, host), a2 = linkAt(r.endContainer, host); if (a1 && a1 === a2) a = a1; }
    if (a) { r = document.createRange(); r.selectNode(a); }
    LP = { host: host, range: r, a: a || null };
    lpText.value = a ? oneLine(a.textContent) : oneLine(r.toString()).trim();
    lpUrl.value = a ? a.getAttribute("href") : "";
    lpDel.hidden = !a; lpErr.textContent = "";
    hideBubble();
    var rc = r.getBoundingClientRect();
    if (!rc.width && !rc.height) rc = host.getBoundingClientRect();
    placeAt(lpop, rc);
    (lpText.value ? lpUrl : lpText).focus();
  }
  function closeLinkPop(restore) {
    var p = LP;
    LP = null; lpop.hidden = true;
    if (p && restore && p.host.isConnected) {
      p.host._keep = true; p.host.focus();
      var sel = window.getSelection(); sel.removeAllRanges();
      try { sel.addRange(p.range); } catch (e) {}
    }
    return p;
  }
  function applyLink(remove) {
    if (!LP) return;
    var text = oneLine(lpText.value).trim(), url = normUrl(lpUrl.value);
    if (!remove && !url) { lpErr.textContent = "请填写链接地址"; lpUrl.focus(); return; }
    if (!remove && !safeUrl(url)) { lpErr.textContent = "这种地址不能用作链接，请换成网址或文件路径"; lpUrl.focus(); return; }
    var p = closeLinkPop(true);
    if (!p.host.isConnected) return;
    if (remove) document.execCommand("unlink");
    else insertLink(p.host, url, text || url);
  }
  lpop.addEventListener("keydown", function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter") { e.preventDefault(); applyLink(false); }
    else if (e.key === "Escape") { e.preventDefault(); closeLinkPop(true); }
  });
  $("lpOk").onclick = function () { applyLink(false); };
  lpDel.onclick = function () { applyLink(true); };
  $("lpCancel").onclick = function () { closeLinkPop(true); };
  document.addEventListener("mousedown", function (e) { if (LP && !lpop.contains(e.target)) closeLinkPop(false); }, true);
  document.addEventListener("selectionchange", function () {
    var sel = window.getSelection(), host = EDIT && !LP && sel.rangeCount ? richHost(sel.anchorNode) : null;
    var a = host && document.activeElement === host ? linkAt(sel.anchorNode, host) : null;
    if (!a) { if (!lbub.hidden) hideBubble(); return; }
    if (a === BUB && !lbub.hidden) return;
    BUB = a; lbUrl.textContent = a.getAttribute("href"); lbUrl.title = a.getAttribute("href");
    placeAt(lbub, a.getBoundingClientRect());
  });
  lbub.addEventListener("mousedown", function (e) { e.preventDefault(); });   // 点气泡里的按钮时，光标留在原处
  $("lbOpen").onclick = function () { if (BUB) window.open(BUB.href, "_blank", "noopener"); };
  $("lbEdit").onclick = function () { var a = BUB, host = a && richHost(a); if (host) openLinkPop(host, a); };
  $("lbDel").onclick = function () {
    var a = BUB, host = a && richHost(a), r, sel = window.getSelection();
    if (!host) return;
    r = document.createRange(); r.selectNode(a); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand("unlink"); hideBubble();
  };
  window.addEventListener("resize", hideBubble);
  linkBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });   // 不抢走编辑框的焦点和选区
  linkBtn.onclick = function () {
    var sel = window.getSelection(), host = sel.rangeCount ? richHost(sel.anchorNode) : null;
    if (host && document.activeElement === host) openLinkPop(host);
    else { setMsg("先在「100% 目标」「进度依据」「当前」、环节说明或底部说明里选中要加链接的文字"); updateBar(); }
  };

  // ---------- 保存 ----------
  // Edge / Chrome：在本文件所在的文件夹里改写本文件的数据段，页面其余部分一字不动；其它浏览器：下载新版
  function idb(mode, fn) {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("no indexedDB")); return; }
      var rq = indexedDB.open("mvp-progress-page", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("kv"); };
      rq.onerror = function () { rej(rq.error); };
      rq.onsuccess = function () {
        var db = rq.result, tx, r;
        try { tx = db.transaction("kv", mode); r = fn(tx.objectStore("kv")); } catch (e) { db.close(); rej(e); return; }
        tx.oncomplete = function () { db.close(); res(r ? r.result : undefined); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
      };
    });
  }
  function rememberDir(h) { idb("readwrite", function (st) { return st.put(h, PAGE_KEY); }).catch(function () {}); }
  function forgetDir() { dirHandle = null; idb("readwrite", function (st) { return st.delete(PAGE_KEY); }).catch(function () {}); }
  function named(name, msg) { var e = new Error(msg || name); e.name = name; return e; }
  async function ensurePerm(h) {
    if ((await h.queryPermission(RW)) === "granted") return;
    if ((await h.requestPermission(RW)) !== "granted") throw named("NotAllowedError");
  }
  function copyPath() {
    if (!DIR_PATH || !navigator.clipboard || !navigator.clipboard.writeText) return;
    try {
      navigator.clipboard.writeText(DIR_PATH).then(function () {
        if (ST.pick) { ST.pick += "（路径已复制，在弹窗里粘贴、回车即可定位）"; updateBar(); }
      }, function () {});
    } catch (e) {}
  }
  function download(json) {
    var out, a, url;
    try { out = fullPage(json); } catch (e) { setMsg("生成文件失败：" + e.message, "err"); updateBar(); return; }
    url = URL.createObjectURL(new Blob([out], { type: "text/html;charset=utf-8" }));
    a = document.createElement("a"); a.href = url; a.download = FILE_NAME; a.style.display = "none";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    setMsg("已下载新版「" + FILE_NAME + "」，用它替换原文件后修改才算保存", "warn"); updateBar();
  }
  async function save() {
    if (ST.busy) return;
    var a = document.activeElement;
    if (a && a.hasAttribute && a.hasAttribute("data-path")) commitField(a);
    sync();
    var json = serialize(D);
    if (!FS) { download(json); return; }
    ST.busy = true; setMsg(""); updateBar();
    var dir = dirHandle, fresh = !dir;
    try {
      if (!dir) {
        // 网页只能让弹窗从「上次选过的位置」或系统文件夹开始，无法直接指定本文件夹；
        // 所以第一次先把本文件夹路径复制好，粘贴进弹窗就能定位。选过一次之后浏览器会记住，不再弹出
        ST.pick = "请在弹出的窗口里选中本文件所在的文件夹" + (DIR_PATH ? "：" + DIR_PATH : "") + "，再点允许";
        copyPath(); updateBar();
        try { dir = await window.showDirectoryPicker({ id: "mvp-progress", mode: "readwrite" }); } finally { ST.pick = ""; }
        dirHandle = dir;
      }
      await ensurePerm(dir);
      var fh;
      try { fh = await dir.getFileHandle(FILE_NAME); }
      catch (e) { if (e && (e.name === "NotFoundError" || e.name === "TypeMismatchError")) { forgetDir(); throw named("NotHere"); } throw e; }
      var src = await (await fh.getFile()).text(), block = extract(src), out = null;
      if (block == null) {
        if (src.trim() && !confirm("「" + FILE_NAME + "」里没找到进度数据（可能是旧版本或别的文件）。\n仍要用当前页面覆盖它吗？")) throw named("Cancel");
        out = fullPage(json);
      } else {
        var disk = canon(block);
        if (disk !== json) {
          if (disk !== BASE && !confirm("「" + FILE_NAME + "」在你打开这个页面之后被改过（可能在别的窗口或由别人保存）。\n继续保存会用当前页面的内容覆盖那些修改，确定吗？")) throw named("Cancel");
          out = splice(src, json);
        }
      }
      if (out != null) {
        var w = await fh.createWritable();
        try { await w.write(out); await w.close(); } catch (e) { try { await w.abort(); } catch (e2) {} throw e; }
      }
      if (fresh) rememberDir(dir);
      BASE = json; ST.saved = hhmm(new Date()); setMsg("");
      sync();
    } catch (e) {
      var n = e && e.name;
      if (n === "AbortError" || n === "Cancel") setMsg("已取消保存");
      else if (n === "NotHere") setMsg(fresh ? "所选文件夹里没有「" + FILE_NAME + "」，请选本文件所在的文件夹" + (DIR_PATH ? "：" + DIR_PATH : "")
                                            : "原来的保存位置里找不到「" + FILE_NAME + "」，请再点一次「保存」重新选择文件夹", "err");
      else if (n === "NotAllowedError") setMsg("没有获得写入权限，没有保存。再点一次「保存」可以重新授权", "err");
      else if (n === "SecurityError") setMsg("浏览器需要你再点一次「保存」来确认授权", "err");
      else setMsg("保存失败：" + ((e && e.message) || e) + "。可以先", "err", true);
    } finally {
      ST.busy = false; updateBar();
    }
  }
  // 另存为：标准的「另存为」窗口，文件名预先填好；另存一份到任意位置，不改变「保存」写回的文件
  async function saveAs() {
    if (ST.busy) return;
    var a = document.activeElement;
    if (a && a.hasAttribute && a.hasAttribute("data-path")) commitField(a);
    sync();
    var json = serialize(D), out = null, cur = null;
    if (!FS_SAVE) { download(json); return; }
    ST.busy = true; setMsg(""); updateBar();
    try {
      // 已有本文件夹的写入权限时，以磁盘上的原文件为底（格式原样保留），否则由页面重新拼出完整 HTML
      if (dirHandle && (await dirHandle.queryPermission(RW)) === "granted") {
        try { cur = await dirHandle.getFileHandle(FILE_NAME); var src = await (await cur.getFile()).text(); if (extract(src) != null) out = splice(src, json); } catch (e) { cur = null; }
      }
      if (out == null) out = fullPage(json);
      var opts = { id: "mvp-progress-saveas", suggestedName: FILE_NAME, types: [{ description: "网页文件", accept: { "text/html": [".html", ".htm"] } }] };
      if (dirHandle) opts.startIn = dirHandle;
      var fh = await window.showSaveFilePicker(opts);
      var w = await fh.createWritable();
      try { await w.write(out); await w.close(); } catch (e) { try { await w.abort(); } catch (e2) {} throw e; }
      var same = false;
      try { same = !!(cur && (await fh.isSameEntry(cur))); } catch (e) {}
      if (same) { BASE = json; ST.saved = hhmm(new Date()); sync(); setMsg("已保存到当前文件「" + fh.name + "」", "ok"); }
      else setMsg("已另存为「" + fh.name + "」" + (DIRTY ? "；当前文件的修改还没保存" : ""), DIRTY ? "warn" : "ok");
    } catch (e) {
      if (e && e.name === "AbortError") setMsg("已取消另存为");
      else setMsg("另存为失败：" + ((e && e.message) || e), "err");
    } finally {
      ST.busy = false; updateBar();
    }
  }

  // ---------- 启动 ----------
  $("expandAll").onclick = function () { setAll(true); };
  $("collapseAll").onclick = function () { setAll(false); };
  editBtn.onclick = function () { setEdit(!EDIT); };
  saveBtn.onclick = function () { save(); };
  saveAsBtn.onclick = function () { saveAs(); };
  discardBtn.onclick = function () {
    if (!confirm("放弃所有未保存的修改，恢复到上次保存时的内容？")) return;
    blurActive(); replaceData(BASE); setMsg(""); render(); sync();
  };
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "s" || e.key === "S") && (EDIT || DIRTY)) {
      e.preventDefault();
      if (!e.shiftKey) save(); else if (FS_SAVE) saveAs();
    }
  });
  window.addEventListener("beforeunload", function (e) { sync(); if (DIRTY) { e.preventDefault(); e.returnValue = ""; } });
  if (FS) idb("readonly", function (st) { return st.get(PAGE_KEY); }).then(function (h) { if (h && h.kind === "directory" && !dirHandle) { dirHandle = h; updateBar(); } }).catch(function () {});

  checkDraft();
  if (location.hash === "#all") D.tracks.forEach(function (tr) { tr.nodes.forEach(function (n) { n._open = true; }); });
  if (location.hash === "#edit" && !PENDING) EDIT = true;
  render();
  showTip();
  if (!window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(showTip, 3200);

  // 进度条动画：载入后从 0 长到目标值；用 #all 打开（全部展开 / 截图）或打印时直接显示最终宽度
  var noAnim = location.hash === "#all";
  if (noAnim) root.classList.add("noanim");
  function grow() { each(document.querySelectorAll(".bar > i"), function (i) { i.style.width = i.getAttribute("data-w") + "%"; }); grown = true; }
  if (noAnim) grow(); else requestAnimationFrame(function () { setTimeout(grow, 60); });
  window.addEventListener("beforeprint", function () { root.classList.add("noanim"); grow(); });
})();
</script>
</body>
